<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <title>Liberty Estimating — Live Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tv.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="tv-header">
    <img src="/logo.png" alt="Liberty" class="tv-logo" />
    <div class="tv-title">ESTIMATING PIPELINE</div>
    <div class="tv-header-clock">
      <span class="tv-time" id="tv-time"></span>
      <span class="tv-date" id="tv-date"></span>
    </div>
  </header>

  <!-- STATS BAR -->
  <div class="tv-stats">
    <div class="tv-stat">
      <span class="tv-stat-val" id="stat-bids">—</span>
      <span class="tv-stat-label">Active Bids</span>
    </div>
    <div class="tv-stat">
      <span class="tv-stat-val" id="stat-cos">—</span>
      <span class="tv-stat-label">Change Orders</span>
    </div>
    <div class="tv-stat">
      <span class="tv-stat-val" id="stat-value">—</span>
      <span class="tv-stat-label">Pipeline Value</span>
    </div>
    <div class="tv-stat">
      <span class="tv-stat-val" id="stat-week">—</span>
      <span class="tv-stat-label">Due This Week</span>
    </div>
    <div class="tv-stat">
      <span class="tv-stat-val" id="stat-overdue">—</span>
      <span class="tv-stat-label">Overdue</span>
    </div>
    <div class="tv-stat">
      <span class="tv-stat-val" id="stat-refresh">—</span>
      <span class="tv-stat-label">Last Update</span>
    </div>
  </div>

  <!-- TABLE HEADER -->
  <div class="tv-table-head">
    <div class="tv-th"></div>
    <div class="tv-th">Project</div>
    <div class="tv-th center">Type</div>
    <div class="tv-th right">Amount</div>
    <div class="tv-th right">Due Date</div>
  </div>

  <!-- SCROLLING ROWS -->
  <div class="tv-rows-wrap" id="tv-rows-wrap">
    <div class="tv-rows" id="tv-rows">
      <div class="tv-empty">Loading pipeline data…</div>
    </div>
  </div>

  <!-- PAGE INDICATOR -->
  <div class="tv-pager" id="tv-pager"></div>

  <!-- WINS BANNER -->
  <div class="tv-wins" id="tv-wins" style="display:none">
    <div class="tv-wins-lbl">🏆 RECENTLY AWARDED</div>
    <div class="tv-wins-stage"></div>
    <div class="tv-wins-dots"></div>
  </div>

  <!-- NO WINS BAR -->
  <div class="tv-no-wins" id="tv-no-wins">
    No recent awards found — keep pushing! 💪
  </div>

  <!-- AUTH ERROR -->
  <div class="tv-error" id="tv-error" style="display:none">
    <div class="tv-error-inner">
      <div style="font-size:64px">🔒</div>
      <p>Invalid TV token — check the URL and try again.</p>
    </div>
  </div>

  <script src="/tv.js"></script>
</body>
</html>
