<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v2 Preview — LIS Estimating</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css">
<style>
  /* Page scaffolding (no sidebar in the preview — single column like a report) */
  body { padding: 0; margin: 0; }
  .v2-banner {
    background: #1e293b; padding: 12px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .v2-banner .ttl { color: #fff; font-size: 15px; font-weight: 700; }
  .v2-banner .tag { background: #f59e0b; color: #1e293b; font-size: 10px; font-weight: 800; padding: 2px 10px; border-radius: 10px; letter-spacing: .5px; }
  .v2-banner .sub { color: #94a3b8; font-size: 12px; margin-left: auto; }
  .v2-banner a { color: #7dd3fc; text-decoration: none; }
  .v2-wrap { max-width: 920px; margin: 24px auto; padding: 0 20px; }

  /* Hierarchy nesting — matches the v1 project panel look */
  .v2-hier { display: none; border-top: 1px solid var(--border); padding: 14px 20px 18px; background: #fcfdfe; }
  .v2-hier.open { display: block; }
  .v2-bid {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card-bg); padding: 12px 14px; margin-top: 10px;
    box-shadow: var(--shadow);
  }
  .v2-bid.awarded { border-left: 3px solid #16a34a; background: #f0fdf4; }
  .v2-job {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border); border-left: 3px solid #0891b2;
    border-radius: var(--radius); background: #f0fdff; padding: 10px 14px;
    margin: 8px 0 0 28px;
  }
  .v2-co {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 12px 8px 14px; margin-left: 56px;
    border-left: 2px solid var(--border);
  }
  .v2-co:last-child { border-radius: 0 0 6px 0; }
  .v2-fu {
    border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 6px;
    font-size: 12px; color: var(--text-muted);
  }
  .v2-fu-row { padding: 2px 0; }
  .awarded-pill {
    display: inline-block; background: #16a34a; color: #fff;
    font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
  }
  .pending-pill {
    display: inline-block; background: #fef3c7; color: #92400e;
    font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
  }
  .legacy-pill {
    display: inline-block; background: #ede9fe; color: #5b21b6;
    font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
  }
  .amount { font-weight: 700; color: #166534; }
  .overdue-txt { color: #dc2626; font-weight: 700; }
  .err-card { background: #fee2e2; color: #991b1b; padding: 16px 20px; border-radius: var(--radius); font-size: 14px; }

  /* Action buttons + modal */
  .v2-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .v2-btn {
    font-family: inherit; font-size: 11px; font-weight: 700; padding: 4px 12px;
    border-radius: 6px; border: none; cursor: pointer; color: #fff; transition: opacity .12s;
  }
  .v2-btn:hover { opacity: .85; }
  .v2-btn.green { background: #16a34a; } .v2-btn.blue { background: #2563eb; }
  .v2-btn.red { background: #dc2626; } .v2-btn.gray { background: #64748b; }
  .v2-btn.amber { background: #d97706; } .v2-btn.outline { background: #fff; color: #475569; border: 1px solid var(--border); }
  .v2-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .v2-modal {
    background: #fff; border-radius: 10px; width: 100%; max-width: 440px;
    max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .v2-modal-hd {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 800; font-size: 14px;
  }
  .v2-modal-bd { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .v2-modal-ft { padding: 0 20px 18px; display: flex; gap: 8px; justify-content: flex-end; }
  .v2-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .v2-field label .req { color: #dc2626; }
  .v2-field input, .v2-field select, .v2-field textarea {
    width: 100%; font-family: inherit; font-size: 13px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text);
  }
  .v2-field input:focus, .v2-field select:focus, .v2-field textarea:focus {
    outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1);
  }
  .v2-check { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; cursor: pointer; }
  .v2-modal-err { color: #dc2626; font-size: 12px; font-weight: 600; display: none; padding: 0 20px 10px; }
</style>
</head>
<body>
  <div class="v2-banner">
    <span class="ttl">🏗️ LIS Estimating Calendar</span>
    <span class="tag">V2 PREVIEW</span>
    <span class="sub">Test data only · <a href="/">← back to live app</a></span>
  </div>
  <div class="v2-wrap">
    <div class="page-header">
      <div>
        <div class="page-title">🏗️ Projects — New Data Model</div>
        <div class="page-subtitle">Project → Bids → Job → Change Orders · fake dataset for review</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="v2-btn green" style="padding:8px 14px;font-size:12px" onclick="actNewBid()">+ New Bid</button>
        <button class="v2-btn blue" style="padding:8px 14px;font-size:12px" onclick="actNewOpportunity()">+ New Opportunity</button>
        <button class="v2-btn outline" style="padding:8px 14px;font-size:12px" onclick="actNewLegacyJob()">+ Legacy Job</button>
      </div>
    </div>
    <div class="card" style="padding:0" id="main"><div style="padding:30px;text-align:center;color:var(--text-muted)">Loading…</div></div>
  </div>

<script>
const fmt$ = n => n == null ? '' : new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);
const fmtD = d => { if (!d) return ''; const [y,m,dd] = d.split('-'); return `${Number(m)}/${Number(dd)}/${String(y).slice(2)}`; };
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = new Date().toISOString().split('T')[0];
const STAGE = {
  opportunity:'Opportunity', active_bid:'Active Bid', submitted:'Submitted', awarded:'Awarded',
  not_awarded:'Not Awarded', closed:'Closed',
  active_co:'Active CO', submitted_co:'Submitted CO', approved:'Approved', not_approved:'Not Approved', voided:'Voided',
};
const STAGE_COLOR = {
  opportunity:'#64748b', active_bid:'#d97706', submitted:'#2563eb', awarded:'#16a34a',
  not_awarded:'#dc2626', closed:'#64748b',
  active_co:'#d97706', submitted_co:'#2563eb', approved:'#16a34a', not_approved:'#dc2626', voided:'#64748b',
};
const METHOD = { phone:'📞 phone', email:'✉️ email', in_person:'🤝 in person', other:'other' };

const stageBadge = s => `<span class="badge badge-stage" style="color:${STAGE_COLOR[s]};font-weight:700">${STAGE[s] || s}</span>`;
const ini = m => m ? `<span class="initials-pill" style="transform:scale(.85);transform-origin:center" title="${esc(m.name || '')}">${esc(m.initials)}</span>` : '';

let META = { companies: [], team: [] };
let CURRENT_USER = null;          // { id, name, is_admin } — gates admin-only actions
let ALL_PROJECTS = [];            // [{id, name}] for the "existing project" picker
let OPEN_PROJECT = null;          // project id whose hierarchy is expanded
let DETAIL_CACHE = {};            // project id → detail payload (for award winner picker)

async function api(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

async function load() {
  const main = document.getElementById('main');
  let projects;
  try {
    const r = await fetch('/api/v2/projects');
    if (r.status === 401) { main.innerHTML = '<div class="err-card">Not logged in. <a href="/">Log in on the main app</a> first, then come back to /v2.</div>'; return; }
    projects = await r.json();
    ALL_PROJECTS = projects.map(p => ({ id: p.id, name: p.name }));
    if (!META.companies.length) { META = await api('GET', '/api/v2/meta'); CURRENT_USER = META.current_user; }
  } catch (e) { main.innerHTML = `<div class="err-card">${esc(e.message)}</div>`; return; }

  main.innerHTML = projects.map(p => `
    <div>
      <div class="proj-row" onclick="toggle(${p.id})">
        <div style="flex:1;min-width:0">
          <div class="proj-name">${esc(p.name)}</div>
          <div class="proj-meta">
            ${p.bid_count} bid${p.bid_count!==1?'s':''}
            <span class="proj-meta-sep">·</span> ${p.job_count} job${p.job_count!==1?'s':''}
            <span class="proj-meta-sep">·</span> ${p.co_count} CO${p.co_count!==1?'s':''}
            ${p.pipeline_value ? `<span class="proj-meta-sep">·</span> pipeline <span class="amount">${fmt$(p.pipeline_value)}</span>` : ''}
            ${p.won_value ? `<span class="proj-meta-sep">·</span> won <span class="amount">${fmt$(p.won_value)}</span>` : ''}
            ${p.customers.length ? `<span class="proj-meta-sep">·</span> <span class="proj-meta-customers">${esc(p.customers.join(', '))}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
          ${p.job_numbers.map(j => `<span class="proj-active-badge">Job ${esc(j)}</span>`).join('')}
          ${p.job_number_pending ? '<span class="pending-pill">JOB # PENDING</span>' : ''}
          ${p.is_legacy ? '<span class="legacy-pill">LEGACY</span>' : ''}
          ${p.active_count ? `<span class="badge badge-bid">${p.active_count} active</span>` : ''}
        </div>
      </div>
      <div class="v2-hier" id="hier-${p.id}"></div>
    </div>`).join('');
}

async function toggle(id) {
  const el = document.getElementById('hier-' + id);
  if (el.classList.contains('open')) { el.classList.remove('open'); OPEN_PROJECT = null; return; }
  document.querySelectorAll('.v2-hier.open').forEach(h => h.classList.remove('open'));
  el.classList.add('open');
  OPEN_PROJECT = id;
  if (el.dataset.loaded) return;
  el.innerHTML = '<div style="padding:16px;color:var(--text-muted)">Loading…</div>';
  const d = await api('GET', '/api/v2/projects/' + id);
  DETAIL_CACHE[id] = d;
  el.dataset.loaded = '1';
  el.innerHTML = renderHierarchy(d);
}

// Refresh everything after an action, keeping the current project expanded
async function refresh() {
  const keep = OPEN_PROJECT;
  DETAIL_CACHE = {};
  await load();
  if (keep != null) {
    const el = document.getElementById('hier-' + keep);
    if (el) {
      el.classList.add('open');
      OPEN_PROJECT = keep;
      const d = await api('GET', '/api/v2/projects/' + keep);
      DETAIL_CACHE[keep] = d;
      el.dataset.loaded = '1';
      el.innerHTML = renderHierarchy(d);
    }
  }
}

function renderHierarchy(d) {
  let html = `<div class="v2-actions" style="margin:0 0 4px">
    <button class="v2-btn green" onclick="actAddBidToProject(${d.id})">+ Add Bid to this Project</button>
    ${CURRENT_USER?.is_admin ? `<button class="v2-btn outline" onclick="actEditProject(${d.id})">✏️ Edit Project</button>` : ''}
    <span style="font-size:11px;color:var(--text-muted);align-self:center">new B26-#### for another drawing stage / re-bid</span>
  </div>`;
  const jobByWinningBid = {};
  d.jobs.forEach(j => { if (j.winning_bid_id) jobByWinningBid[j.winning_bid_id] = j; });
  for (const b of d.bids) {
    html += bidNode(b);
    const job = jobByWinningBid[b.id];
    if (job) html += jobNode(job);
  }
  for (const j of d.jobs.filter(j => !j.winning_bid_id)) html += jobNode(j, true);
  return html || '<div style="padding:10px;color:var(--text-muted);font-size:13px">Nothing here yet.</div>';
}

function bidNode(b) {
  const isAwarded = b.stage === 'awarded';
  return `
    <div class="v2-bid ${isAwarded ? 'awarded' : ''}" ${b.superseded ? 'style="opacity:.6"' : ''}>
      <div style="flex:1;min-width:0">
        <div style="font-weight:${isAwarded?'800':'600'};font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${isAwarded ? '✓' : ''} ${b.bid_number ? esc(b.bid_number) : '<em style="color:var(--text-muted);font-weight:400">no bid #</em>'}
          ${isAwarded ? '<span class="awarded-pill">AWARDED</span>' : stageBadge(b.stage)}
          ${b.superseded ? '<span class="badge" style="background:#e2e8f0;color:#64748b">SUPERSEDED</span>' : ''}
          ${b.drawing_stage ? `<span class="badge" style="background:#ede9fe;color:#5b21b6">${esc(b.drawing_stage)}</span>` : ''}
          ${b.estimate_amount ? `<span class="amount">${fmt$(b.estimate_amount)}</span>` : ''}
          ${(b.submissions || []).filter(s => s.is_current).length > 1 ? `<span class="badge" style="background:#dbeafe;color:#1e40af">${b.submissions.filter(s => s.is_current).length} customers</span>` : ''}
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.6">
          ${b.customers.length ? `Bid to: <strong style="color:var(--text)">${esc(b.customers.map(c=>c.name).join(', '))}</strong>` : ''}
          ${b.awarded_company ? ` · Won by <strong style="color:#16a34a">${esc(b.awarded_company.name)}</strong> ${fmtD(b.award_date)}` : ''}
          <br>
          ${b.estimator ? `Est: ${ini(b.estimator)}` : ''}
          ${b.sub_estimators.map(s => `${ini(s)}<span style="font-size:10px">${esc(s.scope)}</span>`).join(' ')}
          ${b.salesperson ? ` Sales: ${ini(b.salesperson)}` : ''}
          ${b.due_date ? ` · Due ${fmtD(b.due_date)}` : ''}
          ${b.jurisdiction ? ` · Local ${esc(b.jurisdiction)}` : ''}
          ${b.next_followup_date ? ` · Next F/U: <span class="${b.next_followup_date < today ? 'overdue-txt' : ''}">${fmtD(b.next_followup_date)}${b.next_followup_date < today ? ' — OVERDUE' : ''}</span>` : ''}
          ${b.close_reason ? `<br>Closed ${fmtD(b.closed_date)} by ${esc(b.closed_approved_by)} — ${esc(b.close_reason)}` : ''}
          ${b.not_awarded_notes ? `<br><span style="color:#dc2626">Not awarded ${fmtD(b.date_not_awarded)}:</span> ${esc(b.not_awarded_notes)}` : ''}
          ${b.notes ? `<br>📝 ${esc(b.notes)}` : ''}
        </div>
        ${(b.submissions || []).length ? `<div class="v2-fu"><div style="font-weight:600;color:var(--text);margin-bottom:3px">Submissions</div>${b.submissions.map(submissionRow).join('')}</div>` : ''}
        ${b.followups.length ? `<div class="v2-fu">${b.followups.map(fuRow).join('')}</div>` : ''}
        ${bidActions(b)}
      </div>
    </div>`;
}

// Bid editable by admin in these (non-terminal) stages
const BID_EDITABLE_STAGES = ['opportunity', 'active_bid', 'submitted'];

function bidActions(b) {
  // Superseded bids are inactive — no workflow buttons, but admins can still edit.
  let workflow = '';
  if (!b.superseded) {
    if (b.stage === 'opportunity') {
      workflow = `<button class="v2-btn blue" onclick="actStartBid(${b.id})">→ Start Bid</button>
                  <button class="v2-btn gray" onclick="actCloseBid(${b.id})">Close</button>`;
    } else if (b.stage === 'active_bid') {
      workflow = `<button class="v2-btn green" onclick="actSubmitBid(${b.id})">Submit Bid</button>
                  <button class="v2-btn gray" onclick="actCloseBid(${b.id})">Close</button>`;
    } else if (b.stage === 'submitted') {
      workflow = `<button class="v2-btn amber" onclick="actAddSubmission(${b.id})">+ Add Submission</button>
                  <button class="v2-btn blue" onclick="actLogFollowup('bid',${b.id})">📝 Log Follow-up</button>
                  <button class="v2-btn green" onclick="actAwardBid(${b.id})">✓ Awarded</button>
                  <button class="v2-btn red" onclick="actNotAwarded(${b.id})">✗ Not Awarded</button>`;
    }
  }
  const adminBtn = (CURRENT_USER?.is_admin && BID_EDITABLE_STAGES.includes(b.stage))
    ? `<button class="v2-btn outline" onclick="actEditBid(${b.id})">✏️ Edit</button>` : '';
  const all = [workflow, adminBtn].filter(Boolean).join('');
  return all ? `<div class="v2-actions">${all}</div>` : '';
}

function jobNode(j, legacy = false) {
  return `
    <div class="v2-job">
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          🏭 ${j.job_number ? `Job <span style="color:#0e7490">${esc(j.job_number)}</span>` : '<span class="pending-pill">JOB # PENDING — accounting</span>'}
          ${legacy ? '<span class="legacy-pill">LEGACY — bid pre-dates system</span>' : ''}
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:3px">
          ${j.awarded_company ? `Awarded by <strong style="color:var(--text)">${esc(j.awarded_company.name)}</strong>` : ''}
          ${j.award_date ? ` ${fmtD(j.award_date)}` : ''}
          ${j.pm ? ` · PM: ${ini(j.pm)} ${esc(j.pm.name)}` : ''}
          · ${j.change_orders.length} change order${j.change_orders.length!==1?'s':''}
        </div>
        <div class="v2-actions">
          ${!j.job_number ? `<button class="v2-btn amber" onclick="actSetJobNumber(${j.id})">Set Job #</button>` : ''}
          ${!j.pm ? `<button class="v2-btn outline" onclick="actSetPM(${j.id})">Assign PM</button>` : ''}
          <button class="v2-btn blue" onclick="actAddCO(${j.id})">+ Add Change Order</button>
          ${CURRENT_USER?.is_admin ? `<button class="v2-btn outline" onclick="actEditJob(${j.id})">✏️ Edit</button>` : ''}
        </div>
      </div>
    </div>
    ${j.change_orders.map(coNode).join('')}`;
}

function coNode(co) {
  const fuOverdue = co.next_followup_date && co.next_followup_date < today;
  return `
    <div class="v2-co">
      <span class="badge badge-co" style="flex-shrink:0">CO</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="color:#d97706">${esc(co.co_number)}</span> ${esc(co.name)}
          ${stageBadge(co.stage)}
          ${co.estimate_amount ? `<span class="amount">${fmt$(co.estimate_amount)}</span>` : ''}
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px">
          ${co.estimator ? `Est: ${ini(co.estimator)}` : ''}
          ${co.due_date ? ` · Due ${fmtD(co.due_date)}` : ''}
          ${co.date_submitted ? ` · Submitted ${fmtD(co.date_submitted)} (${esc(co.approved_by)})` : ''}
          ${co.approval_date ? ` · <span style="color:#16a34a;font-weight:700">Approved ${fmtD(co.approval_date)}</span>` : ''}
          ${co.next_followup_date ? ` · Next F/U: <span class="${fuOverdue ? 'overdue-txt' : ''}">${fmtD(co.next_followup_date)}${fuOverdue ? ' — OVERDUE' : ''}</span>` : ''}
          ${co.void_reason ? ` · Voided: ${esc(co.void_reason)}` : ''}
          ${co.not_approved_notes ? ` · ${esc(co.not_approved_notes)}` : ''}
        </div>
        ${co.followups.length ? `<div class="v2-fu">${co.followups.map(fuRow).join('')}</div>` : ''}
        ${coActions(co)}
      </div>
    </div>`;
}

const CO_EDITABLE_STAGES = ['active_co', 'submitted_co'];

function coActions(co) {
  let workflow = '';
  if (co.stage === 'active_co') {
    workflow = `<button class="v2-btn green" onclick="actSubmitCO(${co.id})">Submit CO</button>
                <button class="v2-btn gray" onclick="actVoidCO(${co.id})">Void</button>`;
  } else if (co.stage === 'submitted_co') {
    workflow = `<button class="v2-btn blue" onclick="actLogFollowup('change_order',${co.id})">📝 Log Follow-up</button>
                <button class="v2-btn green" onclick="actApproveCO(${co.id})">✓ Approved</button>
                <button class="v2-btn red" onclick="actNotApprovedCO(${co.id})">✗ Not Approved</button>
                <button class="v2-btn gray" onclick="actVoidCO(${co.id})">Void</button>`;
  } else if (co.stage === 'voided' || co.stage === 'not_approved') {
    workflow = `<button class="v2-btn outline" onclick="actReopenCO(${co.id})">↩ Reopen</button>`;
  }
  const adminBtn = (CURRENT_USER?.is_admin && CO_EDITABLE_STAGES.includes(co.stage))
    ? `<button class="v2-btn outline" onclick="actEditCO(${co.id})">✏️ Edit</button>` : '';
  const all = [workflow, adminBtn].filter(Boolean).join('');
  return all ? `<div class="v2-actions">${all}</div>` : '';
}

const SUB_TYPE = { initial: 'initial', best_and_final: 'best & final', scope_add: 'scope add', scope_remove: 'scope remove', revised: 'revised' };
function submissionRow(s) {

// ═══════════════════════════════════════════════════════════════════════════
// FORM MODAL FRAMEWORK
// fields: [{ id, label, type: text|number|date|select|textarea|multicheck, required, options, value, placeholder }]
// ═══════════════════════════════════════════════════════════════════════════
function showForm(title, fields, onSubmit, submitLabel = 'Save', submitClass = 'blue') {
  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.onclick = e => { if (e.target === ov) ov.remove(); };

  const fieldHtml = fields.map(f => {
    const req = f.required ? ' <span class="req">*</span>' : '';
    if (f.type === 'select') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        <select id="vf-${f.id}">
          ${f.required ? '' : '<option value="">—</option>'}
          ${f.options.map(o => `<option value="${o.value}" ${o.value == f.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
        </select></div>`;
    }
    if (f.type === 'multicheck') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        ${f.options.map(o => `<label class="v2-check"><input type="checkbox" data-multi="${f.id}" value="${o.value}"> ${esc(o.label)}</label>`).join('')}</div>`;
    }
    if (f.type === 'textarea') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        <textarea id="vf-${f.id}" rows="3" placeholder="${esc(f.placeholder || '')}">${esc(f.value ?? '')}</textarea></div>`;
    }
    return `<div class="v2-field"><label>${f.label}${req}</label>
      <input id="vf-${f.id}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}" ${f.type === 'number' ? 'step="any"' : ''}></div>`;
  }).join('');

  ov.innerHTML = `
    <div class="v2-modal">
      <div class="v2-modal-hd">${title}<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">${fieldHtml}</div>
      <div class="v2-modal-err" id="vf-err"></div>
      <div class="v2-modal-ft">
        <button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">Cancel</button>
        <button class="v2-btn ${submitClass}" id="vf-submit">${submitLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  document.getElementById('vf-submit').onclick = async () => {
    const data = {};
    let missing = [];
    for (const f of fields) {
      if (f.type === 'multicheck') {
        data[f.id] = [...ov.querySelectorAll(`input[data-multi="${f.id}"]:checked`)].map(c => Number(c.value));
        if (f.required && !data[f.id].length) missing.push(f.label);
      } else {
        const v = document.getElementById('vf-' + f.id)?.value?.trim();
        data[f.id] = v || null;
        if (f.required && !v) missing.push(f.label);
      }
    }
    const errEl = document.getElementById('vf-err');
    if (missing.length) { errEl.textContent = 'Required: ' + missing.join(', '); errEl.style.display = 'block'; return; }
    try {
      await onSubmit(data);
      ov.remove();
      await refresh();
    } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
  };
}

// Direct bid creation. opts: { projectId, projectName } (locked project) |
// { newProject:true } | { existingProject:true }
function newBidForm({ projectId, projectName, newProject, existingProject } = {}) {
  const fields = [];
  let title = '+ New Bid';
  if (projectId) {
    title = `+ Add Bid — ${esc(projectName)}`;
  } else if (newProject) {
    fields.push({ id: 'project_name', label: 'New Project Name', type: 'text', required: true, placeholder: 'e.g. Einstein ED Renovation' });
  } else { // existingProject
    fields.push({ id: 'project_id', label: 'Project', type: 'select', required: true, options: projectOpts() });
  }
  fields.push(...startBidFields());
  showForm(title, fields, data => {
    if (projectId) data.project_id = projectId;
    return api('POST', '/api/v2/bids', data);
  }, 'Create Bid', 'green');
}
