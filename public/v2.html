<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIS Estimating Calendar</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css">
<style>
  /* Page scaffolding (no sidebar in the preview — single column like a report) */
  body { padding: 0; margin: 0; }
  .v2-banner {
    background: #1e293b; padding: 12px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .v2-banner .ttl { color: #fff; font-size: 15px; font-weight: 700; }
  .v2-banner .tag { background: #f59e0b; color: #1e293b; font-size: 10px; font-weight: 800; padding: 2px 10px; border-radius: 10px; letter-spacing: .5px; }
  .v2-banner .sub { color: #94a3b8; font-size: 12px; margin-left: auto; }
  .v2-banner a { color: #7dd3fc; text-decoration: none; }
  .v2-wrap { max-width: 920px; margin: 24px auto; padding: 0 20px; }

  /* Hierarchy nesting — matches the v1 project panel look */
  .v2-hier { display: none; border-top: 1px solid var(--border); padding: 14px 20px 18px; background: #fcfdfe; }
  .v2-hier.open { display: block; }
  .v2-bid {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card-bg); padding: 12px 14px; margin-top: 10px;
    box-shadow: var(--shadow);
  }
  .v2-bid.awarded { border-left: 3px solid #16a34a; background: #f0fdf4; }
  .v2-job {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border); border-left: 3px solid #0891b2;
    border-radius: var(--radius); background: #f0fdff; padding: 10px 14px;
    margin: 8px 0 0 28px;
  }
  .v2-co {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 12px 8px 14px; margin-left: 56px;
    border-left: 2px solid var(--border);
  }
  .v2-co:last-child { border-radius: 0 0 6px 0; }
  .v2-fu {
    border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 6px;
    font-size: 12px; color: var(--text-muted);
  }
  .v2-fu-row { padding: 2px 0; }
  .awarded-pill {
    display: inline-block; background: #16a34a; color: #fff;
    font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
  }
  .pending-pill {
    display: inline-block; background: #fef3c7; color: #92400e;
    font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
  }
  .legacy-pill {
    display: inline-block; background: #ede9fe; color: #5b21b6;
    font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
  }
  .amount { font-weight: 700; color: #166534; }
  .overdue-txt { color: #dc2626; font-weight: 700; }
  .err-card { background: #fee2e2; color: #991b1b; padding: 16px 20px; border-radius: var(--radius); font-size: 14px; }

  /* Action buttons + modal */
  .v2-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .v2-btn {
    font-family: inherit; font-size: 11px; font-weight: 700; padding: 4px 12px;
    border-radius: 6px; border: none; cursor: pointer; color: #fff; transition: opacity .12s;
  }
  .v2-btn:hover { opacity: .85; }
  .v2-btn.green { background: #16a34a; } .v2-btn.blue { background: #2563eb; }
  .v2-btn.red { background: #dc2626; } .v2-btn.gray { background: #64748b; }
  .v2-btn.amber { background: #d97706; } .v2-btn.outline { background: #fff; color: #475569; border: 1px solid var(--border); }
  .v2-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .v2-modal {
    background: #fff; border-radius: 10px; width: 100%; max-width: 440px;
    max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .v2-modal-hd {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 800; font-size: 14px;
  }
  .v2-modal-bd { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .v2-modal-ft { padding: 0 20px 18px; display: flex; gap: 8px; justify-content: flex-end; }
  .v2-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .v2-field label .req { color: #dc2626; }
  .v2-field input, .v2-field select, .v2-field textarea {
    width: 100%; font-family: inherit; font-size: 13px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text);
  }
  .v2-field input:focus, .v2-field select:focus, .v2-field textarea:focus {
    outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1);
  }
  .v2-check { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; cursor: pointer; }
  .v2-modal-err { color: #dc2626; font-size: 12px; font-weight: 600; display: none; padding: 0 20px 10px; }
  /* searchable company combobox */
  .v2-combo { position: relative; }
  .v2-combo-box { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; padding: 4px 6px; }
  .v2-combo-box:focus-within { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
  .v2-combo-input { flex: 1; min-width: 120px; border: none !important; box-shadow: none !important;
    padding: 3px 2px !important; font-size: 13px; outline: none; }
  .v2-chip { display: inline-flex; align-items: center; gap: 5px; background: #eff6ff; color: #1e40af;
    border: 1px solid #bfdbfe; border-radius: 5px; padding: 2px 6px; font-size: 12px; font-weight: 600; }
  .v2-chip button { border: none; background: none; color: #1e40af; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; }
  .v2-chip em { color: #16a34a; font-style: normal; font-weight: 700; }
  /* position:fixed (not absolute) + JS-computed coordinates (see comboRenderMenu) —
     an absolutely-positioned dropdown gets clipped by any scrollable ancestor
     (e.g. .v2-modal's overflow-y:auto), which squeezed every dropdown in a
     form modal into whatever space happened to be left. Fixed positioning
     escapes that since no ancestor here uses transform/filter. */
  .v2-combo-menu { display: none; position: fixed; z-index: 200;
    background: #fff; border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12);
    max-height: 230px; overflow-y: auto; }
  .v2-combo-opt { padding: 7px 10px; font-size: 13px; cursor: pointer; }
  .v2-combo-opt:hover { background: #f1f5f9; }
  .v2-combo-new { color: #16a34a; font-weight: 600; border-top: 1px solid var(--border); }
  .v2-combo-empty { padding: 7px 10px; font-size: 12px; color: var(--text-muted); }
  .v2-combo-warn { padding: 6px 10px; font-size: 11px; font-weight: 600; color: #92400e; background: #fffbeb; border-bottom: 1px solid #fcd34d; }
  /* list filter/sort toolbar */
  .v2-filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fafbfc; }
  .v2-filterbar input[type="text"], .v2-filterbar select {
    font-family: inherit; font-size: 12.5px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text);
  }
  .v2-filterbar input[type="text"] { flex: 1; min-width: 160px; }
  .v2-filterbar label.mine { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
  .v2-filterbar .clear-link { font-size: 12px; color: #2563eb; cursor: pointer; white-space: nowrap; }

  /* Detail flyout (slide-over) */
  .fly-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 90; opacity: 0; transition: opacity .15s; }
  .fly-overlay.open { opacity: 1; }
  .fly-panel { position: fixed; top: 0; right: 0; height: 100%; width: 560px; max-width: 94vw; background: var(--bg); box-shadow: -8px 0 30px rgba(0,0,0,.18); z-index: 91; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s ease; }
  .fly-panel.open { transform: translateX(0); }
  .fly-head { padding: 14px 18px; background: #1e293b; color: #fff; display: flex; align-items: center; gap: 10px; }
  .fly-head .fly-title { font-weight: 800; font-size: 15px; flex: 1; min-width: 0; }
  .fly-head .fly-sub { color: #94a3b8; font-size: 12px; }
  .fly-head a { color: #7dd3fc; text-decoration: none; font-size: 12px; }
  .fly-head .fly-close { background: rgba(255,255,255,.12); color: #fff; border: none; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 15px; }
  .fly-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
</style>

<script>
const fmt$ = n => n == null ? '' : new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);
const fmtD = d => { if (!d) return ''; const [y,m,dd] = d.split('-'); return `${Number(m)}/${Number(dd)}/${String(y).slice(2)}`; };
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// For a name/string embedded inside a single-quoted JS string literal that's
// itself inside an onclick="..." HTML attribute (two escaping layers at
// once). esc() alone leaves apostrophes untouched — harmless in plain text,
// but "Jim O'Driscoll" as an onclick argument breaks the generated JS at the
// apostrophe (silently — the click handler just throws and does nothing).
const escJs = s => esc(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
const today = new Date().toISOString().split('T')[0];
const STAGE = {
  opportunity:'Opportunity', active_bid:'Active Bid', submitted:'Submitted', awarded:'Awarded',
  not_awarded:'Not Awarded', closed:'Closed',
  active_co:'Active CO', submitted_co:'Submitted CO', approved:'Approved', not_approved:'Not Approved', voided:'Voided',
};
const STAGE_COLOR = {
  opportunity:'#64748b', active_bid:'#d97706', submitted:'#2563eb', awarded:'#16a34a',
  not_awarded:'#dc2626', closed:'#64748b',
  active_co:'#d97706', submitted_co:'#2563eb', approved:'#16a34a', not_approved:'#dc2626', voided:'#64748b',
};
const METHOD = { phone:'📞 phone', email:'✉️ email', in_person:'🤝 in person', other:'other' };

const stageBadge = s => `<span class="badge badge-stage" style="color:${STAGE_COLOR[s]};font-weight:700">${STAGE[s] || s}</span>`;
const ini = m => m ? `<span class="initials-pill" style="transform:scale(.85);transform-origin:center" title="${esc(m.name || '')}">${esc(m.initials)}</span>` : '';

let META = { companies: [], team: [] };
let CURRENT_USER = null;          // { id, name, is_admin } — gates admin-only actions
let ALL_PROJECTS = [];            // [{id, name}] for the "existing project" picker
let OPEN_PROJECT = null;          // project id whose hierarchy is expanded
let DETAIL_CACHE = {};            // project id → detail payload (for award winner picker)

async function api(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

function setActiveNav(page) {
  document.querySelectorAll('#sidebar .nav-item[data-page]').forEach(a => a.classList.toggle('active', a.dataset.page === page));
}

async function ensureMeta() {
  if (META.companies.length) return;
  const r = await fetch('/api/v2/meta');
  if (r.status === 401) {
    // Login itself still lives on the old page (/legacy) — send the user
    // there and bring them right back here once they're signed in.
    window.location.href = '/legacy?returnTo=' + encodeURIComponent(location.pathname + location.hash);
    return new Promise(() => {}); // navigating away — never resolve, don't render a flash of "error"
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  META = data; CURRENT_USER = META.current_user;
}

// Tracks the current page so post-action refresh() re-renders the right view
let VIEW = { name: 'dashboard', arg: null };
function navigate(page) {
  closeFlyout();
  if (page !== 'projects') OPEN_PROJECT = null;
  if (page === 'dashboard') { VIEW = { name: 'dashboard' }; return renderDashboard(); }
  if (page === 'health') { VIEW = { name: 'health' }; return showHealth(); }
  if (page === 'history') { VIEW = { name: 'history' }; return renderHistory(); }
  if (page === 'opportunities') { VIEW = { name: 'bidlist', arg: 'opportunity' }; return renderBidList('opportunity'); }
  if (page === 'active-bids') { VIEW = { name: 'bidlist', arg: 'active_bid' }; return renderBidList('active_bid'); }
  if (page === 'submitted-bids') { VIEW = { name: 'bidlist', arg: 'submitted' }; return renderBidList('submitted'); }
  if (page === 'active-cos') { VIEW = { name: 'colist', arg: 'active_co' }; return renderCoList('active_co'); }
  if (page === 'submitted-cos') { VIEW = { name: 'colist', arg: 'submitted_co' }; return renderCoList('submitted_co'); }
  if (page === 'search') { VIEW = { name: 'search' }; return renderSearchResults(); }
  if (page === 'contacts') { VIEW = { name: 'contacts' }; return renderContacts(); }
  if (page === 'digest') { VIEW = { name: 'digest' }; return renderDigest(); }
  if (page === 'calendar') { VIEW = { name: 'calendar' }; return renderCalendar(); }
  if (page === 'settings') { VIEW = { name: 'settings' }; return renderSettings(); }
  VIEW = { name: 'projects' }; return load();
}

async function rerenderView() {
  switch (VIEW.name) {
    case 'search':    return renderSearchResults();
    case 'contacts':  return renderContacts();
    case 'digest':    return renderDigest();
    case 'calendar':  return renderCalendar();
    case 'settings':  return renderSettings();
    case 'projects':  return load();
    case 'project':   return renderProjectPage(VIEW.arg);
    case 'bidlist':   return renderBidList(VIEW.arg);
    case 'colist':    return renderCoList(VIEW.arg);
    case 'dashboard': return renderDashboard();
    case 'health':    return showHealth();
    case 'history':   return renderHistory();
  }
}

let GLOBAL_SEARCH = '';
let globalSearchTimer;
function debounceGlobalSearch() {
  clearTimeout(globalSearchTimer);
  const q = (document.getElementById('global-search-input')?.value || '').trim();
  GLOBAL_SEARCH = q;
  const clearBtn = document.getElementById('sidebar-search-clear');
  if (clearBtn) clearBtn.style.display = q ? 'block' : 'none';
  if (q.length < 2) { if (VIEW.name === 'search') renderSearchResults(); return; }
  globalSearchTimer = setTimeout(() => { if (VIEW.name !== 'search') navigate('search'); else renderSearchResults(); }, 280);
}
function clearGlobalSearch() {
  GLOBAL_SEARCH = '';
  const inp = document.getElementById('global-search-input');
  if (inp) { inp.value = ''; inp.blur(); }
  const clearBtn = document.getElementById('sidebar-search-clear');
  if (clearBtn) clearBtn.style.display = 'none';
  if (VIEW.name === 'search') navigate('dashboard');
}
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('global-search-input')?.focus(); }
});

// CALENDAR — month grid of due dates + follow-ups, across bids AND change
// orders (v1 only had bids since COs were folded into the same collection).
// ═══════════════════════════════════════════════════════════════════════════
const ESTIMATOR_PALETTE = ['#2563eb', '#16a34a', '#dc2626', '#d97706', '#7c3aed', '#0891b2', '#be185d', '#ea580c'];
const estimatorColor = (id) => id ? ESTIMATOR_PALETTE[Number(id) % ESTIMATOR_PALETTE.length] : '#64748b';
let CAL_STATE = { year: new Date().getFullYear(), month: new Date().getMonth(), filter: 'all' };
let CAL_DAY_MAP = {};

async function fetchCalendarItems() {
  const [opp, active, sub, activeCo, subCo] = await Promise.all([
    api('GET', '/api/v2/bid-list?stage=opportunity'), api('GET', '/api/v2/bid-list?stage=active_bid'), api('GET', '/api/v2/bid-list?stage=submitted'),
    api('GET', '/api/v2/co-list?stage=active_co'), api('GET', '/api/v2/co-list?stage=submitted_co'),
  ]);
  return [
    ...[...opp, ...active, ...sub].map(b => ({ kind: 'bid', id: b.id, project_id: b.project_id, title: b.project, label: b.bid_number, due_date: b.due_date, next_followup_date: b.next_followup_date, estimator: b.estimator, salesperson: b.salesperson, customer: (b.customers || []).join(', '), stage: b.stage })),
    ...[...activeCo, ...subCo].map(c => ({ kind: 'co', id: c.id, project_id: c.project_id, title: `${c.co_number} — ${c.name}`, label: c.project, due_date: c.due_date, next_followup_date: c.next_followup_date, estimator: c.estimator, salesperson: c.salesperson, customer: null, stage: c.stage })),
  ];
}
function calendarLegendHtml() {
  const estimators = (META.team || []).filter(m => m.role === 'estimator');
  return [
    ...estimators.map(m => `<span class="cal-legend-item"><span class="cal-legend-dot" style="background:${estimatorColor(m.id)}"></span>${esc(m.initials)}</span>`),
    `<span class="cal-legend-item"><span class="cal-legend-dot" style="background:#1e293b;border:1px dashed #94a3b8"></span>Follow-up</span>`,
  ].join('');
}
function calendarControlsHtml(reRenderFn) {
  const { year, month, filter } = CAL_STATE;
  const monthName = new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  return `<div class="cal-controls">
      <button class="v2-btn outline" style="padding:6px 12px;font-size:12px" onclick="navCalendar(-1)">‹ Prev</button>
      <span class="cal-month-label">${esc(monthName)}</span>
      <button class="v2-btn outline" style="padding:6px 12px;font-size:12px" onclick="navCalendar(1)">Next ›</button>
      <button class="v2-btn outline" style="padding:6px 12px;font-size:12px" onclick="CAL_STATE.year=new Date().getFullYear();CAL_STATE.month=new Date().getMonth();${reRenderFn}()">Today</button>
      <select class="cal-filter-select" onchange="CAL_STATE.filter=this.value;${reRenderFn}()">
        <option value="all" ${filter === 'all' ? 'selected' : ''}>Due Dates + Follow-ups</option>
        <option value="due_only" ${filter === 'due_only' ? 'selected' : ''}>Due Dates Only</option>
        <option value="followups_only" ${filter === 'followups_only' ? 'selected' : ''}>Follow-ups Only</option>
      </select>
    </div>`;
}

async function renderCalendar() {
  setActiveNav('calendar');
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Loading…</div>';
  let items;
  try { await ensureMeta(); items = await fetchCalendarItems(); }
  catch (e) { main.innerHTML = `<div class="err-card" style="margin:20px">${esc(e.message)}</div>`; return; }

  const { year, month, filter } = CAL_STATE;
  main.innerHTML = `
    <div class="page-header"><div><div class="page-title">🗓️ Calendar</div></div></div>
    ${calendarControlsHtml('renderCalendar')}
    ${buildCalendarGrid(year, month, items, filter)}
    <div class="cal-legend">${calendarLegendHtml()}</div>`;
}

function navCalendar(dir) {
  let m = CAL_STATE.month + dir, y = CAL_STATE.year;
  if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
  CAL_STATE.month = m; CAL_STATE.year = y;
  // The calendar shows up both as its own page and embedded on the
  // dashboard — re-render whichever one is actually on screen.
  (VIEW.name === 'calendar' ? renderCalendar : renderDashboard)();
}

function buildCalendarGrid(year, month, items, filter) {
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startDOW = firstDay.getDay();
  const pad = n => String(n).padStart(2, '0');

  CAL_DAY_MAP = {};
  const add = (dateStr, item, type) => {
    if (!dateStr) return;
    const d = dateStr.substring(0, 10);
    if (parseInt(d.substring(5, 7)) - 1 !== month || parseInt(d.substring(0, 4)) !== year) return;
    (CAL_DAY_MAP[d] = CAL_DAY_MAP[d] || []).push({ item, type });
  };
  items.forEach(it => {
    if (filter !== 'followups_only') add(it.due_date, it, 'due');
    if (filter !== 'due_only') add(it.next_followup_date, it, 'fu');
  });

  const headers = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="cal-hdr-cell">${d}</div>`).join('');
  let cells = '';
  for (let i = 0; i < startDOW; i++) cells += '<div class="cal-day-empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${year}-${pad(month + 1)}-${pad(d)}`;
    const isToday = ds === today;
    const dayItems = CAL_DAY_MAP[ds] || [];

    // Show every item, not just the first few — the row grows to fit
    // whichever day that week is busiest (CSS grid rows auto-size to their
    // tallest cell), so nothing gets stuck behind a "+N more" button where
    // it can't be dragged.
    const chips = dayItems.map(({ item, type }) => {
      if (type === 'due') {
        const c = estimatorColor(item.estimator?.id);
        // Only due-date chips are draggable — a due date is what dropping on
        // another day changes; follow-up dates aren't touched by this.
        return `<div class="cal-chip" draggable="true"
            ondragstart="calDragStart(event,'${item.kind}',${item.id},'${escJs(item.title)}')"
            style="background:${c}a6;border-left-color:${c};cursor:grab">
          <span class="cal-chip-txt">${esc(item.title)}</span>
          ${item.estimator ? `<span class="cal-chip-ini" style="color:#fff">${esc(item.estimator.initials)}</span>` : ''}
        </div>`;
      }
      return `<div class="cal-chip cal-chip-fu"><span class="cal-chip-txt">📞 ${esc(item.title)}</span></div>`;
    }).join('');

    cells += `<div class="cal-day${isToday ? ' cal-day-today' : ''}${dayItems.length ? ' cal-day-clickable' : ''}"
      ${dayItems.length ? `onclick="openCalDayModal('${ds}')"` : ''}
      ondragover="event.preventDefault()" ondrop="calDrop(event,'${ds}')">
      <div class="cal-day-num${isToday ? ' cal-day-num-today' : ''}">${d}</div>
      <div class="cal-day-chips">${chips}</div>
    </div>`;
  }
  const rem = (startDOW + daysInMonth) % 7;
  if (rem) for (let i = rem; i < 7; i++) cells += '<div class="cal-day-empty"></div>';
  return `<div class="cal-hdr">${headers}</div><div class="cal-grid">${cells}</div>`;
}

// Drag a due-date chip to a different day to change its due date. Always
// confirms before committing since it's easy to miss the day you actually
// dropped on.
let CAL_DRAG = null;
function calDragStart(ev, kind, id, title) {
  CAL_DRAG = { kind, id, title };
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', ''); // Firefox requires data to be set for drag to start
}
async function calDrop(ev, dateStr) {
  ev.preventDefault();
  const drag = CAL_DRAG;
  CAL_DRAG = null;
  if (!drag) return;
  const label = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  if (!confirm(`Change the due date for "${drag.title}" to ${label}?`)) return;
  try {
    const url = drag.kind === 'bid' ? `/api/v2/bids/${drag.id}/due-date` : `/api/v2/change-orders/${drag.id}/due-date`;
    await api('PATCH', url, { due_date: dateStr });
    if (VIEW.name === 'calendar') await renderCalendar(); else if (VIEW.name === 'dashboard') await renderDashboard();
  } catch (e) { alert('Failed to change due date: ' + e.message); }
}

function openCalDayModal(dateStr) {
  const items = CAL_DAY_MAP[dateStr] || [];
  if (!items.length) return;
  const label = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const rows = items.map(({ item, type }) => {
    const color = type === 'due' ? estimatorColor(item.estimator?.id) : '#64748b';
    const typeLabel = type === 'due' ? '📐 Due date' : '📞 Follow-up';
    return `<div class="proj-row" onclick="closeProfileModal();${item.kind === 'bid' ? `openBidFlyout(${item.project_id},${item.id})` : `openCoFlyout(${item.project_id},${item.id})`}">
      <div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;margin-top:5px"></div>
      <div style="flex:1;min-width:0">
        <div class="proj-name">${esc(item.title)}</div>
        <div class="proj-meta">${typeLabel}
          ${item.estimator ? ` · Est ${esc(item.estimator.initials)}` : ''}
          ${item.salesperson ? ` Sales ${esc(item.salesperson.initials)}` : ''}
          ${item.customer ? ` · ${esc(item.customer)}` : ''}
        </div>
      </div>
      ${stageBadge(item.stage)}
    </div>`;
  }).join('');
  openProfileModal(label, `<div class="card" style="padding:0">${rows}</div>`);
}

// ask: don't bury the good news under the bad news at the top.

    ${g.bids.map(b => bidRow(b, false)).join('')}`).join('')

  const submittedCount = d.submittedByEstimator.reduce((s,g)=>s+g.bids.length,0) + d.submittedNoEstimator.length;

  main.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">📊 Weekly Digest</div><div class="page-subtitle">${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div></div>
      <button class="v2-btn outline" onclick="window.print()">🖨 Print</button>
    </div>

    ${section('📋', 'Pipeline Snapshot', null, pipelineBubbles)}

    ${d.upcomingReminders.length ? section('⏰', 'Upcoming Reminders', d.upcomingReminders.length, d.upcomingReminders.map(r => `
      <div class="proj-row" ${r.project_id ? `onclick="${r.kind === 'bid' ? `openBidFlyout(${r.project_id},${r.bid_id})` : `openCoFlyout(${r.project_id},${r.bid_id})`}"` : ''}><div style="flex:1"><div class="proj-name">${esc(r.project_name)}${r.bid_number ? ` #${esc(r.bid_number)}` : ''}</div>
      <div class="proj-meta">${fmtD(r.remind_on)}${r.note ? ' · ' + esc(r.note) : ''}</div></div></div>`).join(''), '#8b5cf6') : ''}

    ${section('📅', 'Upcoming Due Dates (30 days)', d.upcomingDueDates.length + d.coDueSoon.length,
      rows([...d.upcomingDueDates, ...d.coDueSoon].sort((a, b) => (a.estimate_due_date || '9999').localeCompare(b.estimate_due_date || '9999')), false), '#2563eb')}

    ${d.newOpportunities.length ? section('🆕', 'New Opportunities This Week', d.newOpportunities.length, rows(d.newOpportunities, false), '#3b82f6') : ''}
    ${d.newActiveBids.length ? section('🆕', 'New Active Bids This Week', d.newActiveBids.length, rows(d.newActiveBids, false), '#f59e0b') : ''}
    ${d.newActiveCos.length ? section('🆕', 'New Change Orders This Week', d.newActiveCos.length, rows(d.newActiveCos, false), '#f97316') : ''}

    ${section('📤', 'Submitted (last 2 weeks) — by Estimator', submittedCount, submittedCount ? submittedGroupsHtml : null, '#2563eb')}

    ${d.awardedThisWeek.length ? section('🎉', 'Awarded This Week', d.awardedThisWeek.length, rows(d.awardedThisWeek, false), '#16a34a') : ''}
    ${d.notAwardedThisWeek.length ? section('✗', 'Not Awarded This Week', d.notAwardedThisWeek.length, rows(d.notAwardedThisWeek, false), '#dc2626') : ''}

    ${section('👥', 'By Salesperson', null, peopleTable(d.bySalesperson, [
      { key: 'name', label: 'Name' }, { key: 'bid_count', label: 'Active Bids', right: true },
      { key: 'overdue_followups', label: 'Overdue F/U', right: true, overdue: true },
    ]))}

    ${section('⚠️', 'Overdue Follow-ups — Bids', d.overdueFollowups.length, rows(d.overdueFollowups, true), '#dc2626')}
    ${d.coOverdueFollowups.length ? section('⚠️', 'Overdue Follow-ups — Change Orders', d.coOverdueFollowups.length, rows(d.coOverdueFollowups, true), '#dc2626') : ''}
  `;
}

  active_bid:  { page: 'active-bids',    title: '🟡 Active Bids',   sub: 'estimating in progress' },

};
const CO_LIST_META = {
  active_co:    { page: 'active-cos',    title: '🟠 Active Change Orders',  sub: 'in progress' },

// ── List filter/sort toolbar (bid lists + CO lists) ──────────────────────────
// Rows are fetched once per page load and filtered/sorted entirely client-side
// (dataset is small); LIST_STATE holds the raw fetch, FILTER_STATE holds the
// toolbar values per stage-key so they survive navigating away and back.
let LIST_STATE = {};    // stageKey -> raw rows from the API
let FILTER_STATE = {};  // stageKey -> { q, person, mine, sort }

// Admin/Oversight users have no bids of their own — "mine only" would just
// show them nothing, so they default to the global view like everyone else
// would if they weren't logged in, while estimators/salespeople still get
// "mine" as the default.
function defaultMine() { return !!CURRENT_USER && CURRENT_USER.role !== 'oversight'; }
function filterState(key) { return (FILTER_STATE[key] = FILTER_STATE[key] || { q: '', person: '', mine: defaultMine(), sort: 'due' }); }

function personOpts() {
  return META.team.map(t => [`${t.role === 'sales' ? 'sal' : 'est'}:${t.id}`, `${t.name} (${t.initials})`]);
}

function filterBarHtml(key, sortOpts) {
  const s = filterState(key);
  const opts = personOpts();
  return `<div class="v2-filterbar">
    <input type="text" id="flt-q-${key}" placeholder="Search project, bid #, customer, job #…" value="${esc(s.q)}" oninput="onListFilterChange('${key}')">
    <select id="flt-person-${key}" onchange="onListFilterChange('${key}')">
      <option value="">Anyone</option>
      ${opts.map(([v, l]) => `<option value="${v}" ${v === s.person ? 'selected' : ''}>${esc(l)}</option>`).join('')}
    </select>
    <select id="flt-sort-${key}" onchange="onListFilterChange('${key}')">
      ${sortOpts.map(([v, l]) => `<option value="${v}" ${v === s.sort ? 'selected' : ''}>Sort: ${esc(l)}</option>`).join('')}
    </select>
    ${CURRENT_USER ? `<label class="mine"><input type="checkbox" id="flt-mine-${key}" ${s.mine ? 'checked' : ''} onchange="onListFilterChange('${key}')"> Mine only</label>` : ''}
    <span class="clear-link" onclick="clearListFilters('${key}')">Clear</span>
  </div>`;
}

function clearListFilters(key) {
  FILTER_STATE[key] = { q: '', person: '', mine: defaultMine(), sort: filterState(key).sort === 'followup' ? 'followup' : 'due' };
  if (VIEW.name === 'bidlist') renderBidList(VIEW.arg); else renderCoList(VIEW.arg);
}

function onListFilterChange(key) {
  const s = filterState(key);
  s.q = document.getElementById('flt-q-' + key)?.value || '';
  s.person = document.getElementById('flt-person-' + key)?.value || '';
  s.sort = document.getElementById('flt-sort-' + key)?.value || s.sort;
  s.mine = !!document.getElementById('flt-mine-' + key)?.checked;
  if (VIEW.name === 'bidlist') renderBidListBody(key); else renderCoListBody(key);
}

function applyPersonMine(rows, s) {
  let out = rows;
  if (s.person) {
    const [kind, id] = s.person.split(':'); const nid = Number(id);
    out = out.filter(r => kind === 'sal' ? r.salesperson?.id === nid : (r.estimator?.id === nid || (r.sub_estimators || []).some(se => se.id === nid)));
  }
  if (s.mine && CURRENT_USER) out = out.filter(r => r.estimator?.id === CURRENT_USER.id || r.salesperson?.id === CURRENT_USER.id || (r.sub_estimators || []).some(se => se.id === CURRENT_USER.id));
  return out;
}
function applyTextSearch(rows, q, getFields) {
  if (!q.trim()) return rows;
  const needle = q.trim().toLowerCase();
  return rows.filter(r => getFields(r).some(f => f && String(f).toLowerCase().includes(needle)));
}

async function renderBidList(stage) {
  const meta = BID_LIST_META[stage];
  setActiveNav(meta.page);
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Loading…</div>';
  try { await ensureMeta(); LIST_STATE[stage] = await api('GET', '/api/v2/bid-list?stage=' + stage); }
  catch (e) { main.innerHTML = `<div class="err-card" style="margin:20px">${esc(e.message)}</div>`; return; }

  const sortOpts = stage === 'submitted'
    ? [['followup', 'Follow-up date'], ['due', 'Due date'], ['amount', 'Amount'], ['project', 'Project name']]
    : [['due', 'Due date'], ['amount', 'Amount'], ['project', 'Project name']];
  if (stage === 'submitted' && filterState(stage).sort === 'due') filterState(stage).sort = 'followup';

  main.innerHTML = `
    <div class="page-header"><div><div class="page-title">${meta.title}</div><div class="page-subtitle" id="bl-count-${stage}">${LIST_STATE[stage].length} ${meta.sub}</div></div></div>
    <div class="card" style="padding:0">${filterBarHtml(stage, sortOpts)}<div id="bl-body-${stage}"></div></div>`;
  renderBidListBody(stage);
}

function renderBidListBody(stage) {
  const meta = BID_LIST_META[stage];
  const s = filterState(stage);
  let rows = LIST_STATE[stage] || [];
  rows = applyTextSearch(rows, s.q, b => [b.project, b.bid_number, ...b.customers]);
  rows = applyPersonMine(rows, s);
  const sorters = {
    due: (a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999'),
    followup: (a, b) => (a.next_followup_date || '9999').localeCompare(b.next_followup_date || '9999'),
    amount: (a, b) => (b.estimate_amount || 0) - (a.estimate_amount || 0),
    project: (a, b) => (a.project || '').localeCompare(b.project || ''),
  };
  rows = [...rows].sort(sorters[s.sort] || sorters.due);

  const right = (b) => {
    if (stage === 'submitted') {
      const overdue = b.next_followup_date && b.next_followup_date < today;
      return `${b.estimate_amount ? `<span class="amount" style="font-size:13px">${fmt$(b.estimate_amount)}</span>` : ''}
        ${b.next_followup_date ? `<div style="font-size:11px;${overdue ? 'color:#dc2626;font-weight:700' : 'color:var(--text-muted)'}">F/U ${fmtD(b.next_followup_date)}${overdue ? ' • OVERDUE' : ''}</div>` : ''}`;
    }
    return b.due_date ? `<span style="font-size:12px;font-weight:700;color:${b.due_date < today ? '#dc2626' : 'var(--text-muted)'}">Due ${fmtD(b.due_date)}</span>` : '';
  };

  document.getElementById('bl-count-' + stage).textContent = `${rows.length} of ${LIST_STATE[stage].length} ${meta.sub}`;
  document.getElementById('bl-body-' + stage).innerHTML = rows.length ? rows.map(b => `
      <div class="proj-row" onclick="openBidFlyout(${b.project_id},${b.id})">
        <div style="flex:1;min-width:0">
          <div class="proj-name">${esc(b.project)}${b.bid_number ? ` <span style="color:var(--text-muted);font-weight:400;font-size:12px">#${esc(b.bid_number)}</span>` : ''}
            ${b.drawing_stage ? `<span class="badge" style="background:#ede9fe;color:#5b21b6;font-size:10px">${esc(b.drawing_stage)}</span>` : ''}</div>
          <div class="proj-meta">
            ${b.customers.length ? esc(b.customers.join(', ')) : '<span style="color:#dc2626">no customer</span>'}
            ${b.estimator ? `<span class="proj-meta-sep">·</span> Est ${ini(b.estimator)}` : ''}
            ${b.salesperson ? ` Sales ${ini(b.salesperson)}` : ''}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">${right(b)}</div>
      </div>`).join('') : '<div style="padding:24px;text-align:center;color:var(--text-muted)">No matches</div>';
}

async function renderCoList(stage) {
  const meta = CO_LIST_META[stage];
  setActiveNav(meta.page);
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Loading…</div>';

  if (stage === 'submitted_co' && filterState(stage).sort === 'due') filterState(stage).sort = 'followup';

  main.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">${meta.title}</div><div class="page-subtitle" id="cl-count-${stage}">${LIST_STATE[stage].length} ${meta.sub}</div></div>
      ${stage === 'active_co' ? `<button class="v2-btn green" onclick="actNewChangeOrder()">+ New Change Order</button>` : ''}
    </div>
    <div class="card" style="padding:0">${filterBarHtml(stage, sortOpts)}<div id="cl-body-${stage}"></div></div>`;

function renderCoListBody(stage) {
  const meta = CO_LIST_META[stage];
  const s = filterState(stage);
  let rows = LIST_STATE[stage] || [];
  rows = applyTextSearch(rows, s.q, c => [c.project, c.co_number, c.name, c.job_number]);
  rows = applyPersonMine(rows, s);
  const sorters = {
    due: (a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999'),
    followup: (a, b) => (a.next_followup_date || '9999').localeCompare(b.next_followup_date || '9999'),
    amount: (a, b) => (b.estimate_amount || 0) - (a.estimate_amount || 0),
    project: (a, b) => (a.project || '').localeCompare(b.project || ''),
  };
  rows = [...rows].sort(sorters[s.sort] || sorters.due);

  // Right column matches the bid lists' convention exactly: due date badge
  // while active, $ + follow-up date once submitted — so due dates land in
  // the same visual spot (bold, right-aligned, red if overdue) everywhere
  // they're shown across the app instead of drifting into the left-side
  // meta text on some pages and the right column on others.
  const right = (c) => {
    if (stage === 'submitted_co') {
      const overdue = c.next_followup_date && c.next_followup_date < today;
      return `${c.estimate_amount ? `<span class="amount" style="font-size:13px">${fmt$(c.estimate_amount)}</span>` : ''}
        ${c.next_followup_date ? `<div style="font-size:11px;${overdue ? 'color:#dc2626;font-weight:700' : 'color:var(--text-muted)'}">F/U ${fmtD(c.next_followup_date)}${overdue ? ' • OVERDUE' : ''}</div>` : ''}`;
    }
    return c.due_date ? `<span style="font-size:12px;font-weight:700;color:${c.due_date < today ? '#dc2626' : 'var(--text-muted)'}">Due ${fmtD(c.due_date)}</span>` : '';
  };

  document.getElementById('cl-count-' + stage).textContent = `${rows.length} of ${LIST_STATE[stage].length} ${meta.sub}`;
  document.getElementById('cl-body-' + stage).innerHTML = rows.length ? rows.map(c => {

function onProjFilterChange() {
  PROJ_FILTER.q = document.getElementById('proj-q')?.value || '';
  PROJ_FILTER.sort = document.getElementById('proj-sort')?.value || PROJ_FILTER.sort;
  renderProjectsBody();
}

function renderProjectsBody() {
  const q = PROJ_FILTER.q.trim().toLowerCase();
  let projects = !q ? PROJECTS_RAW : PROJECTS_RAW.filter(p =>
    p.name.toLowerCase().includes(q) || p.customers.some(c => c.toLowerCase().includes(q)) || p.job_numbers.some(j => j.toLowerCase().includes(q)));
  const sorters = {
    name: (a, b) => a.name.localeCompare(b.name),
    bids: (a, b) => b.bid_count - a.bid_count,
    pipeline: (a, b) => (b.pipeline_value||0) - (a.pipeline_value||0),
    won: (a, b) => (b.won_value||0) - (a.won_value||0),
  };
  projects = [...projects].sort(sorters[PROJ_FILTER.sort] || sorters.name);
  document.getElementById('proj-count').textContent = `${projects.length} of ${PROJECTS_RAW.length} projects · Project → Bids → Job → Change Orders`;
  document.getElementById('proj-body').innerHTML = projects.length ? projects.map(p => `
      <div class="proj-row" onclick="renderProjectPage(${p.id})">
        <div style="flex:1;min-width:0">
          <div class="proj-name">${esc(p.name)}</div>
          <div class="proj-meta">
            ${p.bid_count} bid${p.bid_count!==1?'s':''}
            <span class="proj-meta-sep">·</span> ${p.job_count} job${p.job_count!==1?'s':''}
            <span class="proj-meta-sep">·</span> ${p.co_count} CO${p.co_count!==1?'s':''}
            ${p.pipeline_value ? `<span class="proj-meta-sep">·</span> pipeline <span class="amount">${fmt$(p.pipeline_value)}</span>` : ''}
            ${p.won_value ? `<span class="proj-meta-sep">·</span> won <span class="amount">${fmt$(p.won_value)}</span>` : ''}
            ${p.customers.length ? `<span class="proj-meta-sep">·</span> <span class="proj-meta-customers">${esc(p.customers.join(', '))}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
          ${p.job_numbers.map(j => `<span class="proj-active-badge">Job ${esc(j)}</span>`).join('')}
          ${p.job_number_pending ? '<span class="pending-pill">JOB # PENDING</span>' : ''}
          ${p.is_legacy ? '<span class="legacy-pill">LEGACY</span>' : ''}
          ${p.active_count ? `<span class="badge badge-bid">${p.active_count} active</span>` : ''}
          <span style="color:var(--text-muted)">›</span>
        </div>
      </div>`).join('') : '<div style="padding:24px;text-align:center;color:var(--text-muted)">No matches</div>';
}

// ── Detail flyout (slide-over) ────────────────────────────────────────────────
let FLYOUT = null;   // { kind:'bid'|'co', projectId, id }

function closeFlyout() {
  FLYOUT = null;
  document.getElementById('fly-overlay')?.remove();
  document.getElementById('fly-panel')?.remove();
}

function openBidFlyout(projectId, bidId) { FLYOUT = { kind: 'bid', projectId, id: bidId }; OPEN_PROJECT = projectId; renderFlyout(true); }
function openCoFlyout(projectId, coId) { FLYOUT = { kind: 'co', projectId, id: coId }; OPEN_PROJECT = projectId; renderFlyout(true); }

async function renderFlyout(fresh) {
  if (!FLYOUT) return;
  let overlay = document.getElementById('fly-overlay');
  let panel = document.getElementById('fly-panel');
  if (!overlay) {
    overlay = document.createElement('div'); overlay.id = 'fly-overlay'; overlay.className = 'fly-overlay';
    overlay.onclick = closeFlyout; document.body.appendChild(overlay);
    panel = document.createElement('div'); panel.id = 'fly-panel'; panel.className = 'fly-panel'; document.body.appendChild(panel);
    requestAnimationFrame(() => { overlay.classList.add('open'); panel.classList.add('open'); });
  }
  panel.innerHTML = '<div class="fly-head"><span class="fly-title">Loading…</span><button class="fly-close" onclick="closeFlyout()">✕</button></div>';

  const d = await api('GET', '/api/v2/projects/' + FLYOUT.projectId);
  DETAIL_CACHE[FLYOUT.projectId] = d;

  let title = '', sub = '', body = '';
  if (FLYOUT.kind === 'bid') {
    const b = d.bids.find(x => x.id === FLYOUT.id);
    if (!b) { closeFlyout(); return; }
    title = `${b.bid_number || 'Bid'}`; sub = esc(d.name);
    body = bidNode(b);
    if (b.stage === 'awarded') { const job = d.jobs.find(j => j.winning_bid_id === b.id); if (job) body += jobNode(job); }
  } else {
    let co = null, job = null;
    for (const j of d.jobs) { const c = j.change_orders.find(x => x.id === FLYOUT.id); if (c) { co = c; job = j; break; } }
    if (!co) { closeFlyout(); return; }
    title = `${esc(co.co_number)}`; sub = `${esc(d.name)}${job.job_number ? ' · Job ' + esc(job.job_number) : ''}`;
    body = `<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">🏭 ${job.job_number ? 'Job ' + esc(job.job_number) : 'Job'}${job.pm ? ` · PM ${ini(job.pm)} ${esc(job.pm.name)}` : ' · <span style="color:#dc2626">no PM assigned</span>'}</div>` + coNode(co);
  }
  panel.querySelector('.fly-head').outerHTML = `
    <div class="fly-head">
      <div style="flex:1;min-width:0"><div class="fly-title">${title}</div><div class="fly-sub">${sub}</div></div>
      <a href="#" onclick="event.preventDefault();renderProjectPage(${FLYOUT.projectId})">Open full project →</a>
      <button class="fly-close" onclick="closeFlyout()">✕</button>
    </div>`;
  panel.querySelector('.fly-body')?.remove();
  panel.insertAdjacentHTML('beforeend', `<div class="fly-body">${body}</div>`);
}

function renderHierarchy(d) {
  let html = `<div class="v2-actions" style="margin:0 0 4px">
    <button class="v2-btn green" onclick="actAddBidToProject(${d.id})">+ Add Bid to this Project</button>
    ${CURRENT_USER?.is_admin ? `<button class="v2-btn outline" onclick="actEditProject(${d.id})">✏️ Edit Project</button>` : ''}
    <span style="font-size:11px;color:var(--text-muted);align-self:center">new B26-#### for another drawing stage / re-bid</span>
  </div>`;

  // Duplicate-jobs warning: same job # on more than one job here (legacy + bid-backed
  // artifact from an older import). One click merges the COs onto the real job.
  const byNum = {};
  d.jobs.forEach(j => { if (j.job_number) (byNum[j.job_number] = byNum[j.job_number] || []).push(j); });
  const dupJobGroups = Object.values(byNum).filter(g => g.length > 1);
  if (dupJobGroups.length && CURRENT_USER?.is_admin) {
    html += `<div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:9px 12px;margin:4px 0;font-size:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="flex:1">⚠️ Job #${esc(dupJobGroups.map(g=>g[0].job_number).join(', '))} is split across ${dupJobGroups.reduce((s,g)=>s+g.length,0)} jobs (legacy + bid-backed). They're the same job.</span>
      <button class="v2-btn amber" onclick="actMergeDupeJobs(${d.id})">Merge into one job</button>
    </div>`;
  }

  const jobByWinningBid = {};
  d.jobs.forEach(j => { if (j.winning_bid_id) jobByWinningBid[j.winning_bid_id] = j; });
  for (const b of d.bids) {
    html += bidNode(b);
    const job = jobByWinningBid[b.id];
    if (job) html += jobNode(job);
  }
  for (const j of d.jobs.filter(j => !j.winning_bid_id)) html += jobNode(j, true);
  return html || '<div style="padding:10px;color:var(--text-muted);font-size:13px">Nothing here yet.</div>';
}

function bidNode(b) {
  const isAwarded = b.stage === 'awarded';
  return `
    <div class="v2-bid ${isAwarded ? 'awarded' : ''}" ${b.superseded ? 'style="opacity:.6"' : ''}>
      <div style="flex:1;min-width:0">
        <div style="font-weight:${isAwarded?'800':'600'};font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${isAwarded ? '✓' : ''} ${b.bid_number ? esc(b.bid_number) : '<em style="color:var(--text-muted);font-weight:400">no bid #</em>'}
          ${isAwarded ? '<span class="awarded-pill">AWARDED</span>' : stageBadge(b.stage)}
          ${b.superseded ? '<span class="badge" style="background:#e2e8f0;color:#64748b">SUPERSEDED</span>' : ''}
          ${b.drawing_stage ? `<span class="badge" style="background:#ede9fe;color:#5b21b6">${esc(b.drawing_stage)}</span>` : ''}
          ${b.estimate_amount ? `<span class="amount">${fmt$(b.estimate_amount)}</span>` : ''}
          ${(b.submissions || []).filter(s => s.is_current).length > 1 ? `<span class="badge" style="background:#dbeafe;color:#1e40af">${b.submissions.filter(s => s.is_current).length} customers</span>` : ''}
          ${b.due_date ? `<span style="margin-left:auto;font-weight:700;font-size:12px;color:${b.due_date < today ? '#dc2626' : 'var(--text-muted)'}">Due ${fmtD(b.due_date)}</span>` : ''}
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.6">
          ${!b.customers.length ? '<span style="color:#dc2626">no customer</span><br>' : ''}
          ${b.awarded_company ? `Won by <strong style="color:#16a34a">${esc(b.awarded_company.name)}</strong> ${fmtD(b.award_date)}<br>` : ''}
          ${b.estimator ? `Est: ${ini(b.estimator)}` : ''}
          ${b.sub_estimators.map(s => `${ini(s)}<span style="font-size:10px">${esc(s.scope)}<a href="#" onclick="event.preventDefault();actRemoveSubEstimator(${b.id},${s.id},'${escJs(s.scope)}')" style="color:#dc2626;margin-left:2px">✕</a></span>`).join(' ')}
          ${!b.superseded && ['opportunity','active_bid','submitted'].includes(b.stage) ? ` <a href="#" onclick="event.preventDefault();actAddSubEstimator(${b.id})" style="font-size:11px;color:#2563eb">+ Sub-estimator</a>` : ''}
          ${b.salesperson ? ` Sales: ${ini(b.salesperson)}` : ''}
          ${b.jurisdiction ? ` · Local ${esc(b.jurisdiction)}` : ''}
          ${b.next_followup_date ? ` · Next F/U: <span class="${b.next_followup_date < today ? 'overdue-txt' : ''}">${fmtD(b.next_followup_date)}${b.next_followup_date < today ? ' — OVERDUE' : ''}</span>` : ''}
          ${b.close_reason ? `<br>Closed ${fmtD(b.closed_date)} by ${esc(b.closed_approved_by)} — ${esc(b.close_reason)}` : ''}
          ${b.not_awarded_notes ? `<br><span style="color:#dc2626">Not awarded ${fmtD(b.date_not_awarded)}:</span> ${esc(b.not_awarded_notes)}` : ''}
          ${b.notes ? `<br>📝 ${esc(b.notes)}` : ''}
        </div>
        ${b.customers.length ? `<div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">${b.customers.map(cust => `
          <div style="border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fafbfc">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              <span onclick="openCompanyProfile(${cust.id})" style="cursor:pointer;color:#2563eb;font-weight:700;font-size:12.5px">🏢 ${esc(cust.name)}</span>
              <button type="button" title="Remove customer from this bid" onclick="actRemoveBidCustomer(${cust.bid_customer_id},'${escJs(cust.name)}')" style="border:none;background:none;color:#dc2626;cursor:pointer;font-size:13px;padding:2px 4px;line-height:1">✕</button>
            </div>
            ${bidCustomerContactsHtml(cust)}
          </div>`).join('')}</div>` : ''}
        ${(b.submissions || []).length ? `<div class="v2-fu"><div style="font-weight:600;color:var(--text);margin-bottom:3px">Submissions</div>${b.submissions.map(s => submissionRow(s, b)).join('')}</div>` : ''}
        ${(b.followups || []).length ? `<div class="v2-fu"><div style="font-weight:600;color:var(--text);margin-bottom:3px">Follow-ups</div>${b.followups.map(fuRow).join('')}</div>` : ''}
        ${remindersHtml('bid', b.id, b.reminders)}
        ${bidActions(b)}
      </div>
    </div>`;
}

// Reminders — polymorphic (bid or change_order). A personal tickler separate
// from the follow-up timer: "ping me on this date" regardless of stage.
function remindersHtml(parentType, parentId, reminders) {
  const active = (reminders || []).filter(r => !r.dismissed);
  const rows = active.map(r => {
    const overdue = r.remind_on < today;
    return `<div style="font-size:12px;display:flex;align-items:center;gap:6px;padding:3px 0">
      <span class="${overdue ? 'overdue-txt' : ''}">⏰ ${fmtD(r.remind_on)}${overdue ? ' — OVERDUE' : ''}</span>
      ${r.note ? `<span style="color:var(--text-muted)">${esc(r.note)}</span>` : ''}
      <a href="#" onclick="event.preventDefault();actDismissReminder('${parentType}',${parentId},${r._id})" style="font-size:11px;color:#2563eb">dismiss</a>
      <a href="#" onclick="event.preventDefault();actDeleteReminder('${parentType}',${parentId},${r._id})" style="font-size:11px;color:#dc2626">delete</a>
    </div>`;
  }).join('');
  return `<div style="margin-top:4px">${rows}
    <a href="#" onclick="event.preventDefault();actAddReminder('${parentType}',${parentId})" style="font-size:11px;color:#2563eb">+ Reminder</a>
  </div>`;
}
function actAddReminder(parentType, parentId) {
  showForm('⏰ Add Reminder', [
    { id: 'remind_on', label: 'Remind me on', type: 'date', required: true, value: today },
    { id: 'note', label: 'Note', type: 'textarea', placeholder: 'What to remember…' },
  ], data => api('POST', '/api/v2/reminders', { ...data, parent_type: parentType, parent_id: parentId }), 'Add Reminder', 'amber');
}
async function actDismissReminder(parentType, parentId, id) {
  try { await api('PUT', `/api/v2/reminders/${id}/dismiss`); await refresh(); }
  catch (e) { alert('Failed: ' + e.message); }
}
async function actDeleteReminder(parentType, parentId, id) {
  if (!confirm('Delete this reminder?')) return;
  try { await api('DELETE', `/api/v2/reminders/${id}`); await refresh(); }
  catch (e) { alert('Failed: ' + e.message); }
}

  // Superseded bids are inactive — no workflow buttons, but admins can still edit.
  let workflow = '';
  if (!b.superseded) {
    if (b.stage === 'opportunity') {
      workflow = `<button class="v2-btn blue" onclick="actStartBid(${b.id})">→ Start Bid</button>
                  <button class="v2-btn outline" onclick="actAddCustomers(${b.id})">+ Customer</button>
                  <button class="v2-btn outline" onclick="actLogFollowup('bid',${b.id})">📝 Log Follow-up</button>

                  <button class="v2-btn gray" onclick="actCloseBid(${b.id})">Close</button>`;
    } else if (b.stage === 'active_bid') {
      workflow = `<button class="v2-btn green" onclick="actSubmitBid(${b.id})">Submit Bid</button>
                  <button class="v2-btn outline" onclick="actAddCustomers(${b.id})">+ Customer</button>
                  <button class="v2-btn gray" onclick="actCloseBid(${b.id})">Close</button>`;
    } else if (b.stage === 'submitted') {
      // Follow-up / award / not-awarded are now per submission (on each submission row).

const CO_EDITABLE_STAGES = ['active_co', 'submitted_co'];

function coActions(co) {
  let workflow = '';
  if (co.superseded) {
    // Historical record only — no workflow buttons, same treatment as a superseded bid.
  } else if (co.stage === 'active_co') {
    workflow = `<button class="v2-btn green" onclick="actSubmitCO(${co.id})">Submit CO</button>
                <button class="v2-btn outline" onclick="actReviseCO(${co.id})">↻ Revise</button>
                <button class="v2-btn gray" onclick="actVoidCO(${co.id})">Void</button>`;
  } else if (co.stage === 'submitted_co') {
    workflow = `<button class="v2-btn blue" onclick="actLogFollowup('change_order',${co.id})">📝 Log Follow-up</button>
                <button class="v2-btn green" onclick="actApproveCO(${co.id})">✓ Approved</button>
                <button class="v2-btn red" onclick="actNotApprovedCO(${co.id})">✗ Not Approved</button>
                <button class="v2-btn outline" onclick="actReviseCO(${co.id})">↻ Revise</button>
                <button class="v2-btn gray" onclick="actVoidCO(${co.id})">Void</button>`;

}

const SUB_TYPE = { initial: 'initial', best_and_final: 'best & final', scope_add: 'scope add', scope_remove: 'scope remove', revised: 'revised' };

// One submission block: header line, per-customer outcome, its follow-ups, and
// its own action buttons (log follow-up / awarded / not awarded) while pending.
function submissionRow(s, bid) {
  const overdue = s.next_followup_date && s.next_followup_date < today && s.outcome === 'pending';
  let outcomeBadge = '';
  if (s.outcome === 'awarded') outcomeBadge = `<span class="awarded-pill">✓ AWARDED ${fmtD(s.award_date)}</span>`;
  else if (s.outcome === 'not_awarded') outcomeBadge = `<span class="badge" style="background:#fee2e2;color:#991b1b">✗ NOT AWARDED ${fmtD(s.date_not_awarded)}</span>`;

  // Only the CURRENT submission is actionable. Superseded versions are
  // historical record — no buttons, no follow-up timer, greyed out.
  const live = s.is_current && s.outcome === 'pending';

  if (live && bid && ['submitted', 'awarded'].includes(bid.stage)) {
    const awardBtn = bid.stage === 'submitted' ? `<button class="v2-btn green" onclick="actAwardSubmission(${s.id})">✓ Awarded</button>` : '';
    actions = `<div class="v2-actions" style="margin-top:4px">
      <button class="v2-btn blue" onclick="actLogFollowup('bid_submission',${s.id})">📝 Log Follow-up</button>
      ${awardBtn}
      <button class="v2-btn red" onclick="actNotAwardSubmission(${s.id})">✗ Not Awarded</button>

  }

  return `<div style="padding:6px 0;border-top:1px solid var(--border)${s.is_current ? '' : ';opacity:.5'}">
    <div style="font-size:12px">
      <strong>${esc(s.company?.name || '—')}</strong> — <span class="amount">${fmt$(s.amount)}</span>
      · ${SUB_TYPE[s.submission_type] || esc(s.submission_type)}
      · ${fmtD(s.date_submitted)}${s.approved_by ? ` (appr: ${esc(s.approved_by)})` : ''}
      ${s.is_current ? '' : '<span class="badge" style="background:#e2e8f0;color:#64748b;font-size:10px">superseded</span>'}
      ${outcomeBadge}
      ${live && s.next_followup_date ? ` · F/U: <span class="${overdue ? 'overdue-txt' : ''}">${fmtD(s.next_followup_date)}${overdue ? ' — OVERDUE' : ''}</span>` : ''}
      ${s.notes ? ` · ${esc(s.notes)}` : ''}
      ${s.not_awarded_notes ? ` · <span style="color:#991b1b">${esc(s.not_awarded_notes)}</span>` : ''}
      ${CURRENT_USER?.is_admin ? `<a href="#" onclick="event.preventDefault();actEditSubmission(${s.id})" style="font-size:11px;margin-left:4px">✏️</a>` : ''}
    </div>
    ${(s.followups || []).length ? `<div style="margin-left:12px;margin-top:2px">${s.followups.map(fuRow).join('')}</div>` : ''}

function fuRow(f) {

// ═══════════════════════════════════════════════════════════════════════════
// FORM MODAL FRAMEWORK
// fields: [{ id, label, type: text|number|date|select|textarea|multicheck, required, options, value, placeholder }]
// ═══════════════════════════════════════════════════════════════════════════
// ── Searchable combobox (field types 'company' and 'project') ───────────────
// Picks an existing record OR lets you type a brand-new name (chip tagged
// "new"). f.multi → many chips; otherwise single. Selection lives in
// COMBO_STATE[f.id] as [{id, name}] (id null = new record to create).
// 'project' fields additionally fuzzy-match (normalized substring, shared
// significant word, or small edit distance) so a near-duplicate project name
// surfaces as a suggestion instead of silently creating a second Project row.
let COMBO_STATE = {};   // fieldId -> [{id, name}]
let COMBO_FIELDS = {};  // fieldId -> field def

function _normName(s) { return (s || '').toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim(); }
function _lev(a, b) {
  const m = a.length, n = b.length;
  const d = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) d[i][0] = i;
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] : 1 + Math.min(d[i - 1][j], d[i][j - 1], d[i - 1][j - 1]);
  return d[m][n];
}
// Fuzzy score for project-name matching — lower is a closer match, null = no match.
function _projMatchScore(query, label) {
  const qn = _normName(query), on = _normName(label);
  if (!qn) return null;
  if (on === qn) return 0;
  if (on.includes(qn) || qn.includes(on)) return 1;
  const words = qn.split(' ').filter(w => w.length >= 4);
  if (words.some(w => on.includes(w))) return 2;
  const dist = _lev(qn, on);
  if (dist <= 3 && qn.length >= 4) return 3;
  return null;
}

function comboRenderChips(fid) {
  const el = document.getElementById('cc-' + fid + '-chips'); if (!el) return;
  el.innerHTML = (COMBO_STATE[fid] || []).map((s, i) =>
    `<span class="v2-chip">${esc(s.name)}${s.id ? '' : ' <em>new</em>'}<button type="button" onmousedown="event.preventDefault();comboRemove('${fid}',${i})">✕</button></span>`).join('');
}
function comboRemove(fid, i) { (COMBO_STATE[fid] || []).splice(i, 1); comboRenderChips(fid); comboRenderMenu(fid); }
function comboRenderMenu(fid) {
  const f = COMBO_FIELDS[fid], input = document.getElementById('vf-' + fid), menu = document.getElementById('cc-' + fid + '-menu');
  if (!f || !input || !menu) return;
  const raw = input.value.trim(), q = raw.toLowerCase();
  const chosen = new Set((COMBO_STATE[fid] || []).filter(s => s.id).map(s => s.id));
  const isProject = f.type === 'project';
  // Fuzzy-match scoring/behavior is keyed on the field TYPE ('project' gets
  // near-duplicate suggestions since typo'd project names are a real cost),
  // but the displayed noun is separate — `f.noun` lets a 'project'-typed
  // field used for something else (e.g. Company, which reuses 'project'
  // purely for its fuzzy matching) say the right word instead of literally
  // "project".
  const noun = f.noun || (isProject ? 'project' : 'customer');
  let opts;
  if (isProject) {
    if (!raw) opts = [];
    else opts = f.options.filter(o => !chosen.has(o.value))
      .map(o => ({ o, score: _projMatchScore(raw, o.label) }))
      .filter(x => x.score !== null).sort((a, b) => a.score - b.score).slice(0, 6).map(x => x.o);
  } else {
    opts = f.options.filter(o => !chosen.has(o.value) && (!q || o.label.toLowerCase().includes(q))).slice(0, 8);
  }
  const warn = (isProject && opts.length) ? `<div class="v2-combo-warn">⚠️ Found similar ${noun}${opts.length > 1 ? 's' : ''} below — pick one if it's the same one</div>` : '';
  let html = warn + opts.map(o => `<div class="v2-combo-opt" onmousedown="event.preventDefault();comboPick('${fid}',${o.value})">${esc(o.label)}</div>`).join('');
  const exact = f.options.some(o => o.label.toLowerCase() === q);
  const alreadyNew = (COMBO_STATE[fid] || []).some(s => !s.id && s.name.toLowerCase() === q);
  if (q && !exact && !alreadyNew && f.allowNew !== false)
    html += `<div class="v2-combo-opt v2-combo-new" onmousedown="event.preventDefault();comboAddNew('${fid}')">➕ Create new ${noun} "${esc(raw)}"</div>`;
  const emptyMsg = isProject ? `No similar ${noun}s found — keep typing to create a new one`
    : f.allowNew === false ? 'No matches' : `No matches — keep typing to add a new ${noun}`;
  menu.innerHTML = html || `<div class="v2-combo-empty">${emptyMsg}</div>`;
  // Fixed positioning computed from the real on-screen box (see the CSS
  // comment on .v2-combo-menu for why this can't just be absolute+CSS).
  const box = input.closest('.v2-combo-box') || input;
  const rect = box.getBoundingClientRect();
  menu.style.left = rect.left + 'px';
  menu.style.width = rect.width + 'px';
  menu.style.top = (rect.bottom + 3) + 'px';
  menu.style.display = 'block';
}
function comboPick(fid, val) {
  const f = COMBO_FIELDS[fid], opt = f.options.find(o => o.value == val); if (!opt) return;
  if (!f.multi) COMBO_STATE[fid] = [];
  COMBO_STATE[fid].push({ id: opt.value, name: opt.label });
  const input = document.getElementById('vf-' + fid); input.value = '';
  comboRenderChips(fid); comboRenderMenu(fid); input.focus();
}
function comboAddNew(fid) {
  const f = COMBO_FIELDS[fid], input = document.getElementById('vf-' + fid), name = input.value.trim(); if (!name) return;
  if (!f.multi) COMBO_STATE[fid] = [];
  COMBO_STATE[fid].push({ id: null, name });
  input.value = ''; comboRenderChips(fid); comboRenderMenu(fid); input.focus();
}
function initCombos(ov, fields) {
  COMBO_STATE = {}; COMBO_FIELDS = {};
  for (const f of fields.filter(x => x.type === 'company' || x.type === 'project')) {
    COMBO_FIELDS[f.id] = f; COMBO_STATE[f.id] = [];
    if (f.value != null) { const o = f.options.find(o => o.value == f.value); if (o) COMBO_STATE[f.id].push({ id: o.value, name: o.label }); }
    comboRenderChips(f.id);
    const input = ov.querySelector('#vf-' + f.id), menu = ov.querySelector('#cc-' + f.id + '-menu');
    input.addEventListener('input', () => comboRenderMenu(f.id));
    input.addEventListener('focus', () => comboRenderMenu(f.id));
    input.addEventListener('blur', () => setTimeout(() => { if (menu) menu.style.display = 'none'; }, 150));
  }
}

function showForm(title, fields, onSubmit, submitLabel = 'Save', submitClass = 'blue') {
  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.onclick = e => { if (e.target === ov) ov.remove(); };

  const fieldHtml = fields.map(f => {
    const req = f.required ? ' <span class="req">*</span>' : '';
    if (f.type === 'select') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        <select id="vf-${f.id}">
          ${f.required ? '' : '<option value="">—</option>'}
          ${f.options.map(o => `<option value="${o.value}" ${o.value == f.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
        </select></div>`;
    }
    if (f.type === 'multicheck') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        ${f.options.map(o => `<label class="v2-check"><input type="checkbox" data-multi="${f.id}" value="${o.value}"> ${esc(o.label)}</label>`).join('')}</div>`;
    }
    if (f.type === 'company' || f.type === 'project') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        <div class="v2-combo">
          <div class="v2-combo-box">
            <span id="cc-${f.id}-chips"></span>
            <input id="vf-${f.id}" class="v2-combo-input" type="text" autocomplete="off" placeholder="${esc(f.placeholder || 'Type to search…')}">
          </div>
          <div class="v2-combo-menu" id="cc-${f.id}-menu"></div>
        </div></div>`;
    }
    if (f.type === 'textarea') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        <textarea id="vf-${f.id}" rows="3" placeholder="${esc(f.placeholder || '')}">${esc(f.value ?? '')}</textarea></div>`;
    }
    return `<div class="v2-field"><label>${f.label}${req}</label>
      <input id="vf-${f.id}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}" ${f.type === 'number' ? 'step="any"' : ''}></div>`;
  }).join('');

  ov.innerHTML = `
    <div class="v2-modal">
      <div class="v2-modal-hd">${title}<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">${fieldHtml}</div>
      <div class="v2-modal-err" id="vf-err"></div>
      <div class="v2-modal-ft">
        <button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">Cancel</button>
        <button class="v2-btn ${submitClass}" id="vf-submit">${submitLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  initCombos(ov, fields);

  document.getElementById('vf-submit').onclick = async () => {
    const data = {};
    let missing = [];
    for (const f of fields) {
      if (f.type === 'multicheck') {
        data[f.id] = [...ov.querySelectorAll(`input[data-multi="${f.id}"]:checked`)].map(c => Number(c.value));
        if (f.required && !data[f.id].length) missing.push(f.label);
      } else if (f.type === 'company' || f.type === 'project') {
        const sel = COMBO_STATE[f.id] || [];
        const ids = sel.filter(s => s.id).map(s => s.id);
        const names = sel.filter(s => !s.id).map(s => s.name);
        if (f.multi) { data[f.id] = ids; data[f.newKey || 'new_companies'] = names; }
        else { data[f.id] = ids[0] ?? null; data[f.newKey || 'new_company'] = names[0] || null; }
        if (f.required && !ids.length && !names.length) missing.push(f.label);
      } else {
        const v = document.getElementById('vf-' + f.id)?.value?.trim();
        data[f.id] = v || null;
        if (f.required && !v) missing.push(f.label);
      }
    }
    const errEl = document.getElementById('vf-err');
    if (missing.length) { errEl.textContent = 'Required: ' + missing.join(', '); errEl.style.display = 'block'; return; }
    try {
      await onSubmit(data);
      ov.remove();
      await refresh();
    } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
  };
}

// Merge duplicate jobs (same job #) within a project — COs move to the bid-backed
// job (the real one); the legacy duplicate is deleted. Live, no re-import needed.
async function actMergeDupeJobs(projectId) {
  const d = DETAIL_CACHE[projectId]; if (!d) return;
  const byNum = {};
  d.jobs.forEach(j => { if (j.job_number) (byNum[j.job_number] = byNum[j.job_number] || []).push(j); });
  const groups = Object.values(byNum).filter(g => g.length > 1);
  if (!groups.length) return;
  const total = groups.reduce((s, g) => s + g.length, 0);
  if (!confirm(`Merge ${total} duplicate jobs into ${groups.length}? Change orders move onto the bid-backed job; the duplicates are deleted.`)) return;
  try {
    for (const g of groups) {
      // survivor = the job tied to an awarded bid; else the one with the most COs
      const survivor = g.find(j => j.winning_bid_id) || [...g].sort((a, b) => b.change_orders.length - a.change_orders.length)[0];
      const mergeIds = g.filter(j => j.id !== survivor.id).map(j => j.id);
      await api('POST', '/api/v2/admin/merge-jobs', { survivor_id: survivor.id, merge_ids: mergeIds });
    }
    await refresh();
  } catch (e) { alert('Merge failed: ' + e.message); }
}

// Global entry point (Active Change Orders page) — a CO always requires an
// existing Job, so this is a two-step picker: project, then which of its
// jobs (usually one, but legacy + bid-backed duplicates can leave more than
// one until merged). Falls through to the same actAddCO() form once a job
// is chosen — no duplicated form logic.
// One fuzzy search box across BOTH project name and job # — a PM's change-
// order request rarely uses the exact project name shown in the app, but
// it's very often the job # (or close to it), so matching either field in
// one box gets the coordinator straight to the right job without needing
// to know the project naming convention.
let NCO_JOBS = [];
async function actNewChangeOrder() {
  NCO_JOBS = await api('GET', '/api/v2/jobs-picker');

  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.innerHTML = `
    <div class="v2-modal" style="max-width:460px">
      <div class="v2-modal-hd">+ New Change Order<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">
        <div class="v2-field"><label>Project name or Job #</label>
          <div class="v2-combo">
            <div class="v2-combo-box">
              <input id="vf-nco-jobsearch" class="v2-combo-input" type="text" autocomplete="off" placeholder="Type whatever the PM called it — name or job #…">
            </div>
            <div class="v2-combo-menu" id="cc-nco-jobsearch-menu"></div>
          </div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const input = document.getElementById('vf-nco-jobsearch');
  const menu = document.getElementById('cc-nco-jobsearch-menu');
  const renderMenu = () => {
    const raw = input.value.trim();
    if (!raw) { menu.style.display = 'none'; return; }
    const scored = NCO_JOBS.map(j => {
      const scores = [_projMatchScore(raw, j.project_name), j.job_number ? _projMatchScore(raw, j.job_number) : null].filter(s => s !== null);
      return scores.length ? { j, score: Math.min(...scores) } : null;
    }).filter(Boolean).sort((a, b) => a.score - b.score).slice(0, 8);
    menu.innerHTML = scored.length
      ? scored.map(({ j }) => `<div class="v2-combo-opt" onmousedown="event.preventDefault();ncoPickJob(${j.id})">${esc(j.project_name)} ${j.job_number ? `<span style="color:var(--text-muted)">— Job ${esc(j.job_number)}</span>` : `<span style="color:#d97706">— Job # pending</span>`}</div>`).join('')
      : `<div class="v2-combo-empty">No matching project or job # — a change order needs an existing job (created at bid award, or via "+ Legacy Job")</div>`;
    const box = input.closest('.v2-combo-box');
    const rect = box.getBoundingClientRect();
    menu.style.left = rect.left + 'px'; menu.style.width = rect.width + 'px'; menu.style.top = (rect.bottom + 3) + 'px';
    menu.style.display = 'block';
  };
  input.addEventListener('input', renderMenu);
  input.addEventListener('focus', renderMenu);
  input.addEventListener('blur', () => setTimeout(() => { menu.style.display = 'none'; }, 150));
  setTimeout(() => input.focus(), 30);
}

let HEALTH = null;

// HISTORY — audit trail of who did what, when (admin-only, same gate as
// Data Health merges). Most actions aren't safely auto-reversible; "Undo"
// only shows up on the handful of action types the backend actually knows
// how to reverse (due-date changes, sub-estimator add/remove, reminder
// dismiss) — everything else is a record only.

async function renderHistory() {
  setActiveNav('history');
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Loading…</div>';
  let rows;
  try { await ensureMeta(); rows = await api('GET', '/api/v2/activity?limit=300'); }
  catch (e) { main.innerHTML = `<div class="err-card" style="margin:20px">${esc(e.message)}</div>`; return; }

  main.innerHTML = `
    <div class="page-header"><div><div class="page-title">🕓 History</div><div class="page-subtitle">${rows.length} recent actions</div></div></div>
    <div class="card" style="padding:0">${rows.length ? rows.map(r => `
      <div class="proj-row" style="cursor:default">
        <div style="flex:1;min-width:0">
          <div class="proj-name" style="font-size:13px;font-weight:600">${esc(r.summary)}${r.undone ? ' <span class="badge" style="background:#e2e8f0;color:#64748b">UNDONE</span>' : ''}</div>
          <div class="proj-meta">${esc(r.actor_name || 'Unknown')} · ${fmtD(r.ts.slice(0,10))} ${r.ts.slice(11,16)}</div>
        </div>
        ${r.undoable ? `<button class="v2-btn outline" style="flex-shrink:0" onclick="actUndoHistory(${r.id})">↩ Undo</button>` : ''}
      </div>`).join('') : '<div style="padding:24px;text-align:center;color:var(--text-muted)">Nothing logged yet</div>'}</div>`;
}
async function actUndoHistory(id) {
  if (!confirm('Undo this action?')) return;
  try { await api('POST', `/api/v2/activity/${id}/undo`); await renderHistory(); }
  catch (e) { alert('Failed: ' + e.message); }
}
