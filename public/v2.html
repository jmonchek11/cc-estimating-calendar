// ── Online presence — reuses v1's /api/heartbeat + /api/online (global,
// not v2-specific) so anyone signed in shows up regardless of which
// frontend they're using. ────────────────────────────────────────────────
let _onlinePollTimer = null;
function startOnlinePolling() {
  if (_onlinePollTimer) return;
  const tick = async () => {
    try {
      await fetch('/api/heartbeat', { method: 'POST' });
      const users = await (await fetch('/api/online')).json();
      const label = document.getElementById('online-count-label');
      if (label) label.textContent = `${users.length} online`;
    } catch { /* transient — next tick will retry */ }
  };
  tick();
  _onlinePollTimer = setInterval(tick, 60_000);
}
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const mins = Math.round((Date.now() - new Date(dateStr).getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins === 1) return '1 min ago';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  return `${hrs} hr${hrs !== 1 ? 's' : ''} ago`;
}
// Every Liberty app the switcher knows about. `always: true` means it shows

        </${tag}>`;
      }).join('')}
      <div class="switcher-pop-divider"></div>
      <div class="switcher-pop-foot">↗ opens in a new tab</div>
    </div>`;
}
function toggleAppSwitcher() {
  const btn = document.getElementById('app-switcher-btn');
  const pop = document.getElementById('app-switcher-pop');
  const open = pop.classList.toggle('open');
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.app-switcher');
  const pop = document.getElementById('app-switcher-pop');
  if (wrap && pop && pop.classList.contains('open') && !wrap.contains(e.target)) toggleAppSwitcher();
});
async function openOnlinePanel() {
  let users;
  try { users = await api('GET', '/api/online'); } catch (e) { alert(e.message); return; }
  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.innerHTML = `
    <div class="v2-modal" style="max-width:340px">
      <div class="v2-modal-hd">🟢 Who's Online<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">
        ${users.length ? users.map(u => `
          <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
            <span class="initials-pill${u.role === 'sales' ? ' initials-pill-sales' : ''}">${esc(u.initials)}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600">${esc(u.name)}</div>
              <div style="font-size:11px;color:var(--text-muted);text-transform:capitalize">${esc(u.role || '')}</div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);flex-shrink:0">${timeAgo(u.last_seen)}</div>
          </div>`).join('')
        : '<div style="font-size:13px;color:var(--text-muted);padding:8px 0">No one else is online right now.</div>'}
      </div>
    </div>`;
  document.body.appendChild(ov);
}

// ── Ideas / Issues — reuses v1's /api/ideas (global) ─────────────────────
const IDEA_PAGE_NAMES = {
  dashboard: 'Dashboard', digest: 'Weekly Digest', calendar: 'Calendar',
  opportunities: 'Opportunities', 'active-bids': 'Active Bids', 'submitted-bids': 'Submitted Bids', 'awarded-bids': 'Awarded Bids',
  'active-cos': 'Active Change Orders', 'submitted-cos': 'Submitted Change Orders',
  projects: 'Projects', contacts: 'Contacts', health: 'Data Health', history: 'History',
  settings: 'Settings', ideas: 'Ideas & Issues',
};
// Visible to everyone (not just admins) — the whole point of voting is that
// people can see what's already been suggested and back it instead of
// filing a duplicate. IDEAS_COMMENTS_OPEN tracks which threads are expanded
// across re-renders (voting/commenting re-fetches + rebuilds this modal).
let IDEAS_CACHE = [];
const IDEAS_COMMENTS_OPEN = new Set();
const IDEA_STATUS_LABEL = { new: 'New', reviewed: 'Reviewed', done: 'Done', wontfix: "Won't Fix" };
const IDEA_TYPE_ICON = t => t === 'issue' ? '🐛' : '💡';

// Screenshots attached to a not-yet-submitted idea/bug — a plain JS array
// (not DOM state) so it survives openIdeasModal() rebuilding the whole modal
// on every vote/comment. Cleared on successful submit or explicit close.
const IDEA_MAX_IMAGES = 3;
let IDEA_PENDING_IMAGES = [];
function clearIdeaImages() { IDEA_PENDING_IMAGES = []; }

// Resizes/re-encodes to keep the base64 payload small before it ever leaves
// the browser — a raw phone-screenshot-sized PNG could be several MB; this
// gets a typical screenshot down to roughly 100-300KB.
async function compressImageFile(file) {
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  const img = await new Promise((resolve, reject) => {
    const el = new Image();
    el.onload = () => resolve(el);
    el.onerror = reject;
    el.src = dataUrl;
  });
  const MAX_W = 1600;
  const scale = Math.min(1, MAX_W / img.width);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.8);
}
async function addIdeaImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  if (IDEA_PENDING_IMAGES.length >= IDEA_MAX_IMAGES) { alert(`Max ${IDEA_MAX_IMAGES} screenshots per submission.`); return; }
  try {
    IDEA_PENDING_IMAGES.push(await compressImageFile(file));
    renderIdeaImagePreviews();
  } catch (e) { console.error('image compress failed', e); }
}
function handleIdeaImageFiles(fileList) {
  [...fileList].forEach(f => addIdeaImage(f));
  const input = document.getElementById('idea-image-input');
  if (input) input.value = '';
}
function handleIdeaImagePaste(event) {
  const items = event.clipboardData?.items || [];
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) { event.preventDefault(); addIdeaImage(file); }
    }
  }
}
function removeIdeaImage(idx) {
  IDEA_PENDING_IMAGES.splice(idx, 1);
  renderIdeaImagePreviews();
}
function renderIdeaImagePreviews() {
  const el = document.getElementById('idea-image-previews');
  if (!el) return;
  el.innerHTML = IDEA_PENDING_IMAGES.map((src, idx) => `
    <div style="position:relative;width:64px;height:64px">
      <img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer" onclick="openImageLightbox(IDEA_PENDING_IMAGES[${idx}])">
      <button onclick="removeIdeaImage(${idx})" title="Remove" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:none;background:#dc2626;color:white;font-size:11px;line-height:1;cursor:pointer">✕</button>
    </div>`).join('');
}
// Full-size click-through view for any thumbnail (pending or already-submitted).
function openImageLightbox(src) {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85)';
  ov.onclick = () => ov.remove();
  ov.innerHTML = `<img src="${src}" style="max-width:92vw;max-height:92vh;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)">
    <button style="position:absolute;top:16px;right:24px;background:none;border:none;color:white;font-size:28px;cursor:pointer;line-height:1">✕</button>`;
  document.body.appendChild(ov);
}

function ideaCardHtml(i, isAdmin) {
  const upActive = i.my_vote === 1, downActive = i.my_vote === -1;
  const done = i.is_terminal;
  const openComments = IDEAS_COMMENTS_OPEN.has(i.id);
  return `
    <div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;${done ? 'opacity:0.55' : ''}">
      <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:28px">
        <button onclick="voteOnIdea(${i.id},1)" style="border:none;background:none;cursor:pointer;font-size:13px;padding:1px;color:${upActive ? '#2563eb' : 'var(--text-muted)'}" title="Upvote">▲</button>
        <div style="font-size:12px;font-weight:700;color:var(--text)">${i.score}</div>
        <button onclick="voteOnIdea(${i.id},-1)" style="border:none;background:none;cursor:pointer;font-size:13px;padding:1px;color:${downActive ? '#dc2626' : 'var(--text-muted)'}" title="Downvote">▼</button>
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:flex-start;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;${done ? 'text-decoration:line-through' : ''}">${IDEA_TYPE_ICON(i.type)} ${esc(i.title)}</div>
            ${i.body ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px">${esc(i.body)}</div>` : ''}
            ${i.images?.length ? `<div style="display:flex;gap:6px;margin-top:6px">${i.images.map((src, idx) => `<img src="${src}" style="width:48px;height:48px;object-fit:cover;border-radius:5px;border:1px solid var(--border);cursor:pointer" onclick="openImageLightbox(IDEAS_CACHE.find(x=>x.id===${i.id}).images[${idx}])">`).join('')}</div>` : ''}
            <div style="font-size:11px;color:var(--text-muted);margin-top:4px">
              ${i.submitted_by_name ? esc(i.submitted_by_name) : 'Anonymous'} · ${fmtD((i.created_at || '').slice(0, 10))}
              ${i.page ? ` · <span style="background:#f1f5f9;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600">${esc(IDEA_PAGE_NAMES[i.page] || i.page)}</span>` : ''}
              · <span style="background:#f1f5f9;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600">${IDEA_STATUS_LABEL[i.status]}</span>
            </div>
          </div>
          ${isAdmin ? `<select style="font-size:11px;border-radius:4px;padding:2px 4px;border:1px solid var(--border);cursor:pointer;flex-shrink:0" onchange="setIdeaStatus(${i.id}, this.value)">
            ${['new', 'reviewed', 'done', 'wontfix'].map(s => `<option value="${s}" ${i.status === s ? 'selected' : ''}>${IDEA_STATUS_LABEL[s]}</option>`).join('')}
          </select>` : ''}
        </div>
        <a href="#" onclick="event.preventDefault();toggleIdeaComments(${i.id})" style="font-size:11px;color:#2563eb;display:inline-block;margin-top:4px">💬 ${i.comments.length} comment${i.comments.length === 1 ? '' : 's'}</a>
        ${openComments ? `
          <div style="margin-top:6px;padding:8px;background:var(--bg);border-radius:6px">
            ${i.comments.map(c => `<div style="font-size:12px;margin-bottom:6px"><strong>${esc(c.user_name)}</strong> <span style="color:var(--text-muted);font-size:11px">${fmtHistoryTs(c.created_at)}</span><div>${esc(c.text)}</div></div>`).join('') || '<div style="font-size:12px;color:var(--text-muted)">No comments yet.</div>'}
            <div style="display:flex;gap:6px;margin-top:6px">
              <input id="idea-comment-${i.id}" type="text" placeholder="Add a comment…" style="flex:1;font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:4px" onkeydown="if(event.key==='Enter')postIdeaComment(${i.id})">
              <button class="v2-btn blue" style="padding:4px 10px;font-size:11px" onclick="postIdeaComment(${i.id})">Post</button>
            </div>
          </div>` : ''}
      </div>
    </div>`;
}

async function openIdeasModal() {
  const isAdmin = !!CURRENT_USER?.is_admin;
  try { IDEAS_CACHE = await api('GET', '/api/ideas'); } catch { IDEAS_CACHE = []; }
  const firstTerminalIdx = IDEAS_CACHE.findIndex(i => i.is_terminal);

  // Voting, toggling comments, posting one, and changing status all call
  // this to refresh the list — but it rebuilds the whole modal from
  // scratch, and a brand-new DOM node's scroll position always starts at
  // 0. Capture/restore it so clicking something halfway down the list
  // doesn't snap you back to the top.
  const prevModal = document.querySelector('#v2-form-overlay .v2-modal');
  const prevScroll = prevModal ? prevModal.scrollTop : 0;

  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  const currentPage = (location.hash || '#dashboard').replace('#', '').split('/')[0];
  ov.innerHTML = `
    <div class="v2-modal" style="max-width:520px;max-height:85vh;overflow-y:auto">
      <div class="v2-modal-hd">💡 Ideas &amp; Issues<button class="v2-btn outline" onclick="clearIdeaImages();document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">
        <p style="font-size:13px;color:var(--text-muted);margin:0 0 12px">Have an idea to improve the app, or spotted something broken? Upvote an existing one below, or add your own.</p>
        <div class="v2-field"><label>Type</label>
          <div style="display:flex;gap:14px">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="idea-type" value="idea" checked> 💡 Idea / Enhancement</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="idea-type" value="issue"> 🐛 Bug / Issue</label>
          </div>
        </div>
        <div class="v2-field"><label>Related to</label>
          <select id="idea-page">
            ${Object.entries(IDEA_PAGE_NAMES).map(([v, l]) => `<option value="${v}" ${currentPage === v ? 'selected' : ''}>${l}</option>`).join('')}
            <option value="general" ${!IDEA_PAGE_NAMES[currentPage] ? 'selected' : ''}>General / Not page-specific</option>
          </select>
        </div>
        <div class="v2-field"><label>Title <span class="req">*</span></label><input id="idea-title" type="text" placeholder="One line summary…"></div>
        <div class="v2-field"><label>Details</label><textarea id="idea-body" rows="3" placeholder="Any extra context, steps to reproduce, etc." onpaste="handleIdeaImagePaste(event)"></textarea></div>
        <div class="v2-field">
          <label>Screenshots <span style="font-weight:400;color:var(--text-muted)">(optional — paste or attach, up to ${IDEA_MAX_IMAGES})</span></label>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <button class="v2-btn outline" style="font-size:12px;padding:5px 10px" onclick="document.getElementById('idea-image-input').click()">📎 Attach image</button>
            <input id="idea-image-input" type="file" accept="image/*" multiple style="display:none" onchange="handleIdeaImageFiles(this.files)">
            <span style="font-size:11px;color:var(--text-muted)">or paste a screenshot into Details</span>
          </div>
          <div id="idea-image-previews" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:6px"><button class="v2-btn blue" onclick="submitIdea()">Submit</button></div>
        <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
          <div style="font-size:13px;font-weight:700;margin-bottom:4px">📥 All Submissions (${IDEAS_CACHE.length})</div>
          ${IDEAS_CACHE.length ? IDEAS_CACHE.map((i, idx) => (idx === firstTerminalIdx ? '<div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)">Resolved</div>' : '') + ideaCardHtml(i, isAdmin)).join('') : '<div style="font-size:13px;color:var(--text-muted)">No submissions yet.</div>'}
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const newModal = ov.querySelector('.v2-modal');
  if (newModal) newModal.scrollTop = prevScroll;
  renderIdeaImagePreviews();
}
async function submitIdea() {
  const title = document.getElementById('idea-title')?.value.trim();
  if (!title) { document.getElementById('idea-title')?.focus(); return; }
  const type = document.querySelector('input[name="idea-type"]:checked')?.value || 'idea';
  const body = document.getElementById('idea-body')?.value.trim() || '';
  const page = document.getElementById('idea-page')?.value || null;
  try {
    await api('POST', '/api/ideas', { type, title, body, page, images: IDEA_PENDING_IMAGES });
    clearIdeaImages();
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#166534;color:white;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999';
    toast.textContent = '✓ Submitted — thanks!';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
    await openIdeasModal();
  } catch (e) { alert('Failed: ' + e.message); }
}
async function setIdeaStatus(id, status) {
  try { await api('PUT', `/api/ideas/${id}`, { status }); await openIdeasModal(); } catch (e) { alert(e.message); }
}
async function voteOnIdea(id, value) {
  const idea = IDEAS_CACHE.find(i => i.id === id);
  const next = idea && idea.my_vote === value ? 0 : value; // clicking your own vote again un-votes
  try { await api('POST', `/api/ideas/${id}/vote`, { value: next }); await openIdeasModal(); }
  catch (e) { alert('Failed: ' + e.message); }
}
function toggleIdeaComments(id) {
  if (IDEAS_COMMENTS_OPEN.has(id)) IDEAS_COMMENTS_OPEN.delete(id); else IDEAS_COMMENTS_OPEN.add(id);
  openIdeasModal();
}
async function postIdeaComment(id) {
  const input = document.getElementById(`idea-comment-${id}`);
  const text = input?.value.trim();
  if (!text) return;
  try {
    await api('POST', `/api/ideas/${id}/comments`, { text });
    IDEAS_COMMENTS_OPEN.add(id);
    await openIdeasModal();
  } catch (e) { alert('Failed: ' + e.message); }
}

async function bootstrap() {
  try { await ensureMeta(); } catch { /* not logged in — ensureMeta already redirected, or a real error will surface per-page */ }
  const userEl = document.getElementById('sidebar-user');
  if (userEl && CURRENT_USER) userEl.textContent = CURRENT_USER.name + (CURRENT_USER.is_admin ? ' (admin)' : '');
  if (CURRENT_USER) startOnlinePolling();
  const historyNav = document.getElementById('nav-history');
  if (historyNav && CURRENT_USER?.is_admin) historyNav.style.display = 'flex';
  routeFromHash();
}
bootstrap();
</script>
