<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0f1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  /* Page scaffolding (no sidebar in the preview — single column like a report) */
  body { padding: 0; margin: 0; }
  .v2-banner {
    background: #1e293b; padding: 12px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .v2-banner .ttl { color: #fff; font-size: 15px; font-weight: 700; }
  .v2-banner .tag { background: #f59e0b; color: #1e293b; font-size: 10px; font-weight: 800; padding: 2px 10px; border-radius: 10px; letter-spacing: .5px; }
  .v2-banner .sub { color: #94a3b8; font-size: 12px; margin-left: auto; }
  .v2-banner a { color: #7dd3fc; text-decoration: none; }
  .v2-wrap { max-width: 920px; margin: 24px auto; padding: 0 20px; }

  /* Hierarchy nesting — matches the v1 project panel look */
  .v2-hier { display: none; border-top: 1px solid var(--border); padding: 14px 20px 18px; background: #fcfdfe; }
  .v2-hier.open { display: block; }
  .v2-bid {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card-bg); padding: 12px 14px; margin-top: 10px;
    box-shadow: var(--shadow);
  }
  .v2-bid.awarded { border-left: 3px solid #16a34a; background: #f0fdf4; }
  .v2-job {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border); border-left: 3px solid #0891b2;
    border-radius: var(--radius); background: #f0fdff; padding: 10px 14px;
    margin: 8px 0 0 28px;
  }
  .v2-co {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 12px 8px 14px; margin-left: 56px;
    border-left: 2px solid var(--border);
  }
  .v2-co:last-child { border-radius: 0 0 6px 0; }
  .v2-fu {
    border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 6px;
    font-size: 12px; color: var(--text-muted);
  }
  .v2-fu-row { padding: 2px 0; }
  .awarded-pill {
    display: inline-block; background: #16a34a; color: #fff;
    font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
  }
  .pending-pill {
    display: inline-block; background: #fef3c7; color: #92400e;
    font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
  }
  .legacy-pill {
    display: inline-block; background: #ede9fe; color: #5b21b6;
    font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
  }
  .amount { font-weight: 700; color: #166534; }
  .overdue-txt { color: #dc2626; font-weight: 700; }
  .err-card { background: #fee2e2; color: #991b1b; padding: 16px 20px; border-radius: var(--radius); font-size: 14px; }

  /* Bid card redesign — one row per customer (was a separate Customers list
     + Submissions list showing the same company twice), one accent color,
     rare actions tucked into a "⋯" menu instead of a permanent button wall. */
  .bc-card { border: 1px solid var(--border); border-radius: 12px; background: var(--card-bg); box-shadow: var(--shadow); margin-top: 10px; overflow: hidden; }
  .bc-card.bc-superseded { opacity: .6; }
  .bc-hd { padding: 14px 16px 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .bc-hd-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bc-bidnum { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .bc-hd-right { text-align: right; flex-shrink: 0; }
  .bc-amount { font-size: 15px; font-weight: 800; }
  .bc-due { font-size: 11.5px; margin-top: 1px; }
  .bc-meta { padding: 0 16px 12px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }
  .bc-divider { height: 1px; background: var(--border); margin: 0 16px; }
  .bc-section { padding: 14px 16px; }
  .bc-sec-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .bc-sec-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #94a3b8; }
  .bc-quiet-link { font-size: 12px; color: #2563eb; font-weight: 600; cursor: pointer; background: none; border: none; padding: 2px 0; font-family: inherit; }
  .bc-quiet-link:hover { text-decoration: underline; }
  .bc-grouped { background: #f8fafc; border-radius: 8px; overflow: hidden; }
  .bc-row { padding: 10px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .bc-row + .bc-row { border-top: 1px solid #eef0f3; }
  .bc-row-main { min-width: 0; }
  .bc-co-name { font-size: 13px; font-weight: 700; cursor: pointer; }
  .bc-co-name:hover { color: #2563eb; }
  .bc-co-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .bc-co-amt { font-size: 13px; font-weight: 700; text-align: right; }
  .bc-co-fu { font-size: 11px; color: #94a3b8; margin-top: 2px; text-align: right; }
  .bc-row-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .bc-btn-quiet { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: #475569; cursor: pointer; font-family: inherit; }
  .bc-btn-quiet:hover { background: #f1f5f9; }
  .bc-remove-x { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 11px; padding: 2px 4px; font-family: inherit; }
  .bc-ft { padding: 12px 16px 14px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .bc-menu-wrap { position: relative; }
  .bc-btn-dots { border: 1px solid var(--border); background: #fff; color: #64748b; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 15px; font-family: inherit; }
  .bc-btn-dots:hover { background: #f1f5f9; }
  .bc-dropdown { position: absolute; right: 0; bottom: 36px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(15,23,42,.14); min-width: 180px; padding: 6px; display: none; z-index: 20; }
  .bc-dropdown.open { display: block; }
  .bc-dropdown a { display: block; padding: 8px 10px; font-size: 13px; color: #334155; text-decoration: none; border-radius: 6px; }
  .bc-dropdown a:hover { background: #f1f5f9; }
  .bc-dropdown a.bc-danger { color: #dc2626; }

  /* Action buttons + modal */
  .v2-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .v2-btn {
    font-family: inherit; font-size: 11px; font-weight: 700; padding: 4px 12px;
    border-radius: 6px; border: none; cursor: pointer; color: #fff; transition: opacity .12s;
  }
  .v2-btn:hover { opacity: .85; }
  .v2-btn.green { background: #16a34a; } .v2-btn.blue { background: #2563eb; }
  .v2-btn.red { background: #dc2626; } .v2-btn.gray { background: #64748b; }
  .v2-btn.amber { background: #d97706; } .v2-btn.outline { background: #fff; color: #475569; border: 1px solid var(--border); }
  .v2-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .v2-modal {
    background: #fff; border-radius: 10px; width: 100%; max-width: 440px;
    max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .v2-modal-hd {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 800; font-size: 14px;
  }
  .v2-modal-bd { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .v2-modal-ft { padding: 0 20px 18px; display: flex; gap: 8px; justify-content: flex-end; }
  .v2-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .v2-field label .req { color: #dc2626; }
  .v2-field input, .v2-field select, .v2-field textarea {
    width: 100%; font-family: inherit; font-size: 13px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text);
  }
  .v2-field input:focus, .v2-field select:focus, .v2-field textarea:focus {
    outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1);
  }
  /* Higher specificity than ".v2-field label" (which sets display:block for
     normal field labels) — otherwise it wins the tie and the checkbox/text
     inside a multicheck option stack instead of sitting side by side. */
  .v2-field label.v2-check { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; color: var(--text); margin-bottom: 0; padding: 3px 0; cursor: pointer; text-transform: none; }
  .v2-check input[type="checkbox"] { flex-shrink: 0; width: 15px; height: 15px; margin: 0; }
  .v2-modal-err { color: #dc2626; font-size: 12px; font-weight: 600; display: none; padding: 0 20px 10px; }
  /* searchable company combobox */
  .v2-combo { position: relative; }
  .v2-combo-box { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; padding: 4px 6px; }
  .v2-combo-box:focus-within { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
  .v2-combo-input { flex: 1; min-width: 120px; border: none !important; box-shadow: none !important;
    padding: 3px 2px !important; font-size: 13px; outline: none; }
  .v2-chip { display: inline-flex; align-items: center; gap: 5px; background: #eff6ff; color: #1e40af;
    border: 1px solid #bfdbfe; border-radius: 5px; padding: 2px 6px; font-size: 12px; font-weight: 600; }
  .v2-chip button { border: none; background: none; color: #1e40af; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; }
  .v2-chip em { color: #16a34a; font-style: normal; font-weight: 700; }
  /* position:fixed (not absolute) + JS-computed coordinates (see comboRenderMenu) —
     an absolutely-positioned dropdown gets clipped by any scrollable ancestor
     (e.g. .v2-modal's overflow-y:auto), which squeezed every dropdown in a
     form modal into whatever space happened to be left. Fixed positioning
     escapes that since no ancestor here uses transform/filter. */
  .v2-combo-menu { display: none; position: fixed; z-index: 200;
    background: #fff; border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12);
    max-height: 230px; overflow-y: auto; }
  .v2-combo-opt { padding: 7px 10px; font-size: 13px; cursor: pointer; }
  .v2-combo-opt:hover { background: #f1f5f9; }
  .v2-combo-new { color: #16a34a; font-weight: 600; border-top: 1px solid var(--border); }
  .v2-combo-empty { padding: 7px 10px; font-size: 12px; color: var(--text-muted); }
  .v2-combo-warn { padding: 6px 10px; font-size: 11px; font-weight: 600; color: #92400e; background: #fffbeb; border-bottom: 1px solid #fcd34d; }
  /* list filter/sort toolbar */
  .v2-filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fafbfc; }
  .v2-filterbar input[type="text"], .v2-filterbar select {
    font-family: inherit; font-size: 12.5px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text);
  }
  .v2-filterbar input[type="text"] { flex: 1; min-width: 160px; }
  .v2-filterbar label.mine { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
  .v2-filterbar .clear-link { font-size: 12px; color: #2563eb; cursor: pointer; white-space: nowrap; }

  /* Detail flyout (slide-over) */
  .fly-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 90; opacity: 0; transition: opacity .15s; }
  .fly-overlay.open { opacity: 1; }
  .fly-panel { position: fixed; top: 0; right: 0; height: 100%; width: 560px; max-width: 94vw; background: var(--bg); box-shadow: -8px 0 30px rgba(0,0,0,.18); z-index: 91; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s ease; }
  .fly-panel.open { transform: translateX(0); }
  .fly-head { padding: 14px 18px; background: #1e293b; color: #fff; display: flex; align-items: center; gap: 10px; }
  .fly-head .fly-title { font-weight: 800; font-size: 15px; flex: 1; min-width: 0; }
  .fly-head .fly-sub { color: #94a3b8; font-size: 12px; }
  .fly-head a { color: #7dd3fc; text-decoration: none; font-size: 12px; }
  .fly-head .fly-close { background: rgba(255,255,255,.12); color: #fff; border: none; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 15px; }
  .fly-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
const fmt$ = n => n == null ? '' : new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);
const fmtD = d => { if (!d) return ''; const [y,m,dd] = d.split('-'); return `${Number(m)}/${Number(dd)}/${String(y).slice(2)}`; };
// Activity log `ts` is stored as a naive "YYYY-MM-DD HH:MM:SS" UTC string (no
// offset marker) — must be explicitly parsed as UTC, then rendered in the
// office's timezone (America/New_York), 12hr clock, or it silently drifts by
// the server/browser UTC offset (and can even show the wrong calendar date
// near midnight).
const fmtHistoryTs = ts => {
  if (!ts) return '';
  const d = new Date(ts.replace(' ', 'T') + 'Z');
  return d.toLocaleString('en-US', { timeZone: 'America/New_York', month: 'numeric', day: 'numeric', year: '2-digit', hour: 'numeric', minute: '2-digit', hour12: true });
};
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// For a name/string embedded inside a single-quoted JS string literal that's
// itself inside an onclick="..." HTML attribute (two escaping layers at
// once). esc() alone leaves apostrophes untouched — harmless in plain text,
// but "Jim O'Driscoll" as an onclick argument breaks the generated JS at the
// apostrophe (silently — the click handler just throws and does nothing).
const escJs = s => esc(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
const today = new Date().toISOString().split('T')[0];
const STAGE = {
  opportunity:'Opportunity', active_bid:'Active Bid', submitted:'Submitted', awarded:'Awarded',
  not_awarded:'Not Awarded', closed:'Closed',
  active_co:'Active CO', submitted_co:'Submitted CO', approved:'Approved', not_approved:'Not Approved', voided:'Voided',
};
const STAGE_COLOR = {
  opportunity:'#64748b', active_bid:'#d97706', submitted:'#2563eb', awarded:'#16a34a',
  not_awarded:'#dc2626', closed:'#64748b',
  active_co:'#d97706', submitted_co:'#2563eb', approved:'#16a34a', not_approved:'#dc2626', voided:'#64748b',
};
const METHOD = { phone:'📞 phone', email:'✉️ email', in_person:'🤝 in person', other:'other' };

const stageBadge = s => `<span class="badge badge-stage" style="color:${STAGE_COLOR[s]};font-weight:700">${STAGE[s] || s}</span>`;
const ini = m => m ? `<span class="initials-pill${m.role === 'sales' ? ' initials-pill-sales' : ''}" style="transform:scale(.85);transform-origin:center" title="${esc(m.name || '')}${m.role ? ' — ' + esc(m.role) : ''}">${esc(m.initials)}</span>` : '';

let META = { companies: [], team: [] };
let CURRENT_USER = null;          // { id, name, is_admin } — gates admin-only actions
let ALL_PROJECTS = [];            // [{id, name}] for the "existing project" picker
let OPEN_PROJECT = null;          // project id whose hierarchy is expanded
let DETAIL_CACHE = {};            // project id → detail payload (for award winner picker)

// Quietly retries once on a network failure or 502/503/504 — the few
// seconds a deploy takes to restart the server can otherwise turn an
// innocent click into a scary error message. Real validation errors (400s
// with a normal JSON body) are never retried, just surfaced as-is.
async function api(method, url, body, _isRetry) {
  let r;
  try {
    r = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (networkErr) {
    if (!_isRetry) { await new Promise(res => setTimeout(res, 1200)); return api(method, url, body, true); }
    throw new Error('Could not reach the server — check your connection and try again.');
  }
  if (!_isRetry && [502, 503, 504].includes(r.status)) {
    await new Promise(res => setTimeout(res, 1200));
    return api(method, url, body, true);
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

function setActiveNav(page) {
  document.querySelectorAll('#sidebar .nav-item[data-page]').forEach(a => a.classList.toggle('active', a.dataset.page === page));
}

async function ensureMeta() {
  if (META.companies.length) return;
  const r = await fetch('/api/v2/meta');
  if (r.status === 401) {
    // Login itself still lives on the old page (/legacy) — send the user
    // there and bring them right back here once they're signed in.
    window.location.href = '/legacy?returnTo=' + encodeURIComponent(location.pathname + location.hash);
    return new Promise(() => {}); // navigating away — never resolve, don't render a flash of "error"
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  META = data; CURRENT_USER = META.current_user;
  renderAppSwitcher();
}

// Tracks the current page so post-action refresh() re-renders the right view
let VIEW = { name: 'dashboard', arg: null };

// Keeps the URL bar in sync with the current view — bookmarkable, and lets a
// page refresh land back where you were (see routeFromHash/bootstrap below).
// pushState (not location.hash=) so it never fires a 'hashchange' event —
// only real back/forward navigation (popstate) triggers re-routing.
function setHash(h) {
  const newHash = '#' + h;
  if (location.hash !== newHash) history.pushState(null, '', newHash);
}
// Parses the current URL hash and renders whatever it points to — used on
// initial load (bootstrap) and on browser back/forward (popstate), so both
// a refresh and the back button land on the actual page shown, not always
// the dashboard.
function routeFromHash() {
  const raw = (location.hash || '#dashboard').replace(/^#/, '');
  const [seg, arg, sub, subArg] = raw.split('/');
  if (seg === 'project' && arg) {
    renderProjectPage(Number(arg)).then(() => {
      // A deep link into a specific bid/CO (e.g. from an assignment email) —
      // open its flyout once the project page underneath has loaded.
      if (sub === 'bid' && subArg) openBidFlyout(Number(arg), Number(subArg));
      else if (sub === 'co' && subArg) openCoFlyout(Number(arg), Number(subArg));
    });
    return;
  }
  navigate(seg || 'dashboard');
}
window.addEventListener('popstate', routeFromHash);

function navigate(page) {
  setHash(page);
  closeFlyout();
  if (page !== 'projects') OPEN_PROJECT = null;
  if (page === 'dashboard') { VIEW = { name: 'dashboard' }; return renderDashboard(); }
  if (page === 'health') { VIEW = { name: 'health' }; return showHealth(); }
  if (page === 'history') { VIEW = { name: 'history' }; return renderHistory(); }
  if (page === 'opportunities') { VIEW = { name: 'bidlist', arg: 'opportunity' }; return renderBidList('opportunity'); }
  if (page === 'active-bids') { VIEW = { name: 'bidlist', arg: 'active_bid' }; return renderBidList('active_bid'); }
  if (page === 'submitted-bids') { VIEW = { name: 'bidlist', arg: 'submitted' }; return renderBidList('submitted'); }
  if (page === 'awarded-bids') { VIEW = { name: 'bidlist', arg: 'awarded' }; return renderBidList('awarded'); }
  if (page === 'active-cos') { VIEW = { name: 'colist', arg: 'active_co' }; return renderCoList('active_co'); }
  if (page === 'submitted-cos') { VIEW = { name: 'colist', arg: 'submitted_co' }; return renderCoList('submitted_co'); }
  if (page === 'search') { VIEW = { name: 'search' }; return renderSearchResults(); }
  if (page === 'contacts') { VIEW = { name: 'contacts' }; return renderContacts(); }
  if (page === 'vendors') { VIEW = { name: 'vendors' }; return renderVendors(); }
  if (page === 'reports') { VIEW = { name: 'reports' }; return renderReports(); }
  if (page === 'digest') { VIEW = { name: 'digest' }; return renderDigest(); }
  if (page === 'calendar') { VIEW = { name: 'calendar' }; return renderCalendar(); }
  if (page === 'settings') { VIEW = { name: 'settings' }; return renderSettings(); }
  VIEW = { name: 'projects' }; return load();
}

async function rerenderView() {
  switch (VIEW.name) {
    case 'search':    return renderSearchResults();
    case 'contacts':  return renderContacts();
    case 'vendors':   return renderVendors();
    case 'reports':   return renderReports();
    case 'digest':    return renderDigest();
    case 'calendar':  return renderCalendar();
    case 'settings':  return renderSettings();
    case 'projects':  return load();
    case 'project':   return renderProjectPage(VIEW.arg);
    case 'bidlist':   return renderBidList(VIEW.arg);
    case 'colist':    return renderCoList(VIEW.arg);
    case 'dashboard': return renderDashboard();
    case 'health':    return showHealth();
    case 'history':   return renderHistory();
  }
}

// ── Global search (sidebar box, Ctrl/Cmd+K) ───────────────────────────────────
let GLOBAL_SEARCH = '';
let globalSearchTimer;
function debounceGlobalSearch() {
  clearTimeout(globalSearchTimer);
  const q = (document.getElementById('global-search-input')?.value || '').trim();
  GLOBAL_SEARCH = q;
  const clearBtn = document.getElementById('sidebar-search-clear');
  if (clearBtn) clearBtn.style.display = q ? 'block' : 'none';
  if (q.length < 2) { if (VIEW.name === 'search') renderSearchResults(); return; }
  globalSearchTimer = setTimeout(() => { if (VIEW.name !== 'search') navigate('search'); else renderSearchResults(); }, 280);
}
function clearGlobalSearch() {
  GLOBAL_SEARCH = '';
  const inp = document.getElementById('global-search-input');
  if (inp) { inp.value = ''; inp.blur(); }
  const clearBtn = document.getElementById('sidebar-search-clear');
  if (clearBtn) clearBtn.style.display = 'none';
  if (VIEW.name === 'search') navigate('dashboard');
}
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('global-search-input')?.focus(); }
});

const BID_STAGE_ORDER = ['active_bid', 'submitted', 'opportunity', 'awarded', 'not_awarded', 'closed'];
const CO_STAGE_ORDER = ['active_co', 'submitted_co', 'approved', 'not_approved', 'voided'];

async function renderSearchResults() {
  setActiveNav(null);
  const main = document.getElementById('main');
  const inp = document.getElementById('global-search-input');
  const q = (inp?.value || GLOBAL_SEARCH || '').trim();
  GLOBAL_SEARCH = q;
  const clearBtn = document.getElementById('sidebar-search-clear');
  if (clearBtn) clearBtn.style.display = q ? 'block' : 'none';

  if (q.length < 2) {
    main.innerHTML = `
      <div class="page-header"><div><div class="page-title">🔍 Search</div></div></div>
      <div style="padding:40px 20px;text-align:center;color:var(--text-muted)">
        <div style="font-size:32px;margin-bottom:10px">🔍</div>
        <div style="font-weight:700;color:var(--text);margin-bottom:6px">Search everything</div>
        <div>Type in the search bar on the left to find any bid or change order across <strong>all stages</strong> —<br>by project name, bid #, CO #, job #, or company.</div>
        <div style="font-size:12px;margin-top:10px">Tip: press <kbd style="background:#e2e8f0;padding:1px 5px;border-radius:3px;font-size:11px">Ctrl K</kbd> to focus the search bar from anywhere.</div>
      </div>`;
    if (inp) setTimeout(() => inp.focus(), 50);
    return;
  }

  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Searching…</div>';
  let results;
  try { results = await api('GET', '/api/v2/search?q=' + encodeURIComponent(q)); }
  catch (e) { main.innerHTML = `<div class="err-card" style="margin:20px">${esc(e.message)}</div>`; return; }

  const total = results.bids.length + results.change_orders.length;
  if (!total) {
    main.innerHTML = `
      <div class="page-header"><div><div class="page-title">🔍 Search Results</div><div class="page-subtitle">No results for "<strong>${esc(q)}</strong>"</div></div></div>
      <div style="padding:40px 20px;text-align:center;color:var(--text-muted)">
        <div style="font-size:32px;margin-bottom:10px">😶</div>
        <div>No bids or change orders matched "<strong>${esc(q)}</strong>".<br>Try a project name, bid #, CO #, job #, or company name.</div>
      </div>`;
    return;
  }

  const bidGroups = {}; results.bids.forEach(b => (bidGroups[b.stage] = bidGroups[b.stage] || []).push(b));
  const coGroups = {}; results.change_orders.forEach(c => (coGroups[c.stage] = coGroups[c.stage] || []).push(c));

  const bidSection = (stage) => {
    const items = bidGroups[stage]; if (!items?.length) return '';
    return `<div style="margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div style="font-weight:700;font-size:13px;color:${STAGE_COLOR[stage]}">${STAGE[stage]}</div>
        <span class="badge" style="background:${STAGE_COLOR[stage]};color:#fff">${items.length}</span>
      </div>
      <div class="card" style="padding:0">${items.map(b => `
        <div class="proj-row" onclick="openBidFlyout(${b.project_id},${b.id})">
          <div style="flex:1;min-width:0">
            <div class="proj-name">${esc(b.project)}${b.bid_number ? ` <span style="color:var(--text-muted);font-weight:400;font-size:12px">#${esc(b.bid_number)}</span>` : ''}</div>
            <div class="proj-meta">
              ${b.customers.length ? esc(b.customers.join(', ')) : '<span style="color:#dc2626">no customer</span>'}
              ${b.salesperson ? `<span class="proj-meta-sep">·</span> Sales ${ini(b.salesperson)}` : ''}
              ${b.estimator ? ` Est ${ini(b.estimator)}` : ''}
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">${b.estimate_amount ? `<span class="amount" style="font-size:13px">${fmt$(b.estimate_amount)}</span>` : ''}</div>
        </div>`).join('')}</div>
    </div>`;
  };
  const coSection = (stage) => {
    const items = coGroups[stage]; if (!items?.length) return '';
    return `<div style="margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div style="font-weight:700;font-size:13px;color:${STAGE_COLOR[stage]}">CO — ${STAGE[stage]}</div>
        <span class="badge" style="background:${STAGE_COLOR[stage]};color:#fff">${items.length}</span>
      </div>
      <div class="card" style="padding:0">${items.map(c => `
        <div class="proj-row" onclick="openCoFlyout(${c.project_id},${c.id})">
          <div style="flex:1;min-width:0">
            <div class="proj-name"><span style="color:#d97706">${esc(c.co_number)}</span> ${esc(c.name)}</div>
            <div class="proj-meta">
              ${esc(c.project)}${c.job_number ? ` <span class="proj-meta-sep">·</span> Job ${esc(c.job_number)}` : ''}
              ${c.salesperson ? `<span class="proj-meta-sep">·</span> PM ${ini(c.salesperson)}` : ''}
              ${c.estimator ? ` Est ${ini(c.estimator)}` : ''}
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">${c.estimate_amount ? `<span class="amount" style="font-size:13px">${fmt$(c.estimate_amount)}</span>` : ''}</div>
        </div>`).join('')}</div>
    </div>`;
  };

  main.innerHTML = `
    <div class="page-header"><div><div class="page-title">🔍 Search Results</div><div class="page-subtitle">${total} result${total !== 1 ? 's' : ''} for "<strong>${esc(q)}</strong>"</div></div></div>
    ${BID_STAGE_ORDER.map(bidSection).join('')}
    ${CO_STAGE_ORDER.map(coSection).join('')}`;
}

// ═══════════════════════════════════════════════════════════════════════════
// SETTINGS — Team management + follow-up timer + admin tools. TeamMember is
// one shared collection as of the July 2026 id merge (v2/merge-team-ids.js —
// v1 and v2 used to have independently-assigned ids for the same people,
// which silently broke "mine only" filtering and reminder recipients). A
// team member added here (with a temp password) can log in AND be assigned
// to bids immediately — same roster either way.
// ═══════════════════════════════════════════════════════════════════════════
let TEAM_CACHE = [];

// Keep this list in sync with mailer.js's NOTIFICATION_CATEGORIES — that's
// the server-side source of truth for which category name gates which
// email; this is just the client-side copy of the same labels. Idea/issue
// *submission* (to the admin inbox) is deliberately not here, same reason
// as server-side: it's not sent to a roster of people who'd need a toggle.
const NOTIFICATION_CATEGORIES = {
  assigned: 'Bid/CO assignment',
  followup: 'Follow-up logged',
  awarded: 'Bid awarded (team-wide)',
  reminder: 'Reminders due',
  walkthrough: 'Jobsite walk-throughs',
  digest: 'Weekly digest',
  ideas: 'Idea/issue status updates',
};
function notificationPrefRows() {
  const prefs = CURRENT_USER?.notification_prefs || {};
  return Object.entries(NOTIFICATION_CATEGORIES).map(([key, label]) => `
    <label class="v2-check" style="display:flex;align-items:center;gap:8px;padding:4px 0">
      <input type="checkbox" id="notif-pref-${key}" ${prefs[key] === false ? '' : 'checked'}> ${esc(label)}
    </label>`).join('');
}
async function actSaveNotificationPrefs() {
  const prefs = {};
  for (const key of Object.keys(NOTIFICATION_CATEGORIES)) {
    prefs[key] = document.getElementById(`notif-pref-${key}`)?.checked ?? true;
  }
  try {
    await api('PATCH', '/api/v2/me/notification-prefs', prefs);
    if (CURRENT_USER) CURRENT_USER.notification_prefs = prefs;
    alert('Saved.');
  } catch (e) { alert('Failed: ' + e.message); }
}

async function renderSettings() {
  setActiveNav('settings');
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Loading…</div>';
  let team, settings;
  try {
    await ensureMeta();
    [team, settings] = await Promise.all([api('GET', '/api/v2/team'), api('GET', '/api/v2/settings')]);
    TEAM_CACHE = team;
  } catch (e) { main.innerHTML = `<div class="err-card" style="margin:20px">${esc(e.message)}</div>`; return; }

  const isAdmin = !!CURRENT_USER?.is_admin;
  const roleLabel = { estimator: 'Estimator', sales: 'Salesperson', oversight: 'Admin / Oversight' };

  const teamRows = team.map(m => `
    <div class="proj-row" style="${m.active ? '' : 'opacity:.5'}">
      <div style="flex:1;min-width:0">
        <div class="proj-name">${esc(m.name)} <span class="initials-pill${m.role === 'sales' ? ' initials-pill-sales' : ''}">${esc(m.initials)}</span>
          ${m.is_admin ? '<span class="badge" style="background:#ede9fe;color:#5b21b6">ADMIN</span>' : ''}
          ${!m.active ? '<span class="badge" style="background:#e2e8f0;color:#64748b">INACTIVE</span>' : ''}
          ${m.has_password === false ? '<span class="badge" style="background:#fef3c7;color:#b45309">NO PASSWORD SET</span>' : ''}</div>
        <div class="proj-meta">${roleLabel[m.role] || esc(m.role)}${m.email ? ` · ${esc(m.email)}` : ''}</div>
      </div>
      ${isAdmin ? `<div class="v2-actions" style="margin:0">
        <button class="v2-btn outline" style="padding:5px 10px;font-size:11px" onclick="actEditTeamMember(${m.id})">✏️ Edit</button>
        <button class="v2-btn outline" style="padding:5px 10px;font-size:11px" onclick="actResetTeamPassword(${m.id},'${escJs(m.name)}')">🔑 Set Password</button>
      </div>` : ''}
    </div>`).join('');

  main.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">⚙️ Settings</div><div class="page-subtitle">${team.length} team members</div></div>
      ${isAdmin ? `<button class="v2-btn green" onclick="actNewTeamMember()">+ Add Team Member</button>` : ''}
    </div>

    ${CURRENT_USER ? `

// ═══════════════════════════════════════════════════════════════════════════
// CALENDAR — month grid of due dates + follow-ups, across bids AND change
// orders (v1 only had bids since COs were folded into the same collection).
// ═══════════════════════════════════════════════════════════════════════════
const ESTIMATOR_PALETTE = ['#2563eb', '#16a34a', '#dc2626', '#d97706', '#7c3aed', '#0891b2', '#be185d', '#ea580c'];
const estimatorColor = (id) => id ? ESTIMATOR_PALETTE[Number(id) % ESTIMATOR_PALETTE.length] : '#64748b';
let CAL_STATE = { year: new Date().getFullYear(), month: new Date().getMonth(), filter: 'all' };
let CAL_DAY_MAP = {};

// mineOnly mirrors the rest of the Dashboard's "My View" toggle — filters to
// bids/COs where the current user is estimator, salesperson, or a
// sub-estimator, same rule used everywhere else "mine" is computed. The
// standalone Calendar page calls this with no argument (always shows all).
async function fetchCalendarItems(mineOnly) {
  const [opp, active, sub, activeCo, subCo] = await Promise.all([
    api('GET', '/api/v2/bid-list?stage=opportunity'), api('GET', '/api/v2/bid-list?stage=active_bid'), api('GET', '/api/v2/bid-list?stage=submitted'),
    api('GET', '/api/v2/co-list?stage=active_co'), api('GET', '/api/v2/co-list?stage=submitted_co'),
  ]);
  let items = [
    ...[...opp, ...active, ...sub].map(b => ({ kind: 'bid', id: b.id, project_id: b.project_id, title: b.project, label: b.bid_number, due_date: b.due_date, next_followup_date: b.next_followup_date, walkthrough_date: b.walkthrough_date, walkthrough_time: b.walkthrough_time, estimator: b.estimator, salesperson: b.salesperson, sub_estimators: b.sub_estimators || [], customer: (b.customers || []).join(', '), stage: b.stage })),
    ...[...activeCo, ...subCo].map(c => ({ kind: 'co', id: c.id, project_id: c.project_id, title: `${c.co_number} — ${c.name}`, label: c.project, due_date: c.due_date, next_followup_date: c.next_followup_date, estimator: c.estimator, salesperson: c.salesperson, customer: null, stage: c.stage })),
  ];
  if (mineOnly && CURRENT_USER) {
    items = items.filter(it => it.estimator?.id === CURRENT_USER.id || it.salesperson?.id === CURRENT_USER.id || (it.sub_estimators || []).some(se => se.id === CURRENT_USER.id));
  }
  return items;
}
function fmtTimeShort(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const period = h >= 12 ? 'p' : 'a';
  const h12 = h % 12 || 12;
  return m ? `${h12}:${String(m).padStart(2, '0')}${period}` : `${h12}${period}`;
}
function calendarLegendHtml() {
  const estimators = (META.team || []).filter(m => m.role === 'estimator');
  return [
    ...estimators.map(m => `<span class="cal-legend-item"><span class="cal-legend-dot" style="background:${estimatorColor(m.id)}"></span>${esc(m.initials)}</span>`),
    `<span class="cal-legend-item"><span class="cal-legend-dot" style="background:#1e293b;border:1px dashed #94a3b8"></span>Follow-up</span>`,
    `<span class="cal-legend-item"><span class="cal-legend-dot" style="background:#0891b2"></span>🚶 Walk-through</span>`,
  ].join('');
}
function calendarControlsHtml(reRenderFn) {
  const { year, month, filter } = CAL_STATE;
  const monthName = new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  return `<div class="cal-controls">
      <button class="v2-btn outline" style="padding:6px 12px;font-size:12px" onclick="navCalendar(-1)">‹ Prev</button>
      <span class="cal-month-label">${esc(monthName)}</span>
      <button class="v2-btn outline" style="padding:6px 12px;font-size:12px" onclick="navCalendar(1)">Next ›</button>
      <button class="v2-btn outline" style="padding:6px 12px;font-size:12px" onclick="CAL_STATE.year=new Date().getFullYear();CAL_STATE.month=new Date().getMonth();${reRenderFn}()">Today</button>
      <select class="cal-filter-select" onchange="CAL_STATE.filter=this.value;${reRenderFn}()">
        <option value="all" ${filter === 'all' ? 'selected' : ''}>Due Dates + Follow-ups</option>
        <option value="due_only" ${filter === 'due_only' ? 'selected' : ''}>Due Dates Only</option>
        <option value="followups_only" ${filter === 'followups_only' ? 'selected' : ''}>Follow-ups Only</option>
      </select>
    </div>`;
}

async function renderCalendar() {
  setActiveNav('calendar');
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Loading…</div>';
  let items;
  try { await ensureMeta(); items = await fetchCalendarItems(); }
  catch (e) { main.innerHTML = `<div class="err-card" style="margin:20px">${esc(e.message)}</div>`; return; }

  const { year, month, filter } = CAL_STATE;
  main.innerHTML = `
    <div class="page-header"><div><div class="page-title">🗓️ Calendar</div></div></div>
    ${calendarControlsHtml('renderCalendar')}
    ${buildCalendarGrid(year, month, items, filter)}
    <div class="cal-legend">${calendarLegendHtml()}</div>`;
}

function navCalendar(dir) {
  let m = CAL_STATE.month + dir, y = CAL_STATE.year;
  if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
  CAL_STATE.month = m; CAL_STATE.year = y;
  // The calendar shows up both as its own page and embedded on the
  // dashboard — re-render whichever one is actually on screen.
  (VIEW.name === 'calendar' ? renderCalendar : renderDashboard)();
}

function buildCalendarGrid(year, month, items, filter) {
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startDOW = firstDay.getDay();
  const pad = n => String(n).padStart(2, '0');

  CAL_DAY_MAP = {};
  const add = (dateStr, item, type) => {
    if (!dateStr) return;
    const d = dateStr.substring(0, 10);
    if (parseInt(d.substring(5, 7)) - 1 !== month || parseInt(d.substring(0, 4)) !== year) return;
    (CAL_DAY_MAP[d] = CAL_DAY_MAP[d] || []).push({ item, type });
  };
  items.forEach(it => {
    if (filter !== 'followups_only') add(it.due_date, it, 'due');
    if (filter !== 'due_only') add(it.next_followup_date, it, 'fu');
    if (filter !== 'followups_only') add(it.walkthrough_date, it, 'walkthrough');
  });

  const headers = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="cal-hdr-cell">${d}</div>`).join('');
  let cells = '';
  for (let i = 0; i < startDOW; i++) cells += '<div class="cal-day-empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${year}-${pad(month + 1)}-${pad(d)}`;
    const isToday = ds === today;
    const dayItems = CAL_DAY_MAP[ds] || [];
    const holidayName = (META.holidays || {})[ds];

    // Show every item, not just the first few — the row grows to fit
    // whichever day that week is busiest (CSS grid rows auto-size to their
    // tallest cell), so nothing gets stuck behind a "+N more" button where
    // it can't be dragged.
    const chips = dayItems.map(({ item, type }) => {
      if (type === 'due') {
        const c = estimatorColor(item.estimator?.id);
        // Only due-date chips are draggable — a due date is what dropping on
        // another day changes; follow-up dates aren't touched by this.
        return `<div class="cal-chip" draggable="true"
            ondragstart="calDragStart(event,'${item.kind}',${item.id},'${escJs(item.title)}')"
            style="background:${c}a6;border-left-color:${c};cursor:grab">
          <span class="cal-chip-txt">${esc(item.title)}</span>
          ${item.estimator ? `<span class="cal-chip-ini" style="color:#fff">${esc(item.estimator.initials)}</span>` : ''}
        </div>`;
      }
      if (type === 'walkthrough') {
        return `<div class="cal-chip" style="background:#0891b2a6;border-left-color:#0891b2">
          <span class="cal-chip-txt">🚶 ${esc(item.title)}${item.walkthrough_time ? ' · ' + fmtTimeShort(item.walkthrough_time) : ''}</span>
        </div>`;
      }
      return `<div class="cal-chip cal-chip-fu"><span class="cal-chip-txt">📞 ${esc(item.title)}</span></div>`;
    }).join('');

    cells += `<div class="cal-day${isToday ? ' cal-day-today' : ''}${holidayName ? ' cal-day-holiday' : ''}${dayItems.length ? ' cal-day-clickable' : ''}"
      ${holidayName ? `title="${esc(holidayName)}"` : ''}
      ${dayItems.length ? `onclick="openCalDayModal('${ds}')"` : ''}
      ondragover="event.preventDefault()" ondrop="calDrop(event,'${ds}')">
      <div class="cal-day-num${isToday ? ' cal-day-num-today' : ''}">${d}</div>
      ${holidayName ? `<div class="cal-day-holiday-label">${esc(holidayName)}</div>` : ''}
      <div class="cal-day-chips">${chips}</div>
    </div>`;
  }
  const rem = (startDOW + daysInMonth) % 7;
  if (rem) for (let i = rem; i < 7; i++) cells += '<div class="cal-day-empty"></div>';
  return `<div class="cal-hdr">${headers}</div><div class="cal-grid">${cells}</div>`;
}

// Drag a due-date chip to a different day to change its due date. Always
// confirms before committing since it's easy to miss the day you actually
// dropped on.
let CAL_DRAG = null;
function calDragStart(ev, kind, id, title) {
  CAL_DRAG = { kind, id, title };
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', ''); // Firefox requires data to be set for drag to start
}
async function calDrop(ev, dateStr) {
  ev.preventDefault();
  const drag = CAL_DRAG;
  CAL_DRAG = null;
  if (!drag) return;
  const label = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  if (!confirm(`Change the due date for "${drag.title}" to ${label}?`)) return;
  try {
    const url = drag.kind === 'bid' ? `/api/v2/bids/${drag.id}/due-date` : `/api/v2/change-orders/${drag.id}/due-date`;
    await api('PATCH', url, { due_date: dateStr });
    if (VIEW.name === 'calendar') await renderCalendar(); else if (VIEW.name === 'dashboard') await renderDashboard();
  } catch (e) { alert('Failed to change due date: ' + e.message); }
}

function openCalDayModal(dateStr) {
  const items = CAL_DAY_MAP[dateStr] || [];
  if (!items.length) return;
  const label = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const rows = items.map(({ item, type }) => {
    const color = type === 'due' ? estimatorColor(item.estimator?.id) : type === 'walkthrough' ? '#0891b2' : '#64748b';
    const typeLabel = type === 'due' ? '📐 Due date' : type === 'walkthrough' ? `🚶 Walk-through${item.walkthrough_time ? ' · ' + fmtTimeShort(item.walkthrough_time) : ''}` : '📞 Follow-up';
    return `<div class="proj-row" onclick="closeProfileModal();${item.kind === 'bid' ? `openBidFlyout(${item.project_id},${item.id})` : `openCoFlyout(${item.project_id},${item.id})`}">
      <div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;margin-top:5px"></div>
      <div style="flex:1;min-width:0">
        <div class="proj-name">${esc(item.title)}</div>
        <div class="proj-meta">${typeLabel}
          ${item.estimator ? ` · Est ${esc(item.estimator.initials)}` : ''}
          ${item.salesperson ? ` Sales ${esc(item.salesperson.initials)}` : ''}
          ${item.customer ? ` · ${esc(item.customer)}` : ''}
        </div>
      </div>
      ${stageBadge(item.stage)}
    </div>`;
  }).join('');
  openProfileModal(label, `<div class="card" style="padding:0">${rows}</div>`);
}

// ═══════════════════════════════════════════════════════════════════════════
// WEEKLY DIGEST — replaces the Monday status meeting. Overdue follow-ups
// (bids AND change orders) intentionally render LAST, per an explicit past
// ask: don't bury the good news under the bad news at the top.
// ═══════════════════════════════════════════════════════════════════════════
async function renderDigest() {
  setActiveNav('digest');
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Generating digest…</div>';
  let d;
  try { await ensureMeta(); d = await api('GET', '/api/v2/digest'); }
  catch (e) { main.innerHTML = `<div class="err-card" style="margin:20px">${esc(e.message)}</div>`; return; }

  const section = (icon, title, count, bodyHtml, color) => `
    <div class="card" style="margin-bottom:14px">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
        <div style="font-weight:700;font-size:14px">${icon} ${title}</div>
        ${count != null ? `<span class="badge" style="background:${color || '#e2e8f0'};color:#fff">${count}</span>` : ''}
      </div>
      <div style="padding:${bodyHtml ? '0' : '16px'}">${bodyHtml || '<div style="padding:16px;color:var(--text-muted);font-size:13px">None</div>'}</div>
    </div>`;

  // Bids/COs both have {id, project_id}; a CO's id is only unambiguous
  // combined with its kind, so pass which flyout opener to use.
  const openFor = (b) => b.stage !== undefined ? `openBidFlyout(${b.project_id},${b.id})` : `openCoFlyout(${b.project_id},${b.id})`;
  const bidRow = (b, showFU) => `
    <div class="proj-row" onclick="${openFor(b)}">
      <div style="flex:1;min-width:0">
        <div class="proj-name">${esc(b.project_name)}${b.bid_number ? ` <span style="color:var(--text-muted);font-weight:400;font-size:12px">#${esc(b.bid_number)}</span>` : ''}</div>
        <div class="proj-meta">
          ${b.customer ? esc(b.customer) : ''}
          ${b.salesperson_initials ? `<span class="proj-meta-sep">·</span> ${b.stage === undefined ? 'PM' : 'Sales'} ${esc(b.salesperson_initials)}` : ''}
          ${b.estimator_initials ? ` Est ${esc(b.estimator_initials)}` : ''}
          ${showFU && b.next_followup_date ? `<span class="proj-meta-sep">·</span> <span class="${b.next_followup_date < today ? 'overdue-txt' : ''}">F/U ${fmtD(b.next_followup_date)}</span>` : ''}
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        ${b.estimate_amount ? `<span class="amount" style="font-size:13px">${fmt$(b.estimate_amount)}</span>` : ''}
        ${!showFU && b.estimate_due_date ? `<div style="font-size:12px;font-weight:700;color:${b.estimate_due_date < today ? '#dc2626' : 'var(--text-muted)'}">Due ${fmtD(b.estimate_due_date)}</div>` : ''}
      </div>
    </div>`;
  const rows = (list, showFU) => list.length ? list.map(b => bidRow(b, showFU)).join('') : null;

  const peopleTable = (rows, cols) => rows.length ? `<table style="width:100%;font-size:13px">
    <thead><tr>${cols.map(c => `<th style="text-align:${c.right ? 'right' : 'left'};padding:6px 12px;color:var(--text-muted);font-weight:600;font-size:11px">${c.label}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr style="border-top:1px solid var(--border)">${cols.map(c => `<td style="padding:6px 12px;text-align:${c.right ? 'right' : 'left'}${c.overdue && r[c.key] > 0 ? ';color:#dc2626;font-weight:700' : ''}">${c.fmt ? c.fmt(r[c.key]) : esc(String(r[c.key]))}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>` : null;

  const ps = d.pipelineSnapshot;
  const pStat = (label, value, sub, color, onclick) => `
    <div class="stat-card" style="border-top:3px solid ${color};${onclick ? 'cursor:pointer' : ''}"${onclick ? ` onclick="${onclick}"` : ''}>
      <div class="stat-label">${label}</div>
      <div class="stat-value" style="color:${color}">${value}</div>
      <div class="stat-sub">${sub || ''}</div>
    </div>`;
  const pipelineBubbles = `
    <div class="stat-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:14px 16px">
      ${pStat('Opportunities', ps.opportunities, '', '#3b82f6', "renderBidList('opportunity')")}
      ${pStat('Active Bids', ps.activeBids, '', '#f59e0b', "renderBidList('active_bid')")}
      ${pStat('Active Change Orders', ps.activeCos, '', '#f97316', "renderCoList('active_co')")}
      ${pStat('Submitted Bids — 30d', ps.submittedBids.last30.count, fmt$(ps.submittedBids.last30.value), '#2563eb', "renderBidList('submitted')")}
      ${pStat('Submitted Bids — YTD', ps.submittedBids.ytd.count, fmt$(ps.submittedBids.ytd.value), '#2563eb', "renderBidList('submitted')")}
      ${pStat('Submitted COs — 30d', ps.submittedCos.last30.count, fmt$(ps.submittedCos.last30.value), '#d97706', "renderCoList('submitted_co')")}
      ${pStat('Submitted COs — YTD', ps.submittedCos.ytd.count, fmt$(ps.submittedCos.ytd.value), '#d97706', "renderCoList('submitted_co')")}
    </div>`;

  const submittedGroupsHtml = d.submittedByEstimator.map(g => `

// ── List filter/sort toolbar (bid lists + CO lists) ──────────────────────────
// Rows are fetched once per page load and filtered/sorted entirely client-side
// (dataset is small); LIST_STATE holds the raw fetch, FILTER_STATE holds the
// toolbar values per stage-key so they survive navigating away and back.
let LIST_STATE = {};    // stageKey -> raw rows from the API
let FILTER_STATE = {};  // stageKey -> { q, person, mine, sort }

// Admin/Oversight users have no bids of their own — "mine only" would just
// show them nothing, so they default to the global view like everyone else
// would if they weren't logged in, while estimators/salespeople still get
// "mine" as the default.
function defaultMine() { return !!CURRENT_USER && CURRENT_USER.role !== 'oversight'; }
function filterState(key) { return (FILTER_STATE[key] = FILTER_STATE[key] || { q: '', person: '', mine: defaultMine(), sort: 'due' }); }

function personOpts() {
  return META.team.map(t => [`${t.role === 'sales' ? 'sal' : 'est'}:${t.id}`, `${t.name} (${t.initials})`]);
}

function filterBarHtml(key, sortOpts) {
  const s = filterState(key);
  const opts = personOpts();
  return `<div class="v2-filterbar">
    <input type="text" id="flt-q-${key}" placeholder="Search project, bid #, customer, job #…" value="${esc(s.q)}" oninput="onListFilterChange('${key}')">
    <select id="flt-person-${key}" onchange="onListFilterChange('${key}')">
      <option value="">Anyone</option>
      ${opts.map(([v, l]) => `<option value="${v}" ${v === s.person ? 'selected' : ''}>${esc(l)}</option>`).join('')}
    </select>
    <select id="flt-sort-${key}" onchange="onListFilterChange('${key}')">
      ${sortOpts.map(([v, l]) => `<option value="${v}" ${v === s.sort ? 'selected' : ''}>Sort: ${esc(l)}</option>`).join('')}
    </select>
    ${CURRENT_USER ? `<label class="mine"><input type="checkbox" id="flt-mine-${key}" ${s.mine ? 'checked' : ''} onchange="onListFilterChange('${key}')"> Mine only</label>` : ''}
    <span class="clear-link" onclick="clearListFilters('${key}')">Clear</span>
  </div>`;
}

function clearListFilters(key) {
  // Reset to the generic 'due' default — renderBidList/renderCoList already
  // upgrade that to the stage-appropriate default (recently submitted /
  // recently awarded) the moment they render, so this doesn't need to know
  // which stage-specific sort was in effect before clearing.
  FILTER_STATE[key] = { q: '', person: '', mine: defaultMine(), sort: 'due' };
  if (VIEW.name === 'bidlist') renderBidList(VIEW.arg); else renderCoList(VIEW.arg);
}

function onListFilterChange(key) {
  const s = filterState(key);
  s.q = document.getElementById('flt-q-' + key)?.value || '';
  s.person = document.getElementById('flt-person-' + key)?.value || '';
  s.sort = document.getElementById('flt-sort-' + key)?.value || s.sort;
  s.mine = !!document.getElementById('flt-mine-' + key)?.checked;
  if (VIEW.name === 'bidlist') renderBidListBody(key); else renderCoListBody(key);
}

function applyPersonMine(rows, s) {
  let out = rows;
  if (s.person) {
    const [kind, id] = s.person.split(':'); const nid = Number(id);
    out = out.filter(r => kind === 'sal' ? r.salesperson?.id === nid : (r.estimator?.id === nid || (r.sub_estimators || []).some(se => se.id === nid)));
  }
  if (s.mine && CURRENT_USER) out = out.filter(r => r.estimator?.id === CURRENT_USER.id || r.salesperson?.id === CURRENT_USER.id || (r.sub_estimators || []).some(se => se.id === CURRENT_USER.id));
  return out;
}
function applyTextSearch(rows, q, getFields) {
  if (!q.trim()) return rows;
  const needle = q.trim().toLowerCase();
  return rows.filter(r => getFields(r).some(f => f && String(f).toLowerCase().includes(needle)));
}

async function renderBidList(stage) {
  const meta = BID_LIST_META[stage];
  setActiveNav(meta.page);
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Loading…</div>';
  try { await ensureMeta(); LIST_STATE[stage] = await api('GET', '/api/v2/bid-list?stage=' + stage); }
  catch (e) { main.innerHTML = `<div class="err-card" style="margin:20px">${esc(e.message)}</div>`; return; }

  const sortOpts = stage === 'submitted'
    ? [['submitted', 'Recently submitted'], ['followup', 'Follow-up date'], ['due', 'Due date'], ['amount', 'Amount'], ['project', 'Project name']]
    : stage === 'awarded'
    ? [['award', 'Recently awarded'], ['amount', 'Amount'], ['project', 'Project name']]
    : [['due', 'Due date'], ['amount', 'Amount'], ['project', 'Project name']];
  // First time landing on a tab (still on the generic 'due' default), jump
  // to the sort that actually matches what the tab is for — most-recently-
  // submitted for Submitted, most-recently-awarded for Awarded — instead of
  // making people pick it every time.
  if (stage === 'submitted' && filterState(stage).sort === 'due') filterState(stage).sort = 'submitted';
  if (stage === 'awarded' && filterState(stage).sort === 'due') filterState(stage).sort = 'award';

  const headerActions = stage === 'active_bid' ? `
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="v2-btn green" style="padding:8px 14px;font-size:12px" onclick="actNewBid()">+ New Bid</button>
        <button class="v2-btn amber" style="padding:8px 14px;font-size:12px" onclick="actImportJIS()">📄 Import Bid (JIS)</button>
        <button class="v2-btn outline" style="padding:8px 14px;font-size:12px" onclick="actNewLegacyJob()">+ Legacy Job</button>
      </div>` : stage === 'opportunity' ? `
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="v2-btn blue" style="padding:8px 14px;font-size:12px" onclick="actNewOpportunity()">+ New Opportunity</button>
      </div>` : '';

  main.innerHTML = `
    <div class="page-header"><div><div class="page-title">${meta.title}</div><div class="page-subtitle" id="bl-count-${stage}">${LIST_STATE[stage].length} ${meta.sub}</div></div>${headerActions}</div>
    <div class="card" style="padding:0">${filterBarHtml(stage, sortOpts)}<div id="bl-body-${stage}"></div></div>`;
  renderBidListBody(stage);
}

function renderBidListBody(stage) {
  const meta = BID_LIST_META[stage];
  const s = filterState(stage);
  let rows = LIST_STATE[stage] || [];
  rows = applyTextSearch(rows, s.q, b => [b.project, b.bid_number, ...b.customers]);
  rows = applyPersonMine(rows, s);
  const sorters = {
    due: (a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999'),
    followup: (a, b) => (a.next_followup_date || '9999').localeCompare(b.next_followup_date || '9999'),
    submitted: (a, b) => (b.date_submitted || '').localeCompare(a.date_submitted || ''),
    award: (a, b) => (b.award_date || '').localeCompare(a.award_date || ''),
    amount: (a, b) => (b.estimate_amount || 0) - (a.estimate_amount || 0),
    project: (a, b) => (a.project || '').localeCompare(b.project || ''),
  };
  rows = [...rows].sort(sorters[s.sort] || sorters.due);

  const right = (b) => {
    if (stage === 'awarded') {
      return `${b.estimate_amount ? `<span class="amount" style="font-size:13px">${fmt$(b.estimate_amount)}</span>` : ''}
        ${b.award_date ? `<div style="font-size:11px;color:var(--text-muted)">Awarded ${fmtD(b.award_date)}</div>` : ''}`;
    }
    if (stage === 'submitted') {
      const overdue = b.next_followup_date && b.next_followup_date < today;
      return `${b.estimate_amount ? `<span class="amount" style="font-size:13px">${fmt$(b.estimate_amount)}</span>` : ''}
        ${b.date_submitted ? `<div style="font-size:11px;color:var(--text-muted)">Sent ${fmtD(b.date_submitted)}</div>` : ''}
        ${b.next_followup_date ? `<div style="font-size:11px;${overdue ? 'color:#dc2626;font-weight:700' : 'color:var(--text-muted)'}">F/U ${fmtD(b.next_followup_date)}${overdue ? ' • OVERDUE' : ''}</div>` : ''}`;
    }
    return b.due_date ? `<span style="font-size:12px;font-weight:700;color:${b.due_date < today ? '#dc2626' : 'var(--text-muted)'}">Due ${fmtD(b.due_date)}</span>` : '';
  };

  document.getElementById('bl-count-' + stage).textContent = `${rows.length} of ${LIST_STATE[stage].length} ${meta.sub}`;
  document.getElementById('bl-body-' + stage).innerHTML = rows.length ? rows.map(b => `
      <div class="proj-row" onclick="openBidFlyout(${b.project_id},${b.id})">
        <div style="flex:1;min-width:0">
          <div class="proj-name">${esc(b.project)}${b.bid_number ? ` <span style="color:var(--text-muted);font-weight:400;font-size:12px">#${esc(b.bid_number)}</span>` : ''}
            ${b.drawing_stage ? `<span class="badge" style="background:#ede9fe;color:#5b21b6;font-size:10px">${esc(b.drawing_stage)}</span>` : ''}</div>
          <div class="proj-meta">
            ${stage === 'awarded' ? esc(b.awarded_company || '—') : (b.customers.length ? esc(b.customers.join(', ')) : '<span style="color:#dc2626">no customer</span>')}
            ${stage === 'awarded' ? `<span class="proj-meta-sep">·</span> ${b.job_number ? `Job ${esc(b.job_number)}` : '<span style="color:#dc2626">no job #</span>'}
            <span class="proj-meta-sep">·</span> ${b.pm ? `PM ${ini(b.pm)}` : '<span style="color:#dc2626">no PM</span>'}` : ''}
            ${b.estimator ? `<span class="proj-meta-sep">·</span> Est ${ini(b.estimator)}` : ''}
            ${b.salesperson ? ` Sales ${ini(b.salesperson)}` : ''}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">${right(b)}</div>
      </div>`).join('') : '<div style="padding:24px;text-align:center;color:var(--text-muted)">No matches</div>';
}

function renderCoListBody(stage) {
  const meta = CO_LIST_META[stage];
  const s = filterState(stage);
  let rows = LIST_STATE[stage] || [];
  rows = applyTextSearch(rows, s.q, c => [c.project, c.co_number, c.name, c.job_number]);
  rows = applyPersonMine(rows, s);
  const sorters = {
    due: (a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999'),
    followup: (a, b) => (a.next_followup_date || '9999').localeCompare(b.next_followup_date || '9999'),
    submitted: (a, b) => (b.date_submitted || '').localeCompare(a.date_submitted || ''),
    amount: (a, b) => (b.estimate_amount || 0) - (a.estimate_amount || 0),
    project: (a, b) => (a.project || '').localeCompare(b.project || ''),
  };
  rows = [...rows].sort(sorters[s.sort] || sorters.due);

  // Right column matches the bid lists' convention exactly: due date badge
  // while active, $ + follow-up date once submitted — so due dates land in
  // the same visual spot (bold, right-aligned, red if overdue) everywhere
  // they're shown across the app instead of drifting into the left-side
  // meta text on some pages and the right column on others.
  const right = (c) => {
    if (stage === 'submitted_co') {
      const overdue = c.next_followup_date && c.next_followup_date < today;
      return `${c.estimate_amount ? `<span class="amount" style="font-size:13px">${fmt$(c.estimate_amount)}</span>` : ''}
        ${c.date_submitted ? `<div style="font-size:11px;color:var(--text-muted)">Sent ${fmtD(c.date_submitted)}</div>` : ''}
        ${c.next_followup_date ? `<div style="font-size:11px;${overdue ? 'color:#dc2626;font-weight:700' : 'color:var(--text-muted)'}">F/U ${fmtD(c.next_followup_date)}${overdue ? ' • OVERDUE' : ''}</div>` : ''}`;
    }
    return c.due_date ? `<span style="font-size:12px;font-weight:700;color:${c.due_date < today ? '#dc2626' : 'var(--text-muted)'}">Due ${fmtD(c.due_date)}</span>` : '';
  };

  document.getElementById('cl-count-' + stage).textContent = `${rows.length} of ${LIST_STATE[stage].length} ${meta.sub}`;
  document.getElementById('cl-body-' + stage).innerHTML = rows.length ? rows.map(c => {
      return `<div class="proj-row" onclick="openCoFlyout(${c.project_id},${c.id})">
        <div style="flex:1;min-width:0">
          <div class="proj-name"><span style="color:#d97706">${esc(c.co_number)}</span> ${esc(c.name)} ${stageBadge(c.stage)}</div>
          <div class="proj-meta">
            ${esc(c.project)}${c.job_number ? ` <span class="proj-meta-sep">·</span> Job ${esc(c.job_number)}` : ''}
            ${c.salesperson ? `<span class="proj-meta-sep">·</span> PM ${ini(c.salesperson)}` : '<span class="proj-meta-sep">·</span> <span style="color:#dc2626">no PM assigned</span>'}
            ${c.estimator ? ` Est ${ini(c.estimator)}` : ''}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          ${right(c)}
        </div>
      </div>`; }).join('') : '<div style="padding:24px;text-align:center;color:var(--text-muted)">No matches</div>';
}

function onProjFilterChange() {
  PROJ_FILTER.q = document.getElementById('proj-q')?.value || '';
  PROJ_FILTER.sort = document.getElementById('proj-sort')?.value || PROJ_FILTER.sort;
  renderProjectsBody();
}

function renderProjectsBody() {
  const q = PROJ_FILTER.q.trim().toLowerCase();
  let projects = !q ? PROJECTS_RAW : PROJECTS_RAW.filter(p =>
    p.name.toLowerCase().includes(q) || p.customers.some(c => c.toLowerCase().includes(q)) || p.job_numbers.some(j => j.toLowerCase().includes(q)));
  const sorters = {
    name: (a, b) => a.name.localeCompare(b.name),
    bids: (a, b) => b.bid_count - a.bid_count,
    pipeline: (a, b) => (b.pipeline_value||0) - (a.pipeline_value||0),
    won: (a, b) => (b.won_value||0) - (a.won_value||0),
  };
  projects = [...projects].sort(sorters[PROJ_FILTER.sort] || sorters.name);
  document.getElementById('proj-count').textContent = `${projects.length} of ${PROJECTS_RAW.length} projects · Project → Bids → Job → Change Orders`;
  document.getElementById('proj-body').innerHTML = projects.length ? projects.map(p => `
      <div class="proj-row" onclick="renderProjectPage(${p.id})">
        <div style="flex:1;min-width:0">
          <div class="proj-name">${esc(p.name)}</div>
          <div class="proj-meta">
            ${p.bid_count} bid${p.bid_count!==1?'s':''}
            <span class="proj-meta-sep">·</span> ${p.job_count} job${p.job_count!==1?'s':''}
            <span class="proj-meta-sep">·</span> ${p.co_count} CO${p.co_count!==1?'s':''}
            ${p.pipeline_value ? `<span class="proj-meta-sep">·</span> pipeline <span class="amount">${fmt$(p.pipeline_value)}</span>` : ''}
            ${p.won_value ? `<span class="proj-meta-sep">·</span> won <span class="amount">${fmt$(p.won_value)}</span>` : ''}
            ${p.customers.length ? `<span class="proj-meta-sep">·</span> <span class="proj-meta-customers">${esc(p.customers.join(', '))}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
          ${p.job_numbers.map(j => `<span class="proj-active-badge">Job ${esc(j)}</span>`).join('')}
          ${p.job_number_pending ? '<span class="pending-pill">JOB # PENDING</span>' : ''}
          ${p.is_legacy ? '<span class="legacy-pill">LEGACY</span>' : ''}
          ${p.active_count ? `<span class="badge badge-bid">${p.active_count} active</span>` : ''}
          <span style="color:var(--text-muted)">›</span>
        </div>
      </div>`).join('') : '<div style="padding:24px;text-align:center;color:var(--text-muted)">No matches</div>';
}

// ── Dashboard page (v2 data) ──
let DASH_MINE = null;   // "My View" is the default (except Admin/Oversight, who default to global); toggle switches it
function setDashboardView(mine) { DASH_MINE = mine; renderDashboard(); }
let DASH_DATA = null;   // last-rendered dashboard payload, kept around so the Awarded (YTD) card can pop its month breakout without a re-fetch

async function renderDashboard() {

    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <button class="v2-btn green" style="padding:8px 14px;font-size:12px" onclick="actNewBid()">+ New Bid</button>
      <button class="v2-btn blue" style="padding:8px 14px;font-size:12px" onclick="actNewOpportunity()">+ New Opportunity</button>
      <button class="v2-btn outline" style="padding:8px 14px;font-size:12px" onclick="actNewLegacyJob()">+ Legacy Job</button>
      <button class="v2-btn amber" style="padding:8px 14px;font-size:12px" onclick="actImportJIS()">📄 Import Bid (JIS)</button>
      <button class="v2-btn outline" style="padding:8px 14px;font-size:12px" onclick="actNewChangeOrder()">+ New Change Order</button>
    </div>
    <div class="stat-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px">
      ${stat('Opportunities', d.pipeline.opportunity, '', '#3b82f6', "renderBidList('opportunity')")}
      ${stat('Active Bids', d.pipeline.active_bid, '', '#f59e0b', "renderBidList('active_bid')")}
      ${stat('Submitted (YTD)', d.submittedYTD.count, '', '#2563eb', "renderBidList('submitted')")}
      ${stat('Active Change Orders', d.activeCoCount, '', '#f97316', "renderCoList('active_co')")}
      ${stat('Awarded (YTD)', d.awardedYTD.count, fmt$(d.awardedYTD.value) + (d.awardedYTD.missingAwardDate ? ` · ${d.awardedYTD.missingAwardDate} missing award date` : ''), '#16a34a', 'showAwardedByMonth()')}
      ${stat('Overdue Follow-ups', d.overdueBidCount + d.overdueCoCount, `${d.overdueBidCount} bid · ${d.overdueCoCount} CO`, (d.overdueBidCount+d.overdueCoCount) ? '#dc2626' : '#16a34a')}
      ${stat('Jobs awaiting Job #', d.jobsPending, DASH_MINE ? 'assigned to you' : 'from accounting', '#0891b2')}
    </div>
    <div class="dashboard-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
      <div class="card">
        <div class="section-title">📅 Upcoming Due Dates — next 14 days</div>

            <span style="font-size:12px;font-weight:700;color:${dot}">Due ${fmtD(b.due_date)}</span>

      </div>

        ${d.awardedYTD.list.length ? d.awardedYTD.list.map(b => `
          <div class="proj-row" onclick="openBidFlyout(${b.project_id},${b.id})">
            <div style="flex:1"><strong style="font-size:13px">${esc(b.project || '—')}</strong>

// Month-by-month breakout for the Dashboard's "Awarded (YTD)" card — reuses
// the byMonth buckets the API already computed, no extra fetch. Each row
// expands in place to the bids awarded that month.
const AWARDED_MONTHS_OPEN = new Set();
function showAwardedByMonth() {
  const d = DASH_DATA;
  if (!d) return;
  const months = d.awardedYTD.byMonth || [];
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.innerHTML = `
    <div class="v2-modal" style="max-width:560px;max-height:85vh;overflow-y:auto">
      <div class="v2-modal-hd">✅ Awarded — by month${d.mineOnly ? ' (My View)' : ''}<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd" id="awarded-by-month-body">${awardedByMonthHtml(months)}</div>
    </div>`;
  document.body.appendChild(ov);
}
function awardedByMonthHtml(months) {
  if (!months.length) return '<div style="font-size:13px;color:var(--text-muted)">No awards yet this year.</div>';
  return months.map(m => {
    const open = AWARDED_MONTHS_OPEN.has(m.month);
    return `
    <div style="border-bottom:1px solid var(--border);padding:10px 0">
      <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="toggleAwardedMonth('${m.month}')">
        <div style="font-size:13.5px;font-weight:700">${m.label}</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:12px;color:var(--text-muted)">${m.count} awarded</span>
          <span style="font-size:13px;font-weight:700;color:#16a34a">${fmt$(m.value)}</span>
          <span style="font-size:11px;color:var(--text-muted)">${open ? '▲' : '▼'}</span>
        </div>
      </div>
      ${open ? (m.bids.length ? m.bids.map(b => `
        <div class="proj-row" onclick="document.getElementById('v2-form-overlay').remove();openBidFlyout(${b.project_id},${b.id})">
          <div style="flex:1"><strong style="font-size:13px">${esc(b.project || '—')}</strong>
            <span style="color:var(--text-muted);font-size:12px">${b.bid_number ? '#'+esc(b.bid_number) : ''}${b.company ? ' · '+esc(b.company) : ''}</span></div>
          <span class="amount" style="font-size:12px">${fmt$(b.amount)}</span>
        </div>`).join('') : '<div style="font-size:12px;color:var(--text-muted);padding:6px 0">No bids with an award date this month.</div>') : ''}
    </div>`;
  }).join('');
}
function toggleAwardedMonth(month) {
  if (AWARDED_MONTHS_OPEN.has(month)) AWARDED_MONTHS_OPEN.delete(month); else AWARDED_MONTHS_OPEN.add(month);
  const body = document.getElementById('awarded-by-month-body');
  if (body) body.innerHTML = awardedByMonthHtml(DASH_DATA.awardedYTD.byMonth || []);
}

// ── Dedicated project page (full hierarchy on its own page) ───────────────────
async function renderProjectPage(projectId) {
