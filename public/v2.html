<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v2 Preview — LIS Estimating</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg: #f1f5f9; --card: #fff; --border: #e2e8f0; --text: #0f172a;
    --muted: #64748b; --primary: #2563eb; --success: #16a34a; --danger: #dc2626;
    --amber: #d97706; --orange: #f97316;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  .topbar { background: #1e293b; color: #fff; padding: 14px 28px; display: flex; align-items: center; gap: 14px; }
  .topbar h1 { font-size: 16px; font-weight: 800; }
  .topbar .tag { background: #f59e0b; color: #1e293b; font-size: 11px; font-weight: 800; padding: 2px 10px; border-radius: 10px; letter-spacing: .5px; }
  .topbar .sub { color: #94a3b8; font-size: 12px; margin-left: auto; }
  .wrap { max-width: 980px; margin: 24px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .proj-head { padding: 14px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .proj-head:hover { background: #f8fafc; }
  .proj-name { font-weight: 800; font-size: 15px; flex: 1; min-width: 0; }
  .proj-meta { font-size: 12px; color: var(--muted); }
  .pill { font-size: 10px; font-weight: 800; padding: 2px 9px; border-radius: 10px; letter-spacing: .4px; white-space: nowrap; }
  .pill-job { background: #dcfce7; color: #166534; }
  .pill-pending { background: #fef3c7; color: #92400e; }
  .pill-legacy { background: #ede9fe; color: #5b21b6; }
  .pill-active { background: #dbeafe; color: #1e40af; }
  .hier { display: none; border-top: 1px solid var(--border); padding: 14px 18px 18px; }
  .hier.open { display: block; }
  .node { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-top: 10px; }
  .node-awarded { border-left: 4px solid var(--success); background: #f0fdf4; }
  .node-job { border-left: 4px solid #0891b2; background: #ecfeff; margin-left: 26px; }
  .node-co { border-left: 3px solid var(--orange); background: #fffbf5; margin-left: 52px; padding: 8px 12px; }
  .node-title { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .node-sub { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .badge { font-size: 10px; font-weight: 800; padding: 1px 8px; border-radius: 9px; }
  .st-awarded { background: var(--success); color: #fff; }
  .st-submitted { background: #2563eb; color: #fff; }
  .st-active_bid { background: #f59e0b; color: #fff; }
  .st-opportunity { background: #94a3b8; color: #fff; }
  .st-not_awarded { background: #fee2e2; color: #991b1b; }
  .st-closed { background: #e2e8f0; color: #475569; }
  .st-active_co { background: #f59e0b; color: #fff; }
  .st-submitted_co { background: #2563eb; color: #fff; }
  .st-approved { background: var(--success); color: #fff; }
  .st-not_approved { background: #fee2e2; color: #991b1b; }
  .st-voided { background: #e2e8f0; color: #475569; }
  .amount { font-weight: 700; color: #166534; }
  .overdue { color: var(--danger); font-weight: 700; }
  .ini { display: inline-block; background: #e0e7ff; color: #3730a3; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 8px; }
  .fu { border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 8px; font-size: 12px; color: var(--muted); }
  .fu-row { padding: 3px 0; }
  .err { background: #fee2e2; color: #991b1b; padding: 16px 20px; border-radius: 10px; font-size: 14px; }
  .loading { color: var(--muted); padding: 30px; text-align: center; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🏗️ LIS Estimating Calendar</h1>
    <span class="tag">V2 PREVIEW</span>
    <span class="sub">Test data only — estimating_v2_test · <a href="/" style="color:#7dd3fc">back to live app</a></span>
  </div>
  <div class="wrap" id="main"><div class="loading">Loading…</div></div>

<script>
const fmt$ = n => n == null ? '' : new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);
const fmtD = d => { if (!d) return ''; const [y,m,dd] = d.split('-'); return `${Number(m)}/${Number(dd)}/${String(y).slice(2)}`; };
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = new Date().toISOString().split('T')[0];
const STAGE = {
  opportunity:'Opportunity', active_bid:'Active Bid', submitted:'Submitted', awarded:'AWARDED',
  not_awarded:'Not Awarded', closed:'Closed',
  active_co:'Active CO', submitted_co:'Submitted CO', approved:'Approved', not_approved:'Not Approved', voided:'Voided',
};
const METHOD = { phone:'📞 phone', email:'✉️ email', in_person:'🤝 in person', other:'other' };

async function load() {
  const main = document.getElementById('main');
  let projects;
  try {
    const r = await fetch('/api/v2/projects');
    if (r.status === 401) { main.innerHTML = '<div class="err">Not logged in. <a href="/">Log in on the main app</a> first, then come back to /v2.html.</div>'; return; }
    projects = await r.json();
  } catch (e) { main.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }

  main.innerHTML = projects.map(p => `
    <div class="card">
      <div class="proj-head" onclick="toggle(${p.id})">
        <div style="flex:1;min-width:0">
          <div class="proj-name">${esc(p.name)}</div>
          <div class="proj-meta">
            ${p.bid_count} bid${p.bid_count!==1?'s':''} · ${p.job_count} job${p.job_count!==1?'s':''} · ${p.co_count} CO${p.co_count!==1?'s':''}
            ${p.pipeline_value ? ` · pipeline <span class="amount">${fmt$(p.pipeline_value)}</span>` : ''}
            ${p.won_value ? ` · won <span class="amount">${fmt$(p.won_value)}</span>` : ''}
            ${p.customers.length ? ` · ${esc(p.customers.join(', '))}` : ''}
          </div>
        </div>
        ${p.job_numbers.map(j => `<span class="pill pill-job">JOB ${esc(j)}</span>`).join('')}
        ${p.job_number_pending ? '<span class="pill pill-pending">JOB # PENDING</span>' : ''}
        ${p.is_legacy ? '<span class="pill pill-legacy">LEGACY</span>' : ''}
        ${p.active_count ? `<span class="pill pill-active">${p.active_count} ACTIVE</span>` : ''}
      </div>
      <div class="hier" id="hier-${p.id}"></div>
    </div>`).join('');
}

async function toggle(id) {
  const el = document.getElementById('hier-' + id);
  if (el.classList.contains('open')) { el.classList.remove('open'); return; }
  document.querySelectorAll('.hier.open').forEach(h => h.classList.remove('open'));
  el.classList.add('open');
  if (el.dataset.loaded) return;
  el.innerHTML = '<div class="loading">Loading…</div>';
  const d = await (await fetch('/api/v2/projects/' + id)).json();
  el.dataset.loaded = '1';
  el.innerHTML = renderHierarchy(d);
}

function renderHierarchy(d) {
  let html = '';
  const jobByWinningBid = {};
  d.jobs.forEach(j => { if (j.winning_bid_id) jobByWinningBid[j.winning_bid_id] = j; });

  for (const b of d.bids) {
    html += bidNode(b);
    const job = jobByWinningBid[b.id];
    if (job) html += jobNode(job);
  }
  // Legacy / unattached jobs (no winning bid in system)
  for (const j of d.jobs.filter(j => !j.winning_bid_id)) {
    html += jobNode(j, true);
  }
  return html || '<div class="node-sub">Nothing here yet.</div>';
}

function bidNode(b) {
  const isAwarded = b.stage === 'awarded';
  const fuOverdue = b.next_followup_date && b.next_followup_date < today;
  return `
    <div class="node ${isAwarded ? 'node-awarded' : ''}">
      <div class="node-title">
        ${isAwarded ? '✓' : ''} ${b.bid_number ? esc(b.bid_number) : '<em style="color:var(--muted)">no bid #</em>'}
        <span class="badge st-${b.stage}">${STAGE[b.stage]}</span>
        ${b.drawing_stage ? `<span class="badge" style="background:#ede9fe;color:#5b21b6">${esc(b.drawing_stage)}</span>` : ''}
        ${b.estimate_amount ? `<span class="amount">${fmt$(b.estimate_amount)}</span>` : ''}
        ${b.revisions.length ? `<span class="badge" style="background:#fef3c7;color:#92400e">REV ${b.revisions.length}</span>` : ''}
      </div>
      <div class="node-sub">
        ${b.customers.length ? `Bid to: <strong>${esc(b.customers.map(c=>c.name).join(', '))}</strong>` : ''}
        ${b.awarded_company ? ` · Won by <strong style="color:var(--success)">${esc(b.awarded_company.name)}</strong> on ${fmtD(b.award_date)}` : ''}
        <br>
        ${b.estimator ? `Est: <span class="ini">${esc(b.estimator.initials)}</span>` : ''}
        ${b.sub_estimators.map(s => `<span class="ini" title="${esc(s.scope)}">${esc(s.initials || '?')}·${esc(s.scope)}</span>`).join(' ')}
        ${b.salesperson ? ` Sales: <span class="ini">${esc(b.salesperson.initials)}</span>` : ''}
        ${b.due_date ? ` · Due ${fmtD(b.due_date)}` : ''}
        ${b.date_submitted ? ` · Submitted ${fmtD(b.date_submitted)} (apprvd: ${esc(b.approved_by)}, Local ${esc(b.jurisdiction)})` : ''}
        ${b.next_followup_date ? ` · Next F/U: <span class="${b.next_followup_date < today ? 'overdue' : ''}">${fmtD(b.next_followup_date)}${b.next_followup_date < today ? ' OVERDUE' : ''}</span>` : ''}
        ${b.close_reason ? `<br>Closed ${fmtD(b.closed_date)} by ${esc(b.closed_approved_by)} — ${esc(b.close_reason)}` : ''}
        ${b.not_awarded_notes ? `<br><span style="color:var(--danger)">Not awarded ${fmtD(b.date_not_awarded)}:</span> ${esc(b.not_awarded_notes)}` : ''}
        ${b.notes ? `<br>📝 ${esc(b.notes)}` : ''}
      </div>
      ${b.followups.length ? `<div class="fu">${b.followups.map(fuRow).join('')}</div>` : ''}
    </div>`;
}

function jobNode(j, legacy = false) {
  return `
    <div class="node node-job">
      <div class="node-title">
        🏭 ${j.job_number ? `Job <strong>${esc(j.job_number)}</strong>` : '<span class="pill pill-pending">JOB # PENDING — accounting</span>'}
        ${legacy ? '<span class="pill pill-legacy">LEGACY — bid pre-dates system</span>' : ''}
      </div>
      <div class="node-sub">
        ${j.awarded_company ? `Awarded by <strong>${esc(j.awarded_company.name)}</strong>` : ''}
        ${j.award_date ? ` on ${fmtD(j.award_date)}` : ''}
        ${j.pm ? ` · PM: <span class="ini">${esc(j.pm.initials)}</span> ${esc(j.pm.name)}` : ''}
        · ${j.change_orders.length} change order${j.change_orders.length!==1?'s':''}
      </div>
    </div>
    ${j.change_orders.map(coNode).join('')}`;
}

function coNode(co) {
  const fuOverdue = co.next_followup_date && co.next_followup_date < today;
  return `
    <div class="node node-co">
      <div class="node-title">
        <span style="color:var(--orange)">${esc(co.co_number)}</span> ${esc(co.name)}
        <span class="badge st-${co.stage}">${STAGE[co.stage]}</span>
        ${co.estimate_amount ? `<span class="amount">${fmt$(co.estimate_amount)}</span>` : ''}
      </div>
      <div class="node-sub">
        ${co.estimator ? `Est: <span class="ini">${esc(co.estimator.initials)}</span>` : ''}
        ${co.due_date ? ` · Due ${fmtD(co.due_date)}` : ''}
        ${co.date_submitted ? ` · Submitted ${fmtD(co.date_submitted)} (apprvd: ${esc(co.approved_by)})` : ''}
        ${co.approval_date ? ` · <span style="color:var(--success);font-weight:700">Approved ${fmtD(co.approval_date)}</span>` : ''}
        ${co.next_followup_date ? ` · Next F/U: <span class="${fuOverdue ? 'overdue' : ''}">${fmtD(co.next_followup_date)}${fuOverdue ? ' OVERDUE' : ''}</span>` : ''}
        ${co.void_reason ? ` · Voided: ${esc(co.void_reason)}` : ''}
        ${co.not_approved_notes ? ` · ${esc(co.not_approved_notes)}` : ''}
      </div>
      ${co.followups.length ? `<div class="fu">${co.followups.map(fuRow).join('')}</div>` : ''}
    </div>`;
}

function fuRow(f) {
  return `<div class="fu-row">
    ${fmtD(f.followup_date)} — <span class="ini">${esc(f.contacted_by?.initials || '?')}</span>
    ${METHOD[f.contact_method] || ''} w/ <strong>${esc(f.customer_contact || '?')}</strong>:
    ${esc(f.notes || '')}
    ${f.outcome === 'no_decision' && f.next_followup_date ? `→ next ${fmtD(f.next_followup_date)}` : ''}
    ${f.outcome === 'awarded' ? '<span style="color:var(--success);font-weight:700">→ AWARDED</span>' : ''}
    ${f.outcome === 'approved' ? '<span style="color:var(--success);font-weight:700">→ APPROVED</span>' : ''}
    ${f.outcome === 'not_awarded' ? '<span class="overdue">→ NOT AWARDED</span>' : ''}
  </div>`;
}

load();
</script>
</body>
</html>
