}

// Re-render the current page (+ open flyout) after any action.
async function refresh() {
  DETAIL_CACHE = {};
  await rerenderView();
  if (FLYOUT) await renderFlyout();
}

// ── Detail flyout (slide-over) ────────────────────────────────────────────────
let FLYOUT = null;   // { kind:'bid'|'co', projectId, id }

function closeFlyout() {
  FLYOUT = null;
  document.getElementById('fly-overlay')?.remove();
  document.getElementById('fly-panel')?.remove();
}

function openBidFlyout(projectId, bidId) { FLYOUT = { kind: 'bid', projectId, id: bidId }; OPEN_PROJECT = projectId; setHash(`project/${projectId}/bid/${bidId}`); renderFlyout(true); }
function openCoFlyout(projectId, coId) { FLYOUT = { kind: 'co', projectId, id: coId }; OPEN_PROJECT = projectId; setHash(`project/${projectId}/co/${coId}`); renderFlyout(true); }

async function renderFlyout(fresh) {
  if (!FLYOUT) return;
  let overlay = document.getElementById('fly-overlay');
  let panel = document.getElementById('fly-panel');
  if (!overlay) {
    overlay = document.createElement('div'); overlay.id = 'fly-overlay'; overlay.className = 'fly-overlay';
    document.body.appendChild(overlay);
    panel = document.createElement('div'); panel.id = 'fly-panel'; panel.className = 'fly-panel'; document.body.appendChild(panel);
    requestAnimationFrame(() => { overlay.classList.add('open'); panel.classList.add('open'); });
  }
  panel.innerHTML = '<div class="fly-head"><span class="fly-title">Loading…</span><button class="fly-close" onclick="closeFlyout()">✕</button></div>';

  const d = await api('GET', '/api/v2/projects/' + FLYOUT.projectId);
  DETAIL_CACHE[FLYOUT.projectId] = d;

  let title = '', sub = '', body = '';
  if (FLYOUT.kind === 'bid') {
    const b = d.bids.find(x => x.id === FLYOUT.id);
    if (!b) { closeFlyout(); return; }
    title = `${b.bid_number || 'Bid'}`; sub = esc(d.name);
    body = bidNode(b);
    if (b.stage === 'awarded') { const job = d.jobs.find(j => j.winning_bid_id === b.id); if (job) body += jobNode(job); }
  } else {
    let co = null, job = null;
    for (const j of d.jobs) { const c = j.change_orders.find(x => x.id === FLYOUT.id); if (c) { co = c; job = j; break; } }
    if (!co) { closeFlyout(); return; }
    title = `${esc(co.co_number)}`; sub = `${esc(d.name)}${job.job_number ? ' · Job ' + esc(job.job_number) : ''}`;
    body = `<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">🏭 ${job.job_number ? 'Job ' + esc(job.job_number) : 'Job'}${job.pm ? ` · PM ${ini(job.pm)} ${esc(job.pm.name)}` : ' · <span style="color:#dc2626">no PM assigned</span>'}</div>` + coNode(co);
  }
  panel.querySelector('.fly-head').outerHTML = `
    <div class="fly-head">
      <div style="flex:1;min-width:0"><div class="fly-title">${title}</div><div class="fly-sub">${sub}</div></div>
      <a href="#" onclick="event.preventDefault();renderProjectPage(${FLYOUT.projectId})">Open full project →</a>
      <button class="fly-close" onclick="closeFlyout()">✕</button>
    </div>`;
  panel.querySelector('.fly-body')?.remove();
  panel.insertAdjacentHTML('beforeend', `<div class="fly-body">${body}</div>`);
}

function renderHierarchy(d) {
  let html = `<div class="v2-actions" style="margin:0 0 4px">
    <button class="v2-btn green" onclick="actAddBidToProject(${d.id})">+ Add Bid to this Project</button>
    ${CURRENT_USER?.is_admin ? `<button class="v2-btn outline" onclick="actEditProject(${d.id})">✏️ Edit Project</button>` : ''}
  </div>`;

  // Duplicate-jobs warning: same job # on more than one job here (legacy + bid-backed
  // artifact from an older import). One click merges the COs onto the real job.
  const byNum = {};
  d.jobs.forEach(j => { if (j.job_number) (byNum[j.job_number] = byNum[j.job_number] || []).push(j); });
  const dupJobGroups = Object.values(byNum).filter(g => g.length > 1);
  if (dupJobGroups.length && CURRENT_USER?.is_admin) {
    html += `<div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:9px 12px;margin:4px 0;font-size:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="flex:1">⚠️ Job #${esc(dupJobGroups.map(g=>g[0].job_number).join(', '))} is split across ${dupJobGroups.reduce((s,g)=>s+g.length,0)} jobs (legacy + bid-backed). They're the same job.</span>
      <button class="v2-btn amber" onclick="actMergeDupeJobs(${d.id})">Merge into one job</button>
    </div>`;
  }

  const jobByWinningBid = {};
  d.jobs.forEach(j => { if (j.winning_bid_id) jobByWinningBid[j.winning_bid_id] = j; });
  for (const b of d.bids) {
    html += bidNode(b);
    const job = jobByWinningBid[b.id];
    if (job) html += jobNode(job);
  }
  for (const j of d.jobs.filter(j => !j.winning_bid_id)) html += jobNode(j, true);
  return html || '<div style="padding:10px;color:var(--text-muted);font-size:13px">Nothing here yet.</div>';
}

// Customer list + the one action that belongs right next to it ("+ Customer")
// instead of buried in the generic action bar at the bottom of the card —
// same grouping idea as Reminders/Notes, which already keep their own
// "+ Reminder" / "+ Note" trigger attached to their own list.
// One row per customer — Customers and Submissions used to be two separate
// lists showing the same company twice (once as "customer," once as
// "submission" with its own action buttons under a different heading).
// Merged: name/contact, amount, approver, follow-up date, and that
// customer's own pending-decision buttons all live in one place. "+ Add
// customer" lives in this section's own header, not a shared bottom bar.
function customerRowHtml(b, cust) {
  const subs = (b.submissions || []).filter(s => s.company?.id === cust.id)
    .sort((x, y) => (y.date_submitted || '').localeCompare(x.date_submitted || ''));
  const current = subs.find(s => s.is_current);
  const historical = subs.filter(s => !s.is_current);
  const canEditSub = CURRENT_USER?.is_admin || CURRENT_USER?.id === b.estimator?.id || CURRENT_USER?.id === b.salesperson?.id;

  let outcomeBadge = '', right = '', actionsHtml = '', followupsHtml = '', subMetaExtra = '';
  if (current) {
    if (current.outcome === 'awarded') outcomeBadge = ` <span class="awarded-pill">✓ AWARDED ${fmtD(current.award_date)}</span>`;
    else if (current.outcome === 'not_awarded') outcomeBadge = ` <span class="badge" style="background:#fee2e2;color:#991b1b">✗ NOT AWARDED ${fmtD(current.date_not_awarded)}</span>`;
    const overdue = current.next_followup_date && current.next_followup_date < today && current.outcome === 'pending';
    right = `<div class="bc-co-amt">${fmt$(current.amount)}</div>
      ${current.outcome === 'pending' && current.next_followup_date ? `<div class="bc-co-fu ${overdue ? 'overdue-txt' : ''}">${overdue ? 'OVERDUE ' : 'Next F/U '}${fmtD(current.next_followup_date)}</div>` : ''}`;
    const live = current.is_current && current.outcome === 'pending';
    if (live && ['submitted', 'awarded'].includes(b.stage)) {
      const awardBtn = b.stage === 'submitted' ? `<button class="bc-btn-quiet" onclick="actAwardSubmission(${current.id})">Awarded</button>` : '';
      actionsHtml = `<div class="bc-row-actions">
        <button class="bc-btn-quiet" onclick="actLogFollowup('bid_submission',${current.id})">Log Follow-up</button>
        ${awardBtn}
        <button class="bc-btn-quiet" onclick="actNotAwardSubmission(${current.id})">Not Awarded</button>
      </div>`;
    }
    if ((current.followups || []).length) followupsHtml = `<div style="margin-top:6px">${current.followups.map(fuRow).join('')}</div>`;
    if (current.notes) subMetaExtra += ` · ${esc(current.notes)}`;
    if (current.not_awarded_notes) subMetaExtra += ` · <span style="color:#991b1b">${esc(current.not_awarded_notes)}</span>`;
  } else if (b.stage === 'active_bid') {
    right = `<div class="bc-co-fu" style="color:#d97706;font-weight:700">awaiting submission</div>`;
  }

  const historicalHtml = historical.length ? `<div style="margin-top:4px">${historical.map(s => `
    <div style="font-size:11px;color:#94a3b8">Previously ${fmt$(s.amount)} · ${SUB_TYPE[s.submission_type] || esc(s.submission_type)} · ${fmtD(s.date_submitted)} (superseded)</div>`).join('')}</div>` : '';

  const subLine = current ? `${SUB_TYPE[current.submission_type] || esc(current.submission_type)} · ${fmtD(current.date_submitted)}${current.approved_by ? ` · approved by ${esc(current.approved_by)}` : ''}${subMetaExtra}` : '';

  return `<div class="bc-row">
    <div class="bc-row-main">
      <div class="bc-co-name" onclick="openCompanyProfile(${cust.id})">${esc(cust.name)}${outcomeBadge}</div>
      ${subLine ? `<div class="bc-co-sub">${subLine}${current && canEditSub ? ` <a href="#" onclick="event.preventDefault();actEditSubmission(${current.id})" style="font-size:11px">✏️</a>` : ''}</div>` : ''}
      ${bidCustomerContactsHtml(cust)}
      ${historicalHtml}
      ${followupsHtml}
      ${actionsHtml}
    </div>
    <div style="text-align:right;flex-shrink:0">
      ${right}
      <div style="margin-top:4px"><button type="button" class="bc-remove-x" title="Remove customer from this bid" onclick="actRemoveBidCustomer(${cust.bid_customer_id},'${escJs(cust.name)}')">✕ remove</button></div>
    </div>
  </div>`;
}
function customersSectionHtml(b) {
  const canAddCustomer = !b.superseded && ['opportunity', 'active_bid', 'submitted'].includes(b.stage);
  const list = b.customers.length ? `<div class="bc-grouped">${b.customers.map(cust => customerRowHtml(b, cust)).join('')}</div>` : '<div style="font-size:12px;color:#dc2626">No customer yet</div>';
  const addBtn = canAddCustomer ? `<button class="bc-quiet-link" onclick="actAddCustomers(${b.id})">+ Add customer</button>` : '';
  return `<div class="bc-section">
    <div class="bc-sec-hd"><span class="bc-sec-title">Customers</span>${addBtn}</div>
    ${list}
  </div>`;
}

// Reminders/Notes/Walk-through/bid-level follow-ups (pre-submission) all
// collapsed into one quiet "Activity" area instead of several separately-
// boxed sections each competing for attention.
function activitySectionHtml(b) {
  const bidFollowups = (b.followups || []).length ? `<div style="margin-bottom:6px">${b.followups.map(fuRow).join('')}</div>` : '';
  return `<div class="bc-section">
    <div class="bc-sec-hd"><span class="bc-sec-title">Activity</span></div>
    ${walkthroughHtml(b)}
    ${bidFollowups}
    ${remindersHtml('bid', b.id, b.reminders)}
    ${notesHtml('bid', b.id, b.notes_log)}
  </div>`;
}

function bidNode(b) {
  const isAwarded = b.stage === 'awarded';
  const dueOverdue = ['opportunity', 'active_bid'].includes(b.stage) && b.due_date && b.due_date < today;
  const metaBits = [];
  if (!b.customers.length) metaBits.push('<span style="color:#dc2626">no customer</span>');
  if (b.awarded_company) metaBits.push(`Won by <strong style="color:#16a34a">${esc(b.awarded_company.name)}</strong> ${fmtD(b.award_date)}`);
  if (b.estimator) metaBits.push(`Est. ${ini(b.estimator)}`);
  b.sub_estimators.forEach(s => metaBits.push(`${ini(s)}<span style="font-size:10px">${esc(s.scope)}<a href="#" onclick="event.preventDefault();actRemoveSubEstimator(${b.id},${s.id},'${escJs(s.scope)}')" style="color:#dc2626;margin-left:2px">✕</a></span>`));
  if (b.salesperson) metaBits.push(`Sales ${ini(b.salesperson)}`);
  if (b.jurisdiction) metaBits.push(`Local ${esc(b.jurisdiction)}`);

  if (b.close_reason) metaBits.push(`Closed ${fmtD(b.closed_date)} by ${esc(b.closed_approved_by)} — ${esc(b.close_reason)}`);
  if (b.not_awarded_notes) metaBits.push(`<span style="color:#dc2626">Not awarded ${fmtD(b.date_not_awarded)}:</span> ${esc(b.not_awarded_notes)}`);
  if (b.notes) metaBits.push(`📝 ${esc(b.notes)}`);

  return `
    <div class="bc-card ${b.superseded ? 'bc-superseded' : ''}">
      <div class="bc-hd">
        <div class="bc-hd-left">
          <span class="bc-bidnum">${b.bid_number ? esc(b.bid_number) : 'No bid #'}</span>

          ${b.superseded ? '<span class="badge" style="background:#e2e8f0;color:#64748b">SUPERSEDED</span>' : ''}
          ${b.drawing_stage ? `<span class="badge" style="background:#ede9fe;color:#5b21b6">${esc(b.drawing_stage)}</span>` : ''}
        </div>
        ${(b.estimate_amount || b.due_date) ? `<div class="bc-hd-right">
          ${b.estimate_amount ? `<div class="bc-amount">${fmt$(b.estimate_amount)}</div>` : ''}
          ${b.due_date ? `<div class="bc-due" style="color:${dueOverdue ? '#dc2626' : 'var(--text-muted)'}">Due ${fmtD(b.due_date)}</div>` : ''}
        </div>` : ''}
      </div>
      ${metaBits.length ? `<div class="bc-meta">${metaBits.join(' · ')}</div>` : ''}
      <div class="bc-divider"></div>
      ${customersSectionHtml(b)}
      <div class="bc-divider"></div>
      ${activitySectionHtml(b)}
      ${bidActions(b)}
    </div>`;
}

// A standalone highlighted box, same visual weight as the rest of Activity —

// Reminders — polymorphic (bid or change_order). A personal tickler separate

// Bid editable by admin in these (non-terminal) stages
const BID_EDITABLE_STAGES = ['opportunity', 'active_bid', 'submitted'];

// Whichever of Submit Bid / + Add Submission actually applies right now —
// not a stage question, a "does anyone still need a first submission"
// question. A bid with no customers yet, or with at least one customer who
// has never had a submission, needs Submit Bid; once every customer has a
// current submission, only a revision (+ Add Submission) makes sense. This
// covers both a fresh active_bid bid and a reactivated one the same way,
// and also a 'submitted' bid that just had a new customer added to it (which
// needs its own first submission even though the bid itself is past 'active_bid').
function bidNeedsFirstSubmission(b) {
  const submittedIds = new Set((b.submissions || []).filter(s => s.is_current).map(s => s.company?.id));
  return !b.customers.length || b.customers.some(c => !submittedIds.has(c.id));
}
// Color budget for this view: ONE accent (blue), on the single forward-
// moving milestone action for whichever stage the bid is in right now
// (Start Bid / Submit Bid) — nothing else competes with it. Every other
// possible action (add a revision, edit dates/assignment, close, reactivate,
// edit the bid) is real but not routine, so it lives behind a single "⋯"
// menu instead of permanently occupying space next to the one thing you
// actually do most of the time.
let BC_MENU_SEQ = 0;
function toggleBcMenu(id) {
  document.querySelectorAll('.bc-dropdown.open').forEach(el => { if (el.id !== id) el.classList.remove('open'); });
  document.getElementById(id)?.classList.toggle('open');
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.bc-menu-wrap')) document.querySelectorAll('.bc-dropdown.open').forEach(el => el.classList.remove('open'));
});
function bidActions(b) {
  let primary = '';
  const menu = [];
  if (!b.superseded) {
    const canEditBid = CURRENT_USER?.is_admin || CURRENT_USER?.id === b.estimator?.id || CURRENT_USER?.id === b.salesperson?.id;
    if (b.stage === 'opportunity') {
      primary = `<button class="v2-btn blue" onclick="actStartBid(${b.id})">→ Start Bid</button>`;
      menu.push({ label: '📝 Log Follow-up', fn: `actLogFollowup('bid',${b.id})` });
      menu.push({ label: '📅 Due Date / Assign', fn: `actEditOpportunityDetails(${b.id})` });
      menu.push({ label: 'Close bid', fn: `actCloseBid(${b.id})`, danger: true });
    } else if (b.stage === 'active_bid' || b.stage === 'submitted') {
      if (bidNeedsFirstSubmission(b)) primary = `<button class="v2-btn blue" onclick="actSubmitBid(${b.id})">Submit Bid</button>`;
      else menu.push({ label: '+ Add Submission', fn: `actAddSubmission(${b.id})` });
      if (b.stage === 'active_bid') menu.push({ label: 'Close bid', fn: `actCloseBid(${b.id})`, danger: true });
      else menu.push({ label: '↻ Reactivate', fn: `actReactivateBid(${b.id})` });
    } else if (b.stage === 'closed') {
      // The customer came back after all — reopens to wherever it was closed
      // from (opportunity if it never got a bid #, active_bid otherwise).
      menu.push({ label: '↻ Reactivate', fn: `actReactivateBid(${b.id})` });
    }
    if (canEditBid && BID_EDITABLE_STAGES.includes(b.stage)) menu.push({ label: '✏️ Edit bid', fn: `actEditBid(${b.id})` });
  }
  if (!primary && !menu.length) return '';
  const menuId = `bcmenu-${++BC_MENU_SEQ}`;
  const menuHtml = menu.length ? `
    <div class="bc-menu-wrap">
      <button class="bc-btn-dots" onclick="toggleBcMenu('${menuId}')">⋯</button>
      <div class="bc-dropdown" id="${menuId}">
        ${menu.map(m => `<a href="#" onclick="event.preventDefault();${m.fn}" class="${m.danger ? 'bc-danger' : ''}">${m.label}</a>`).join('')}
      </div>

  return `<div class="bc-ft">${primary}${menuHtml}</div>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// FORM MODAL FRAMEWORK
// fields: [{ id, label, type: text|number|date|select|textarea|multicheck, required, options, value, placeholder }]
// ═══════════════════════════════════════════════════════════════════════════
// ── Searchable combobox (field types 'company' and 'project') ───────────────
// Picks an existing record OR lets you type a brand-new name (chip tagged
// "new"). f.multi → many chips; otherwise single. Selection lives in
// COMBO_STATE[f.id] as [{id, name}] (id null = new record to create).
// 'project' fields additionally fuzzy-match (normalized substring, shared
// significant word, or small edit distance) so a near-duplicate project name
// surfaces as a suggestion instead of silently creating a second Project row.
let COMBO_STATE = {};   // fieldId -> [{id, name}]
let COMBO_FIELDS = {};  // fieldId -> field def

function _normName(s) { return (s || '').toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim(); }
function _lev(a, b) {
  const m = a.length, n = b.length;
  const d = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) d[i][0] = i;
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] : 1 + Math.min(d[i - 1][j], d[i][j - 1], d[i - 1][j - 1]);
  return d[m][n];
}
// Fuzzy score for project-name matching — lower is a closer match, null = no match.
function _projMatchScore(query, label) {
  const qn = _normName(query), on = _normName(label);
  if (!qn) return null;
  if (on === qn) return 0;
  if (on.includes(qn) || qn.includes(on)) return 1;
  const words = qn.split(' ').filter(w => w.length >= 4);
  if (words.some(w => on.includes(w))) return 2;
  const dist = _lev(qn, on);
  if (dist <= 3 && qn.length >= 4) return 3;
  return null;
}

function comboRenderChips(fid) {
  const el = document.getElementById('cc-' + fid + '-chips'); if (!el) return;
  el.innerHTML = (COMBO_STATE[fid] || []).map((s, i) =>
    `<span class="v2-chip">${esc(s.name)}${s.id ? '' : ' <em>new</em>'}<button type="button" onmousedown="event.preventDefault();comboRemove('${fid}',${i})">✕</button></span>`).join('');
}
function comboRemove(fid, i) { (COMBO_STATE[fid] || []).splice(i, 1); comboRenderChips(fid); comboRenderMenu(fid); COMBO_FIELDS[fid]?.onChange?.(); }
function comboRenderMenu(fid) {
  const f = COMBO_FIELDS[fid], input = document.getElementById('vf-' + fid), menu = document.getElementById('cc-' + fid + '-menu');
  if (!f || !input || !menu) return;
  const raw = input.value.trim(), q = raw.toLowerCase();
  const chosen = new Set((COMBO_STATE[fid] || []).filter(s => s.id).map(s => s.id));
  const isProject = f.type === 'project';
  // Fuzzy-match scoring/behavior is keyed on the field TYPE ('project' gets
  // near-duplicate suggestions since typo'd project names are a real cost),
  // but the displayed noun is separate — `f.noun` lets a 'project'-typed
  // field used for something else (e.g. Company, which reuses 'project'
  // purely for its fuzzy matching) say the right word instead of literally
  // "project".
  const noun = f.noun || (isProject ? 'project' : 'customer');
  let opts;
  if (isProject) {
    if (!raw) opts = [];
    else opts = f.options.filter(o => !chosen.has(o.value))
      .map(o => ({ o, score: _projMatchScore(raw, o.label) }))
      .filter(x => x.score !== null).sort((a, b) => a.score - b.score).slice(0, 6).map(x => x.o);
  } else {
    opts = f.options.filter(o => !chosen.has(o.value) && (!q || o.label.toLowerCase().includes(q))).slice(0, 8);
  }
  const warn = (isProject && opts.length) ? `<div class="v2-combo-warn">⚠️ Found similar ${noun}${opts.length > 1 ? 's' : ''} below — pick one if it's the same one</div>` : '';
  let html = warn + opts.map(o => `<div class="v2-combo-opt" onmousedown="event.preventDefault();comboPick('${fid}',${o.value})">${esc(o.label)}</div>`).join('');
  const exact = f.options.some(o => o.label.toLowerCase() === q);
  const alreadyNew = (COMBO_STATE[fid] || []).some(s => !s.id && s.name.toLowerCase() === q);
  if (q && !exact && !alreadyNew && f.allowNew !== false)
    html += `<div class="v2-combo-opt v2-combo-new" onmousedown="event.preventDefault();comboAddNew('${fid}')">➕ Create new ${noun} "${esc(raw)}"</div>`;
  const emptyMsg = isProject ? `No similar ${noun}s found — keep typing to create a new one`
    : f.allowNew === false ? 'No matches' : `No matches — keep typing to add a new ${noun}`;
  menu.innerHTML = html || `<div class="v2-combo-empty">${emptyMsg}</div>`;
  // Fixed positioning computed from the real on-screen box (see the CSS
  // comment on .v2-combo-menu for why this can't just be absolute+CSS).
  const box = input.closest('.v2-combo-box') || input;
  const rect = box.getBoundingClientRect();
  menu.style.left = rect.left + 'px';
  menu.style.width = rect.width + 'px';
  menu.style.top = (rect.bottom + 3) + 'px';
  menu.style.display = 'block';
}
function comboPick(fid, val) {
  const f = COMBO_FIELDS[fid], opt = f.options.find(o => o.value == val); if (!opt) return;
  if (!f.multi) COMBO_STATE[fid] = [];
  COMBO_STATE[fid].push({ id: opt.value, name: opt.label });
  const input = document.getElementById('vf-' + fid); input.value = '';
  comboRenderChips(fid); comboRenderMenu(fid); input.focus();
  f.onChange?.();
}
function comboAddNew(fid) {
  const f = COMBO_FIELDS[fid], input = document.getElementById('vf-' + fid), name = input.value.trim(); if (!name) return;
  if (!f.multi) COMBO_STATE[fid] = [];
  COMBO_STATE[fid].push({ id: null, name });
  input.value = ''; comboRenderChips(fid); comboRenderMenu(fid); input.focus();
  f.onChange?.();
}
function initCombos(ov, fields) {
  COMBO_STATE = {}; COMBO_FIELDS = {};
  for (const f of fields.filter(x => x.type === 'company' || x.type === 'project')) {
    COMBO_FIELDS[f.id] = f; COMBO_STATE[f.id] = [];
    if (f.value != null) { const o = f.options.find(o => o.value == f.value); if (o) COMBO_STATE[f.id].push({ id: o.value, name: o.label }); }
    comboRenderChips(f.id);
    const input = ov.querySelector('#vf-' + f.id), menu = ov.querySelector('#cc-' + f.id + '-menu');
    input.addEventListener('input', () => comboRenderMenu(f.id));
    input.addEventListener('focus', () => comboRenderMenu(f.id));
    input.addEventListener('blur', () => setTimeout(() => { if (menu) menu.style.display = 'none'; }, 150));
  }
}

function fmtCurrencyInput(n) {
  const num = Number(n);
  if (isNaN(num) || n === '' || n == null) return '';
  return (num < 0 ? '-$' : '$') + Math.round(Math.abs(num)).toLocaleString('en-US');
}
// Allows a single leading '-' (change-order credits are negative amounts) —
// everything else strips down to digits, same as before.
function formatCurrencyField(el) {
  const negative = el.value.trim().startsWith('-');
  const digits = el.value.replace(/[^\d]/g, '');
  el.value = digits ? (negative ? '-$' : '$') + Number(digits).toLocaleString('en-US') : (negative ? '-' : '');
}
function showForm(title, fields, onSubmit, submitLabel = 'Save', submitClass = 'blue') {
  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';

  const fieldHtml = fields.map(f => {
    const req = f.required ? ' <span class="req">*</span>' : '';
    if (f.type === 'select') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        <select id="vf-${f.id}">
          ${f.required ? '' : `<option value="">${esc(f.emptyLabel || '—')}</option>`}
          ${f.options.map(o => `<option value="${o.value}" ${o.value == f.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
        </select></div>`;
    }
    if (f.type === 'multicheck') {
      const selected = new Set((f.value || []).map(String));
      return `<div class="v2-field"><label>${f.label}${req}</label>
        ${f.options.map(o => `<label class="v2-check"><input type="checkbox" data-multi="${f.id}" value="${o.value}" ${selected.has(String(o.value)) ? 'checked' : ''}> ${esc(o.label)}</label>`).join('')}</div>`;
    }
    if (f.type === 'tags') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        <input id="vf-${f.id}" type="text" value="${esc((f.value || []).join(', '))}" placeholder="${esc(f.placeholder || 'Comma-separated…')}"></div>`;
    }
    if (f.type === 'company' || f.type === 'project') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        <div class="v2-combo">
          <div class="v2-combo-box">
            <span id="cc-${f.id}-chips"></span>
            <input id="vf-${f.id}" class="v2-combo-input" type="text" autocomplete="off" placeholder="${esc(f.placeholder || 'Type to search…')}">
          </div>
          <div class="v2-combo-menu" id="cc-${f.id}-menu"></div>
        </div></div>`;
    }
    if (f.type === 'textarea') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        <textarea id="vf-${f.id}" rows="3" placeholder="${esc(f.placeholder || '')}">${esc(f.value ?? '')}</textarea></div>`;
    }
    if (f.type === 'currency') {
      return `<div class="v2-field"><label>${f.label}${req}</label>
        <input id="vf-${f.id}" type="text" inputmode="decimal" value="${f.value != null ? fmtCurrencyInput(f.value) : ''}" placeholder="${esc(f.placeholder || '$0')}" oninput="formatCurrencyField(this)"></div>`;
    }
    if (f.type === 'custom') {
      // An empty placeholder the caller fills in after showForm renders (via
      // document.getElementById('custom-<id>')) — lets a form position a
      // hand-built section (e.g. sub-estimators, per-customer contacts)
      // exactly where it belongs instead of only ever at the end.
      return `<div id="custom-${f.id}"></div>`;
    }
    return `<div class="v2-field"><label>${f.label}${req}</label>
      <input id="vf-${f.id}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}" ${f.type === 'number' ? 'step="any"' : ''}></div>`;
  }).join('');

  ov.innerHTML = `
    <div class="v2-modal">
      <div class="v2-modal-hd">${title}<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">${fieldHtml}</div>
      <div class="v2-modal-err" id="vf-err"></div>
      <div class="v2-modal-ft">
        <button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">Cancel</button>
        <button class="v2-btn ${submitClass}" id="vf-submit">${submitLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  initCombos(ov, fields);

  document.getElementById('vf-submit').onclick = async () => {
    const data = {};
    let missing = [];
    for (const f of fields) {
      if (f.type === 'multicheck') {
        data[f.id] = [...ov.querySelectorAll(`input[data-multi="${f.id}"]:checked`)].map(c => f.stringValues ? c.value : Number(c.value));
        if (f.required && !data[f.id].length) missing.push(f.label);
      } else if (f.type === 'tags') {
        data[f.id] = (document.getElementById('vf-' + f.id)?.value || '').split(',').map(s => s.trim()).filter(Boolean);
        if (f.required && !data[f.id].length) missing.push(f.label);
      } else if (f.type === 'company' || f.type === 'project') {
        const sel = COMBO_STATE[f.id] || [];
        const ids = sel.filter(s => s.id).map(s => s.id);
        const names = sel.filter(s => !s.id).map(s => s.name);
        if (f.multi) { data[f.id] = ids; data[f.newKey || 'new_companies'] = names; }
        else { data[f.id] = ids[0] ?? null; data[f.newKey || 'new_company'] = names[0] || null; }
        if (f.required && !ids.length && !names.length) missing.push(f.label);
      } else if (f.type === 'currency') {
        const raw = document.getElementById('vf-' + f.id)?.value || '';
        const negative = raw.trim().startsWith('-');
        const digits = raw.replace(/[^\d]/g, '');
        data[f.id] = digits ? (negative ? -1 : 1) * Number(digits) : null;
        if (f.required && !digits) missing.push(f.label);
      } else if (f.type === 'custom') {
        // Nothing to collect — the caller reads its own hand-built section's
        // inputs directly in its onSubmit callback.
      } else {
        const v = document.getElementById('vf-' + f.id)?.value?.trim();
        data[f.id] = v || null;
        if (f.required && !v) missing.push(f.label);
      }
    }
    const errEl = document.getElementById('vf-err');
    if (missing.length) { errEl.textContent = 'Required: ' + missing.join(', '); errEl.style.display = 'block'; return; }
    try {
      await onSubmit(data);
      ov.remove();
      await refresh();
    } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
  };
}

// Merge duplicate jobs (same job #) within a project — COs move to the bid-backed
// job (the real one); the legacy duplicate is deleted. Live, no re-import needed.
async function actMergeDupeJobs(projectId) {
  const d = DETAIL_CACHE[projectId]; if (!d) return;
  const byNum = {};
  d.jobs.forEach(j => { if (j.job_number) (byNum[j.job_number] = byNum[j.job_number] || []).push(j); });
  const groups = Object.values(byNum).filter(g => g.length > 1);
  if (!groups.length) return;
  const total = groups.reduce((s, g) => s + g.length, 0);
  if (!confirm(`Merge ${total} duplicate jobs into ${groups.length}? Change orders move onto the bid-backed job; the duplicates are deleted.`)) return;
  try {
    for (const g of groups) {
      // survivor = the job tied to an awarded bid; else the one with the most COs
      const survivor = g.find(j => j.winning_bid_id) || [...g].sort((a, b) => b.change_orders.length - a.change_orders.length)[0];
      const mergeIds = g.filter(j => j.id !== survivor.id).map(j => j.id);
      await api('POST', '/api/v2/admin/merge-jobs', { survivor_id: survivor.id, merge_ids: mergeIds });
    }
    await refresh();
  } catch (e) { alert('Merge failed: ' + e.message); }
}

// Bring a submitted bid back to active_bid with a fresh due date — for a
// revision/best-and-final round that needs its own deadline and needs to
// show back up on the calendar and estimator dashboard (those only surface
// active_bid-stage bids by due date). Existing submissions are left alone
// as history; log the revised numbers via "+ Add Submission" once ready.
function actReactivateBid(bidId) {
  const b = DETAIL_CACHE[OPEN_PROJECT]?.bids.find(x => x.id === bidId) || {};
  // A bid closed before it ever got a bid # goes back to an opportunity (no
  // due date required there); anything else goes back to active_bid, which
  // does need one so it shows up on the calendar/dashboard again.
  const backToOpportunity = b.stage === 'closed' && !b.bid_number;

function actEditBid(bidId) {

  // easy-to-miss link) — same dedicated add/remove endpoints, just surfaced

  // via a 'custom' placeholder field rather than always at the very bottom.
  const showSubEst = !b.superseded && ['opportunity', 'active_bid', 'submitted'].includes(b.stage);

  if (b.stage !== 'opportunity') {
    fields.push({ id: 'bid_number', label: 'Bid #', type: 'text', required: true, value: b.bid_number });
    fields.push(
      { id: 'estimator_id', label: 'Estimator', type: 'select', emptyLabel: 'TBD', options: teamOpts(['estimator']), value: b.estimator?.id },
      { id: 'salesperson_id', label: 'Salesperson', type: 'select', emptyLabel: 'TBD', options: teamOpts(['sales']), value: b.salesperson?.id },
    );
    if (showSubEst) fields.push({ id: 'sub_est_section', type: 'custom' });
    fields.push(
      { id: 'date_received', label: 'Date Received', type: 'date', value: b.date_received },
      { id: 'due_date', label: 'Due Date', type: 'date', value: b.due_date },
      { id: 'start_date', label: 'Start Date', type: 'date', value: b.start_date },
      { id: 'drawing_stage', label: 'Drawing Stage', type: 'text', value: b.drawing_stage },
    );

    // plus a visible line on the bid card) rather than living buried in here —
    // it's easy to miss as just another field in a long edit form.
  } else if (showSubEst) {
    // Opportunity stage has no estimator/salesperson fields in this form at
    // all (nothing's been assigned yet) — sub-estimators just go first.
    fields.push({ id: 'sub_est_section', type: 'custom' });
  }
  fields.push({ id: 'notes', label: 'Notes', type: 'textarea', value: b.notes });

    fields.push(

  if (showSubEst) {

  container.innerHTML = `<div class="v2-field"><label>Site Contact</label>

async function subEstAdd(bidId) {

// A follow-up can live on a bid, a change order, or a submission — search all
// three rather than needing the caller to know which.
function findFollowup(fuId) {
  const d = DETAIL_CACHE[OPEN_PROJECT];
  if (!d) return null;
  for (const b of d.bids) {
    const f = (b.followups || []).find(x => x.id === fuId); if (f) return f;
    for (const s of (b.submissions || [])) { const sf = (s.followups || []).find(x => x.id === fuId); if (sf) return sf; }
  }
  for (const j of d.jobs) { const f = j.change_orders.flatMap(co => co.followups || []).find(x => x.id === fuId); if (f) return f; }
  return null;
}

// Global entry point (Active Change Orders page) — a CO always requires an
// existing Job, so this is a two-step picker: project, then which of its
// jobs (usually one, but legacy + bid-backed duplicates can leave more than
// one until merged). Falls through to the same actAddCO() form once a job
// is chosen — no duplicated form logic.
// One fuzzy search box across BOTH project name and job # — a PM's change-
// order request rarely uses the exact project name shown in the app, but
// it's very often the job # (or close to it), so matching either field in
// one box gets the coordinator straight to the right job without needing
// to know the project naming convention.
let NCO_JOBS = [];
async function actNewChangeOrder() {
  NCO_JOBS = await api('GET', '/api/v2/jobs-picker');

  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.innerHTML = `
    <div class="v2-modal" style="max-width:460px">
      <div class="v2-modal-hd">+ New Change Order<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">
        <div class="v2-field"><label>Project name or Job #</label>
          <div class="v2-combo">
            <div class="v2-combo-box">
              <input id="vf-nco-jobsearch" class="v2-combo-input" type="text" autocomplete="off" placeholder="Type whatever the PM called it — name or job #…">
            </div>
            <div class="v2-combo-menu" id="cc-nco-jobsearch-menu"></div>
          </div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const input = document.getElementById('vf-nco-jobsearch');
  const menu = document.getElementById('cc-nco-jobsearch-menu');
  const renderMenu = () => {
    const raw = input.value.trim();
    if (!raw) { menu.style.display = 'none'; return; }
    const scored = NCO_JOBS.map(j => {
      const scores = [_projMatchScore(raw, j.project_name), j.job_number ? _projMatchScore(raw, j.job_number) : null].filter(s => s !== null);
      return scores.length ? { j, score: Math.min(...scores) } : null;
    }).filter(Boolean).sort((a, b) => a.score - b.score).slice(0, 8);
    menu.innerHTML = scored.length
      ? scored.map(({ j }) => `<div class="v2-combo-opt" onmousedown="event.preventDefault();ncoPickJob(${j.id})">${esc(j.project_name)} ${j.job_number ? `<span style="color:var(--text-muted)">— Job ${esc(j.job_number)}</span>` : `<span style="color:#d97706">— Job # pending</span>`}</div>`).join('')
      : `<div class="v2-combo-empty">No matching project or job # — a change order needs an existing job (created at bid award, or via "+ Legacy Job")</div>`;
    const box = input.closest('.v2-combo-box');
    const rect = box.getBoundingClientRect();
    menu.style.left = rect.left + 'px'; menu.style.width = rect.width + 'px'; menu.style.top = (rect.bottom + 3) + 'px';
    menu.style.display = 'block';
  };
  input.addEventListener('input', renderMenu);
  input.addEventListener('focus', renderMenu);
  input.addEventListener('blur', () => setTimeout(() => { menu.style.display = 'none'; }, 150));
  setTimeout(() => input.focus(), 30);
}

let HEALTH = null;
// ═══════════════════════════════════════════════════════════════════════════
// HISTORY — audit trail of who did what, when (admin-only, same gate as
// Data Health merges). Most actions aren't safely auto-reversible; "Undo"
// only shows up on the handful of action types the backend actually knows
// how to reverse (due-date changes, sub-estimator add/remove, reminder
// dismiss) — everything else is a record only.
// ═══════════════════════════════════════════════════════════════════════════
async function renderHistory() {
  setActiveNav('history');
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Loading…</div>';
  let rows;
  try { await ensureMeta(); rows = await api('GET', '/api/v2/activity?limit=300'); }
  catch (e) { main.innerHTML = `<div class="err-card" style="margin:20px">${esc(e.message)}</div>`; return; }

  main.innerHTML = `
    <div class="page-header"><div><div class="page-title">🕓 History</div><div class="page-subtitle">${rows.length} recent actions</div></div></div>
    <div class="card" style="padding:0">${rows.length ? rows.map(r => `
      <div class="proj-row" style="cursor:default">
        <div style="flex:1;min-width:0">
          <div class="proj-name" style="font-size:13px;font-weight:600">${esc(r.summary)}${r.undone ? ' <span class="badge" style="background:#e2e8f0;color:#64748b">UNDONE</span>' : ''}</div>
          <div class="proj-meta">${esc(r.actor_name || 'Unknown')} · ${fmtHistoryTs(r.ts)}</div>
        </div>
        ${r.undoable ? `<button class="v2-btn outline" style="flex-shrink:0" onclick="actUndoHistory(${r.id})">↩ Undo</button>` : ''}
      </div>`).join('') : '<div style="padding:24px;text-align:center;color:var(--text-muted)">Nothing logged yet</div>'}</div>`;
}
async function actUndoHistory(id) {
  if (!confirm('Undo this action?')) return;
  try { await api('POST', `/api/v2/activity/${id}/undo`); await renderHistory(); }
  catch (e) { alert('Failed: ' + e.message); }
}

// Merge a duplicate group into the chosen survivor (real FK rewrite, admin only)
async function doMerge(kind, gid) {
  const group = (kind === 'project' ? HEALTH.dupProjects : HEALTH.dupCompanies)[gid];
  if (!group) return;
  const survivor = Number(document.getElementById(`${kind}-surv-${gid}`).value);
  const mergeIds = group.map(it => it.id).filter(id => id !== survivor);
  const keepName = group.find(it => it.id === survivor)?.name;
  if (!confirm(`Merge ${mergeIds.length} ${kind}(s) into "${keepName}"?\n\nThis rewrites the underlying records and cannot be undone (re-run the import to reset).`)) return;
  try {
    await api('POST', `/api/v2/admin/merge-${kind === 'project' ? 'projects' : 'companies'}`, { survivor_id: survivor, merge_ids: mergeIds });
    await showHealth();   // refresh the punch-list
  } catch (e) { alert('Merge failed: ' + e.message); }
}

// Mark a group as "not a duplicate" so it never re-clusters
async function doDismiss(kind, gid) {
  const group = (kind === 'project' ? HEALTH.dupProjects : HEALTH.dupCompanies)[gid];
  if (!group) return;
  try {
    await api('POST', '/api/v2/admin/dismiss-duplicate', { kind, ids: group.map(it => it.id) });
    await showHealth();
  } catch (e) { alert(e.message); }
}

// Delete every bid in a duplicate-bid group except the one chosen to keep.
async function doDeleteDupBids(gi) {
  const group = HEALTH.dupBids[gi];
  if (!group) return;
  const keepId = Number(document.getElementById(`dupbid-keep-${gi}`).value);
  const toDelete = group.bids.map(b => b.id).filter(id => id !== keepId);
  if (!toDelete.length) return;
  if (!confirm(`Delete ${toDelete.length} duplicate bid(s) (#${toDelete.join(', #')}), keeping #${keepId}?\n\nThis cannot be undone.`)) return;
  const errors = [];
  for (const id of toDelete) {
    try { await api('DELETE', `/api/v2/admin/bid/${id}`); }
    catch (e) { errors.push(`#${id}: ${e.message}`); }
  }
  if (errors.length) alert('Some deletions failed:\n' + errors.join('\n'));
  await showHealth();
}

// Renumber a change order's RFC/CO # (used to resolve a label collision that
// isn't actually a duplicate — the far more common case in real data).
async function renameCO(id) {
  const next = prompt('New RFC/CO #:');
  if (next == null || !next.trim()) return;
  try {
    await api('PATCH', `/api/v2/admin/change_order/${id}`, { co_number: next.trim() });
    await showHealth();
  } catch (e) { alert('Renumber failed: ' + e.message); }
}

// Delete a duplicate change order — only offered for active_co stage (see card copy).
async function doDeleteCO(id) {
  if (!confirm(`Delete change order #${id}? Only do this if it's truly a double-submit, not a genuine second CO that collided on a number.\n\nThis cannot be undone.`)) return;
  try {
    await api('DELETE', `/api/v2/admin/change-order/${id}`);
    await showHealth();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// Merge a duplicate-contacts group into the chosen survivor.
async function doMergeDupContacts(gi) {
  const group = HEALTH.dupContacts[gi];
  if (!group) return;
  const keepId = Number(document.getElementById(`dupcontact-keep-${gi}`).value);
  const mergeIds = group.contacts.map(c => c.id).filter(id => id !== keepId);
  if (!mergeIds.length) return;
  if (!confirm(`Merge ${mergeIds.length} contact(s) into #${keepId}?\n\nThis cannot be undone.`)) return;
  try {
    await api('POST', '/api/v2/admin/merge-contacts', { survivor_id: keepId, merge_ids: mergeIds });
    await showHealth();
  } catch (e) { alert('Merge failed: ' + e.message); }
}

// Mark a duplicate-contacts group as "not a duplicate" so it never re-clusters
async function doDismissContacts(gi) {
  const group = HEALTH.dupContacts[gi];
  if (!group) return;
  try {
    await api('POST', '/api/v2/admin/dismiss-duplicate', { kind: 'contact', ids: group.contacts.map(c => c.id) });
    await showHealth();
  } catch (e) { alert(e.message); }
}

// Merge a duplicate-jobs group into the chosen survivor.
async function doMergeDupJobs(gi) {
  const group = HEALTH.dupJobs[gi];
  if (!group) return;
  const keepId = Number(document.getElementById(`dupjob-keep-${gi}`).value);
  const mergeIds = group.jobs.map(j => j.id).filter(id => id !== keepId);
  if (!mergeIds.length) return;
  if (!confirm(`Merge ${mergeIds.length} job(s) into #${keepId}? Their change orders move to the survivor.\n\nThis cannot be undone.`)) return;
  try {
    await api('POST', '/api/v2/admin/merge-jobs', { survivor_id: keepId, merge_ids: mergeIds });
    await showHealth();
  } catch (e) { alert('Merge failed: ' + e.message); }
}

// Delete a company with zero activity anywhere.
async function doDeleteEmptyCompany(id) {
  if (!confirm('Delete this company? (Only allowed when it has no bids, contacts, or awards attached.)')) return;
  try {
    await api('DELETE', `/api/v2/admin/company/${id}`);
    await showHealth();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// Inline rename (project or company) via the admin edit route
async function renameEntity(kind, id) {
  const next = prompt(`New ${kind} name:`);
  if (next == null || !next.trim()) return;
  try {
    await api('PATCH', `/api/v2/admin/${kind}/${id}`, { name: next.trim() });
    if (typeof HEALTH === 'object') await showHealth();
  } catch (e) { alert('Rename failed: ' + e.message); }
}

// Undo a saved cleanup override (stops it replaying; re-import to fully revert)
async function undoOverride(id) {
  if (!confirm('Undo this saved cleanup? It will no longer replay on import.\n\n(For merges/renames, re-run the import to fully revert the live data; "not a duplicate" reverts immediately.)')) return;
  try {
    const r = await api('DELETE', `/api/v2/admin/override/${id}`);
    await showHealth();
    if (!r.live_reverted) alert('Removed. Re-run the import to fully revert the affected records.');
  } catch (e) { alert(e.message); }
}

// Delete a truly-empty project (no bids, no jobs, no COs)
async function deleteEmptyProject(id) {
  if (!confirm('Delete this empty project? (Only allowed when nothing is attached.)')) return;
  try {
    await api('DELETE', `/api/v2/admin/project/${id}`);
    await showHealth();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// CONTACTS — directory, profile modal (bid history + stats), company profile.
// Contact.company_id is a real FK (v1's Contact.company was free text), so
// company links and stats here are exact instead of string-matched.
// ═══════════════════════════════════════════════════════════════════════════
let CONTACTS_STATE = { rows: [], q: '', companyId: '', noCompany: false, sortKey: 'full_name', sortDir: 1 };
let VENDORS_STATE = { rows: [], q: '', category: '', selected: new Set() };

// ── Vendor directory — Contacts tagged with vendor_categories/brands. Same
// underlying list as Contacts, filtered down and re-shown with category and
// brand front-and-center (e.g. "who can I call for Silent Knight?"). ───────
async function renderVendors() {

  try { await ensureMeta(); VENDORS_STATE.rows = await api('GET', '/api/v2/vendors'); }

function onVendorsFilterChange() {
  VENDORS_STATE.q = document.getElementById('vd-q')?.value || '';
  VENDORS_STATE.category = document.getElementById('vd-category')?.value || '';
  renderVendorsBody();
}
// Switching categories almost certainly means "I'm done with that vendor
// type" — carrying a stale selection across to a new category (e.g. Fire
// Alarm vendors still checked while looking at Lighting) silently inflates
// the RFQ recipient count with vendors no longer visible on screen.
function onVendorsCategoryChange() {
  VENDORS_STATE.selected = new Set();
  onVendorsFilterChange();
}
function clearVendorsFilters() {
  VENDORS_STATE.q = ''; VENDORS_STATE.category = ''; VENDORS_STATE.selected = new Set();
  renderVendors();
}
function toggleVendorSelected(id, checked) {
  if (checked) VENDORS_STATE.selected.add(id); else VENDORS_STATE.selected.delete(id);
  renderVendorsRfqBar();
}
function toggleVendorSelectAll(checked, visibleIds) {
  visibleIds.forEach(id => { if (checked) VENDORS_STATE.selected.add(id); else VENDORS_STATE.selected.delete(id); });
  renderVendorsBody();
}
function renderVendorsRfqBar() {
  const n = VENDORS_STATE.selected.size;
  document.getElementById('vd-rfq-bar').innerHTML = n ? `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 16px;background:#eff6ff;border-bottom:1px solid var(--border)">
      <span style="font-size:12px;font-weight:600">${n} vendor${n === 1 ? '' : 's'} selected</span>
      <button class="v2-btn blue" style="font-size:12px;padding:4px 10px" onclick="openRfqModal()">✉️ Generate RFQ Email</button>
      <span class="clear-link" onclick="toggleVendorSelectAll(false, [...VENDORS_STATE.selected]);renderVendorsRfqBar()">Clear selection</span>
    </div>` : '';
}
function renderVendorsBody() {
  const { rows, q, category, selected } = VENDORS_STATE;
  let out = rows;
  if (category) out = out.filter(c => c.vendor_categories.includes(category));
  if (q.trim()) {
    const n = q.trim().toLowerCase();
    out = out.filter(c => [c.full_name, c.email, c.phone, c.company?.name, ...c.brands].some(f => f && String(f).toLowerCase().includes(n)));
  }
  document.getElementById('vd-count').textContent = `${out.length} of ${rows.length} vendor contacts`;
  renderVendorsRfqBar();

  const tagPill = (t, bg, fg) => `<span class="badge" style="background:${bg};color:${fg};font-size:10px;margin:1px">${esc(t)}</span>`;
  const visibleIds = out.map(c => c.id);
  const allVisibleSelected = visibleIds.length && visibleIds.every(id => selected.has(id));

  document.getElementById('vd-body').innerHTML = out.length ? `
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:1px solid var(--border)">
        <th style="padding:8px 8px 8px 16px"><input type="checkbox" ${allVisibleSelected ? 'checked' : ''} onchange="toggleVendorSelectAll(this.checked, ${JSON.stringify(visibleIds)})" title="Select all filtered"></th>
        <th style="text-align:left;padding:8px 16px;color:var(--text-muted);font-weight:600;font-size:11px">Company</th>
        <th style="text-align:left;padding:8px 16px;color:var(--text-muted);font-weight:600;font-size:11px">Name</th>
        <th style="text-align:left;padding:8px 16px;color:var(--text-muted);font-weight:600;font-size:11px">Categories</th>
        <th style="text-align:left;padding:8px 16px;color:var(--text-muted);font-weight:600;font-size:11px">Brands</th>
        <th style="text-align:left;padding:8px 16px;color:var(--text-muted);font-weight:600;font-size:11px">Phone</th>
        <th style="text-align:left;padding:8px 16px;color:var(--text-muted);font-weight:600;font-size:11px">Email</th>
      </tr></thead>
      <tbody>${out.map(c => `
        <tr style="border-bottom:1px solid #f1f5f9">
          <td style="padding:8px 8px 8px 16px"><input type="checkbox" ${selected.has(c.id) ? 'checked' : ''} ${c.email ? '' : 'disabled title="No email on file"'} onchange="toggleVendorSelected(${c.id}, this.checked)"></td>
          <td style="padding:8px 16px">${c.company ? `<a href="#" onclick="event.preventDefault();openCompanyProfile(${c.company.id})" style="color:#2563eb;text-decoration:none;font-weight:600">${esc(c.company.name)}</a>` : '<span style="color:var(--text-muted)">—</span>'}</td>
          <td style="padding:8px 16px"><a href="#" onclick="event.preventDefault();openContactProfile(${c.id})" style="color:inherit;text-decoration:none">${esc(c.full_name)}</a>${c.title ? `<div style="font-size:11px;color:var(--text-muted)">${esc(c.title)}</div>` : ''}</td>
          <td style="padding:8px 16px">${c.vendor_categories.map(v => tagPill(v, '#e0e7ff', '#3730a3')).join(' ')}</td>
          <td style="padding:8px 16px">${c.brands.length ? c.brands.map(b => tagPill(b, '#dcfce7', '#166534')).join(' ') : '<span style="color:var(--text-muted)">—</span>'}</td>
          <td style="padding:8px 16px">${c.phone ? esc(c.phone) : '<span style="color:var(--text-muted)">—</span>'}</td>
          <td style="padding:8px 16px">${c.email ? `<a href="mailto:${esc(c.email)}" style="color:#2563eb">${esc(c.email)}</a>` : '<span style="color:var(--text-muted)">—</span>'}</td>
        </tr>`).join('')}</tbody>
    </table>` : '<div style="padding:24px;text-align:center;color:var(--text-muted)">No vendor contacts match — tag a contact with a Vendor Category from its edit form to have it show up here.</div>';
}

// ── RFQ email generator — check vendors on the Vendors page, optionally
// link a bid to pull project/bid #/due date into the template, then hand
// off to the user's own mail client (mailto:) with everyone BCC'd so no
// vendor sees who else got the same request. Never sends anything itself —
// the user still reviews, attaches plans, and hits send in Outlook.
let RFQ_STATE = { vendors: [], bid: null };
let RFQ_BID_RESULTS = [];
function rfqDefaultSubject(bid) {
  return bid ? `RFQ – ${bid.project}${bid.bid_number ? ' – ' + bid.bid_number : ''}` : 'Request for Quote';
}
function rfqDefaultBody(bid) {
  const project = bid ? bid.project : '[PROJECT]';
  // Vendor-facing due date is 1 working day before OUR due date (see
  // getSearchResults' vendor_due_date) — time to actually work their quotes
  // into the bid, not the same day we have to submit.
  const due = bid && bid.vendor_due_date ? fmtD(bid.vendor_due_date) : '[DUE DATE]';
  return `Good afternoon,\n\nCould you provide pricing for the attached plans/specs for ${project}? Plans & specs: [ADD LINK OR ATTACH FILES]\n\nI would need a quote back by ${due}.\n\nLet me know if there are any questions.\n\nThanks!\n${CURRENT_USER?.name || ''}`;
}
function openRfqModal() {
  const vendors = VENDORS_STATE.rows.filter(c => VENDORS_STATE.selected.has(c.id) && c.email);
  const skipped = VENDORS_STATE.selected.size - vendors.length;
  if (!vendors.length) { alert('None of the selected vendors have an email on file.'); return; }
  RFQ_STATE = { vendors, bid: null };

  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.innerHTML = `
    <div class="v2-modal" style="max-width:560px;max-height:88vh;overflow-y:auto">
      <div class="v2-modal-hd">✉️ Generate RFQ Email<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">
        <div class="v2-field">
          <label>Vendors — BCC'd (${vendors.length})${skipped ? ` <span style="font-weight:400;color:#d97706">· ${skipped} skipped, no email on file</span>` : ''}</label>
          <div style="font-size:12px;color:var(--text-muted);line-height:1.6;max-height:100px;overflow-y:auto">${vendors.map(v => `${esc(v.company?.name || '—')} — ${esc(v.email)}`).join('<br>')}</div>
        </div>
        <div class="v2-field" style="position:relative">
          <label>Link to a Bid <span style="font-weight:400;color:var(--text-muted)">(optional — fills in project/bid #/due date below)</span></label>
          <input id="rfq-bid-search" type="text" autocomplete="off" placeholder="Search bid # or project name…" oninput="onRfqBidSearch()">
          <div id="rfq-bid-menu" style="position:absolute;left:0;right:0;z-index:20;background:var(--card-bg,#fff);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.1);display:none;max-height:220px;overflow-y:auto"></div>
          <div id="rfq-bid-chip" style="margin-top:6px"></div>
        </div>
        <div class="v2-field"><label>Subject</label><input id="rfq-subject" type="text" value="${esc(rfqDefaultSubject(null))}"></div>
        <div class="v2-field"><label>Body</label><textarea id="rfq-body" rows="8">${esc(rfqDefaultBody(null))}</textarea></div>
        <div style="font-size:11px;color:var(--text-muted)">Opens your default mail app with these vendors BCC'd — attach plans/specs and make any final edits before sending. mailto links can't carry attachments.</div>
      </div>
      <div class="v2-modal-ft">
        <button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">Cancel</button>
        <button class="v2-btn outline" onclick="copyRfqBcc()">📋 Copy BCC List</button>
        <button class="v2-btn blue" onclick="openRfqMailto()">Open in Outlook →</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
}
let RFQ_BID_SEARCH_TIMER = null;
function onRfqBidSearch() {
  clearTimeout(RFQ_BID_SEARCH_TIMER);
  const q = document.getElementById('rfq-bid-search')?.value.trim();
  const menu = document.getElementById('rfq-bid-menu');
  if (!q || q.length < 2) { menu.innerHTML = ''; menu.style.display = 'none'; return; }
  RFQ_BID_SEARCH_TIMER = setTimeout(async () => {
    let res;
    try { res = await api('GET', '/api/v2/search?q=' + encodeURIComponent(q)); } catch { return; }
    RFQ_BID_RESULTS = (res.bids || []).slice(0, 8);
    menu.innerHTML = RFQ_BID_RESULTS.length ? RFQ_BID_RESULTS.map((b, i) => `
      <div onclick="selectRfqBid(${i})" style="padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #f1f5f9" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">
        <strong>${esc(b.bid_number || '(no #)')}</strong> — ${esc(b.project)}
      </div>`).join('') : '<div style="padding:8px 10px;font-size:13px;color:var(--text-muted)">No matches</div>';
    menu.style.display = 'block';
  }, 200);
}
function selectRfqBid(i) {
  const bid = RFQ_BID_RESULTS[i];
  RFQ_STATE.bid = bid;
  document.getElementById('rfq-bid-menu').style.display = 'none';
  document.getElementById('rfq-bid-search').value = '';
  document.getElementById('rfq-bid-chip').innerHTML = `<span class="badge" style="background:#e0e7ff;color:#3730a3;font-size:11px;padding:3px 8px">${esc(bid.bid_number || '(no #)')} — ${esc(bid.project)} <a href="#" onclick="event.preventDefault();clearRfqBid()" style="margin-left:6px;color:#3730a3;text-decoration:none">✕</a></span>`;
  document.getElementById('rfq-subject').value = rfqDefaultSubject(bid);
  document.getElementById('rfq-body').value = rfqDefaultBody(bid);
}
function clearRfqBid() {
  RFQ_STATE.bid = null;
  document.getElementById('rfq-bid-chip').innerHTML = '';
  document.getElementById('rfq-subject').value = rfqDefaultSubject(null);
  document.getElementById('rfq-body').value = rfqDefaultBody(null);
}
function copyRfqBcc() {
  const emails = RFQ_STATE.vendors.map(v => v.email).join('; ');
  navigator.clipboard.writeText(emails)
    .then(() => alert('BCC list copied — paste into the BCC field in Outlook.'))
    .catch(() => alert('Could not copy automatically — select and copy manually:\n\n' + emails));
}
function openRfqMailto() {
  const subject = document.getElementById('rfq-subject')?.value || '';
  const body = document.getElementById('rfq-body')?.value || '';
  const bcc = RFQ_STATE.vendors.map(v => v.email).join(',');
  const mailto = `mailto:?bcc=${encodeURIComponent(bcc)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if (mailto.length > 1900 && !confirm('This link is long and some mail clients may truncate it. Continue, or Cancel and use "Copy BCC List" to paste the addresses manually instead?')) return;
  window.location.href = mailto;
}

function sortContacts(key) {
  if (CONTACTS_STATE.sortKey === key) CONTACTS_STATE.sortDir *= -1;
  else { CONTACTS_STATE.sortKey = key; CONTACTS_STATE.sortDir = 1; }
  renderContactsBody();
}

async function renderContacts() {
  setActiveNav('contacts');
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Loading…</div>';
  try { await ensureMeta(); CONTACTS_STATE.rows = await api('GET', '/api/v2/contacts'); }
  catch (e) { main.innerHTML = `<div class="err-card" style="margin:20px">${esc(e.message)}</div>`; return; }

  main.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">👤 Contacts</div><div class="page-subtitle" id="ct-count">${CONTACTS_STATE.rows.length} contacts</div></div>
      <div style="display:flex;gap:8px">
        <button class="v2-btn outline" onclick="actNewCompany()">+ New Company</button>

      </div>
    </div>
    <div class="card" style="padding:0">
      <div class="v2-filterbar">
        <input type="text" id="ct-q" placeholder="Search name, email, phone, company…" value="${esc(CONTACTS_STATE.q)}" oninput="onContactsFilterChange()">
        <select id="ct-company" onchange="onContactsFilterChange()">
          <option value="">All companies</option>
          ${META.companies.map(c => `<option value="${c.id}" ${String(c.id) === CONTACTS_STATE.companyId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
        </select>
        <label class="mine"><input type="checkbox" id="ct-nocompany" ${CONTACTS_STATE.noCompany ? 'checked' : ''} onchange="onContactsFilterChange()"> No company</label>
        <span class="clear-link" onclick="clearContactsFilters()">Clear</span>

}
function onContactsFilterChange() {
  CONTACTS_STATE.q = document.getElementById('ct-q')?.value || '';
  CONTACTS_STATE.companyId = document.getElementById('ct-company')?.value || '';
  CONTACTS_STATE.noCompany = !!document.getElementById('ct-nocompany')?.checked;

}
function clearContactsFilters() {
  CONTACTS_STATE.q = ''; CONTACTS_STATE.companyId = ''; CONTACTS_STATE.noCompany = false;
  renderContacts();
}
function renderContactsBody() {
  const { rows, q, companyId, noCompany } = CONTACTS_STATE;
  let out = rows;
  if (companyId) out = out.filter(c => String(c.company_id) === companyId);
  if (noCompany) out = out.filter(c => !c.company_id);
  if (q.trim()) { const n = q.trim().toLowerCase(); out = out.filter(c => [c.full_name, c.email, c.phone, c.company?.name].some(f => f && String(f).toLowerCase().includes(n))); }

  document.getElementById('ct-count').textContent = `${out.length} of ${rows.length} contacts`;

  // Flat, sortable table (v1's layout) — company grouping is left to the
  // search/filter above instead of visually clustering rows. Click a header
  // to sort by it; click again to reverse.
  const { sortKey, sortDir } = CONTACTS_STATE;
  const sortVal = (c, key) => key === 'company' ? (c.company?.name || '') : (c[key] || '');
  out = [...out].sort((a, b) => sortDir * String(sortVal(a, sortKey)).localeCompare(String(sortVal(b, sortKey))));

  const th = (label, key) => `<th style="text-align:left;padding:8px 16px;color:var(--text-muted);font-weight:600;font-size:11px;cursor:pointer;user-select:none" onclick="sortContacts('${key}')">${label}${sortKey === key ? (sortDir === 1 ? ' ▲' : ' ▼') : ''}</th>`;

  document.getElementById('ct-body').innerHTML = out.length ? `
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:1px solid var(--border)">
        ${th('Name', 'full_name')}
        ${th('Position', 'title')}
        ${th('Company', 'company')}
        ${th('Phone', 'phone')}
        ${th('Email', 'email')}
      </tr></thead>
      <tbody>${out.map(c => `
        <tr style="border-bottom:1px solid #f1f5f9">
          <td style="padding:8px 16px"><a href="#" onclick="event.preventDefault();openContactProfile(${c.id})" style="font-weight:600;color:inherit;text-decoration:none">${esc(c.full_name)}</a></td>
          <td style="padding:8px 16px">${c.title ? esc(c.title) : '<span style="color:var(--text-muted)">—</span>'}</td>
          <td style="padding:8px 16px">${c.company ? `<a href="#" onclick="event.preventDefault();openCompanyProfile(${c.company.id})" style="color:#2563eb;text-decoration:none">${esc(c.company.name)}</a>` : '<span style="color:var(--text-muted)">—</span>'}</td>
          <td style="padding:8px 16px">${c.phone ? esc(c.phone) : '<span style="color:var(--text-muted)">—</span>'}</td>
          <td style="padding:8px 16px">${c.email ? `<a href="mailto:${esc(c.email)}" style="color:#2563eb">${esc(c.email)}</a>` : '<span style="color:var(--text-muted)">—</span>'}</td>
        </tr>`).join('')}</tbody>
    </table>` : '<div style="padding:24px;text-align:center;color:var(--text-muted)">No matches</div>';

// ── Reports — trends over opportunities/bids/COs/jobs + per-job lessons
// learned (CO growth vs original award). Every rollup is computed server-side
// in getReports() (v2/db.js); this page is just filters + Chart.js. ────────
let REPORTS_STATE = { preset: 'ytd', from: null, to: null, granularity: 'month', personId: '' };
let REPORTS_CHARTS = {};

function reportsRangeForPreset(preset) {
  const now = new Date(today + 'T00:00:00Z');
  const y = now.getUTCFullYear();
  const iso = (dt) => dt.toISOString().split('T')[0];
  const pad = (n) => String(n).padStart(2, '0');
  if (preset === 'week') {
    const day = (now.getUTCDay() + 6) % 7;
    const monday = new Date(now); monday.setUTCDate(now.getUTCDate() - day);
    return { from: iso(monday), to: today };
  }
  if (preset === 'month') return { from: `${y}-${pad(now.getUTCMonth() + 1)}-01`, to: today };
  if (preset === 'quarter') { const startMonth = Math.floor(now.getUTCMonth() / 3) * 3 + 1; return { from: `${y}-${pad(startMonth)}-01`, to: today }; }
  if (preset === 'year') return { from: `${y}-01-01`, to: `${y}-12-31` };
  if (preset === 'ytd') return { from: `${y}-01-01`, to: today };
  if (preset === 'all') return { from: null, to: null };
  return { from: REPORTS_STATE.from, to: REPORTS_STATE.to }; // custom
}

function onReportsPresetChange() {
  REPORTS_STATE.preset = document.getElementById('rp-preset').value;
  const suggested = { week: 'week', month: 'week', quarter: 'week', year: 'month', ytd: 'month', all: 'year', custom: REPORTS_STATE.granularity }[REPORTS_STATE.preset];
  REPORTS_STATE.granularity = suggested;
  if (REPORTS_STATE.preset === 'custom' && !REPORTS_STATE.from) {
    const r = reportsRangeForPreset('ytd'); REPORTS_STATE.from = r.from; REPORTS_STATE.to = r.to;
  }
  renderReports();
}
function onReportsCustomDateChange() {
  REPORTS_STATE.from = document.getElementById('rp-from')?.value || null;
  REPORTS_STATE.to = document.getElementById('rp-to')?.value || null;
  loadReportsData();
}
function onReportsFilterChange() {
  REPORTS_STATE.granularity = document.getElementById('rp-granularity')?.value || 'month';
  REPORTS_STATE.personId = document.getElementById('rp-person')?.value || '';
  loadReportsData();
}
function clearReportsFilters() {
  REPORTS_STATE = { preset: 'ytd', from: null, to: null, granularity: 'month', personId: '' };
  renderReports();
}
async function loadReportsData() {
  const range = REPORTS_STATE.preset === 'custom' ? { from: REPORTS_STATE.from, to: REPORTS_STATE.to } : reportsRangeForPreset(REPORTS_STATE.preset);
  const params = new URLSearchParams();
  if (range.from) params.set('from', range.from);
  if (range.to) params.set('to', range.to);
  params.set('granularity', REPORTS_STATE.granularity);
  if (REPORTS_STATE.personId) params.set('personId', REPORTS_STATE.personId);
  let data;
  try { data = await api('GET', `/api/v2/reports?${params.toString()}`); }
  catch (e) { document.getElementById('rp-body').innerHTML = `<div class="err-card">${esc(e.message)}</div>`; return; }
  renderReportsBody(data);
}
function renderReportsBody(data) {

  const body = document.getElementById('rp-body');
  body.innerHTML = `

      ${card('Active Bids', summary.activeBids.count)}

      ${card('Awarded', summary.awarded.count, fmt$(summary.awarded.value), '#16a34a')}
      ${card('Not Awarded', summary.notAwarded.count, null, '#dc2626')}
      ${card('Still Pending', summary.pending.count, null, '#d97706')}
      ${card('Closed', summary.closed.count, null, 'var(--text-muted)')}
      ${card('Win Rate', summary.winRate == null ? '—' : summary.winRate + '%')}
      ${card('Approved COs', summary.approvedCOs.count, fmt$(summary.approvedCOs.value))}
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin:-10px 0 16px 2px">Submitted / Awarded / Not Awarded / Still Pending / Closed are all the same cohort — bids submitted in this range — broken down by how they turned out (regardless of how long the decision took, or whether it happened before it was ever decided). They always add up to Submitted.</div>
    <div class="card" style="padding:16px;margin-bottom:16px">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px">Bid Volume Over Time</div>
      ${timeSeries.length ? `<div style="overflow-x:auto"><div style="min-width:${Math.max(600, timeSeries.length * 70)}px;height:280px"><canvas id="rp-chart-timeseries"></canvas></div></div>`
        : '<div style="color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center">No submitted activity in this range.</div>'}
    </div>
    <div class="card" style="padding:16px;margin-bottom:16px">
      <div style="font-weight:700;font-size:13px;margin-bottom:4px">By Customer</div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">Awarded/Not Awarded are outcomes of the same bids counted in Submitted for this range — not a separately-dated event.</div>
      ${byCustomer.length ? `<div style="height:${Math.max(180, Math.min(byCustomer.length, 10) * 34)}px;margin-bottom:16px"><canvas id="rp-chart-customer"></canvas></div>` : ''}
      <div style="overflow-x:auto">${byCustomerTableHtml(byCustomer)}</div>
    </div>
    <div class="card" style="padding:16px">
      <div style="font-weight:700;font-size:13px;margin-bottom:4px">By Job — Lessons Learned</div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">Approved change-order dollars as a share of the original awarded bid — which jobs grew in scope after award.</div>
      <div style="overflow-x:auto">${byJobTableHtml(byJob)}</div>
    </div>`;

  Object.values(REPORTS_CHARTS).forEach(c => c.destroy());
  REPORTS_CHARTS = {};

  if (timeSeries.length) {
    // Stacked so bar height = total Submitted $ for that bucket, split by
    // how those same bids turned out — never a separate/contradicting bar.
    REPORTS_CHARTS.timeseries = new Chart(document.getElementById('rp-chart-timeseries'), {
      type: 'bar',
      data: {
        labels: timeSeries.map(t => t.label),
        datasets: [
          { label: 'Awarded', data: timeSeries.map(t => t.awardedValue), backgroundColor: '#16a34a', stack: 's' },
          { label: 'Not Awarded', data: timeSeries.map(t => t.notAwardedValue), backgroundColor: '#dc2626', stack: 's' },
          { label: 'Still Pending', data: timeSeries.map(t => t.pendingValue), backgroundColor: '#fbbf24', stack: 's' },
          { label: 'Closed', data: timeSeries.map(t => t.closedValue), backgroundColor: '#94a3b8', stack: 's' },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
        scales: { x: { stacked: true }, y: { stacked: true, ticks: { callback: v => fmt$(v) } } },
      },

  }
  if (byCustomer.length) {
    const top = byCustomer.slice(0, 10);

        scales: { x: { ticks: { callback: v => fmt$(v) } } },
      },
    });

async function actRemoveBidCustomer(bidCustomerId, name) {

// ═══════════════════════════════════════════════════════════════════════════
// IMPORT BID FROM JIS (Job Information Sheet) — upload → preview → apply.
// The preview never writes anything; matches against existing team/company/
// contact records are shown for review, then Apply performs the actual
// create-or-enrich (v2/jis.js on the backend).
// ═══════════════════════════════════════════════════════════════════════════
let JIS_PREVIEW = null;

// targetBidId: if set, this is "Start Bid" on an existing opportunity —
// the JIS's fields get applied onto that bid (startBid) instead of
// creating a brand-new one (createDirectBid). See renderJISReview's third
// mode below.
function actImportJIS(targetBidId) {
  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.innerHTML = `
    <div class="v2-modal" style="max-width:420px">
      <div class="v2-modal-hd">📄 ${targetBidId ? 'Start Bid from JIS' : 'Import Bid from JIS'}<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">
        <p style="font-size:13px;color:var(--text-muted);margin:0">Upload a filled-out Job Information Sheet (.xlsx). Its "Title Sheet" tab will be read and matched against existing projects, team members, companies, and contacts — nothing is saved until you review and confirm.</p>
        <input type="file" id="jis-file-input" accept=".xlsx" style="font-size:13px">
        <div id="jis-upload-err" style="color:#dc2626;font-size:12px;display:none"></div>
      </div>
      <div class="v2-modal-ft">
        <button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">Cancel</button>
        <button class="v2-btn amber" id="jis-upload-btn">Read File →</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  document.getElementById('jis-upload-btn').onclick = async () => {
    const input = document.getElementById('jis-file-input');
    const errEl = document.getElementById('jis-upload-err');
    if (!input.files.length) { errEl.textContent = 'Choose a file first'; errEl.style.display = 'block'; return; }
    const file = input.files[0];
    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const preview = await api('POST', '/api/v2/jis/preview', { file_base64: base64 });
      JIS_PREVIEW = preview;
      ov.remove();
      renderJISReview(preview, targetBidId);
    } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
  };
}

function renderJISReview(p, targetBidId) {
  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';

  // Three modes: starting an existing opportunity from a JIS (targetBidId
  // set from the "Start Bid" choice menu's "Import from a JIS file" option),
  // enriching a bid # the JIS matched by coincidence, or creating a
  // brand-new bid from scratch.
  const startingExisting = !!targetBidId;
  const isNewBid = !p.existing_bid && !startingExisting;
  const editableFields = isNewBid || startingExisting;
  const bidBanner = startingExisting
    ? `<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#1e40af">Starting this opportunity as an active bid, using the details pulled from this JIS.</div>`

        This bid # already exists (<strong>${esc(p.existing_bid.bid_number)}</strong>, stage: ${STAGE[p.existing_bid.stage] || p.existing_bid.stage}) — this will <strong>enrich</strong> it (address, drawings, GC companies/contacts) without touching its stage, estimator, or due date.

    : `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#92400e">No existing bid found for # <strong>${esc(p.bid_number || '(none parsed)')}</strong> — a new bid will be created.</div>`;

    <div class="v2-field"><label>Project</label>

        <div class="v2-combo-box"><span id="cc-jis_project-chips"></span>
          <input id="vf-jis_project" class="v2-combo-input" type="text" autocomplete="off" placeholder="Type project name…" value="${esc(p.job_name || '')}">
        </div>
        <div class="v2-combo-menu" id="cc-jis_project-menu"></div>
      </div>

  const teamField = (label, jisInfo, fieldId) => editableFields ? `
    <div class="v2-field"><label>${label}${jisInfo.jis_name ? ` <span style="font-weight:400;color:var(--text-muted)">(JIS: ${esc(jisInfo.jis_name)})</span>` : ''}</label>
      <select id="vf-${fieldId}">
        <option value="">TBD</option>
        ${teamOpts().map(o => `<option value="${o.value}" ${jisInfo.matched?.id === o.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
      </select>
    </div>` : '';

  const gcCard = (gc, i) => `
    <div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:8px">
      <div style="font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        🏢 ${esc(gc.jis_name)}
        ${gc.matched_company ? `<span class="badge" style="background:#dcfce7;color:#16a34a">✓ matches existing</span>` : `<span class="badge" style="background:#fef3c7;color:#b45309">🆕 will create</span>`}
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px">
        ${[gc.street, [gc.city, gc.state, gc.zip].filter(Boolean).join(', ')].filter(Boolean).join(' · ')}
        ${gc.phone ? ` · ${esc(gc.phone)}` : ''}
      </div>
      ${gc.poc ? `<div style="font-size:12px;margin-top:5px;padding-top:5px;border-top:1px solid var(--border)">
        👤 ${esc(gc.poc.jis_name)} ${gc.poc.matched_contact ? `<span class="badge" style="background:#dcfce7;color:#16a34a;font-size:10px">✓ existing contact</span>` : `<span class="badge" style="background:#fef3c7;color:#b45309;font-size:10px">🆕 new contact</span>`}
        <div style="color:var(--text-muted)">${gc.poc.phone ? esc(gc.poc.phone) : ''}${gc.poc.phone && gc.poc.email ? ' · ' : ''}${gc.poc.email ? esc(gc.poc.email) : ''}</div>
      </div>` : ''}

        <div class="v2-field"><label>Due Date</label><input id="vf-jis_due_date" type="date" value="${esc(p.due_date || '')}" ${editableFields ? '' : 'disabled'}></div>

        <div class="v2-field"><label>Job Address</label>
          <input id="vf-jis_street" type="text" placeholder="Street" value="${esc(p.address?.street || '')}" style="margin-bottom:6px">
          <div style="display:flex;gap:6px">
            <input id="vf-jis_city" type="text" placeholder="City" value="${esc(p.address?.city || '')}" style="flex:2">

      </div>
    </div>`;
  document.body.appendChild(ov);

  if (isNewBid) initCombos(ov, [{ id: 'jis_project', type: 'project', multi: false, options: projectOpts(), value: null }]);

  document.getElementById('jis-apply-btn').onclick = async () => {
    const errEl = document.getElementById('jis-apply-err');
    const payload = {
      bid_number: document.getElementById('vf-jis_bid_number')?.value?.trim() || p.bid_number,
      due_date: document.getElementById('vf-jis_due_date')?.value || p.due_date,

        zip: document.getElementById('vf-jis_zip')?.value?.trim() || null,

      gcs: p.gcs.map(gc => ({

        poc: gc.poc ? { contact_id: gc.poc.matched_contact?.id || null, jis_name: gc.poc.jis_name, phone: gc.poc.phone, email: gc.poc.email } : null,
      })),
    };
    if (startingExisting) {
      payload.target_bid_id = targetBidId;
      payload.estimator_id = document.getElementById('vf-jis_estimator')?.value || null;
      payload.salesperson_id = document.getElementById('vf-jis_salesperson')?.value || null;
      if (!payload.bid_number) { errEl.textContent = 'Bid # is required'; errEl.style.display = 'block'; return; }
    } else if (isNewBid) {
      const sel = COMBO_STATE['jis_project'] || [];
      payload.project_id = sel[0]?.id || null;
      payload.project_name = sel[0] && !sel[0].id ? sel[0].name : null;
      if (!payload.project_id && !payload.project_name) { errEl.textContent = 'Project is required'; errEl.style.display = 'block'; return; }
      payload.estimator_id = document.getElementById('vf-jis_estimator')?.value || null;
      payload.salesperson_id = document.getElementById('vf-jis_salesperson')?.value || null;
      if (!payload.estimator_id || !payload.salesperson_id) { errEl.textContent = 'Estimator and salesperson are required'; errEl.style.display = 'block'; return; }
      if (!payload.bid_number) { errEl.textContent = 'Bid # is required'; errEl.style.display = 'block'; return; }
    } else {
      payload.existing_bid_id = p.existing_bid.id;
    }
    try {
      await api('POST', '/api/v2/jis/apply', payload);
      ov.remove();
      await refresh();
    } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
  };
}
