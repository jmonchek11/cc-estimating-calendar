// Merge a duplicate group into the chosen survivor (real FK rewrite, admin only)
async function doMerge(kind, gid) {
  const group = (kind === 'project' ? HEALTH.dupProjects : HEALTH.dupCompanies)[gid];
  if (!group) return;
  const survivor = Number(document.getElementById(`${kind}-surv-${gid}`).value);
  const mergeIds = group.map(it => it.id).filter(id => id !== survivor);
  const keepName = group.find(it => it.id === survivor)?.name;
  if (!confirm(`Merge ${mergeIds.length} ${kind}(s) into "${keepName}"?\n\nThis rewrites the underlying records and cannot be undone (re-run the import to reset).`)) return;
  try {
    await api('POST', `/api/v2/admin/merge-${kind === 'project' ? 'projects' : 'companies'}`, { survivor_id: survivor, merge_ids: mergeIds });
    await showHealth();   // refresh the punch-list
  } catch (e) { alert('Merge failed: ' + e.message); }
}

// Mark a group as "not a duplicate" so it never re-clusters
async function doDismiss(kind, gid) {
  const group = (kind === 'project' ? HEALTH.dupProjects : HEALTH.dupCompanies)[gid];
  if (!group) return;
  try {
    await api('POST', '/api/v2/admin/dismiss-duplicate', { kind, ids: group.map(it => it.id) });
    await showHealth();
  } catch (e) { alert(e.message); }
}

// Delete every bid in a duplicate-bid group except the one chosen to keep.
async function doDeleteDupBids(gi) {
  const group = HEALTH.dupBids[gi];
  if (!group) return;
  const keepId = Number(document.getElementById(`dupbid-keep-${gi}`).value);
  const toDelete = group.bids.map(b => b.id).filter(id => id !== keepId);
  if (!toDelete.length) return;
  if (!confirm(`Delete ${toDelete.length} duplicate bid(s) (#${toDelete.join(', #')}), keeping #${keepId}?\n\nThis cannot be undone.`)) return;
  const errors = [];
  for (const id of toDelete) {
    try { await api('DELETE', `/api/v2/admin/bid/${id}`); }
    catch (e) { errors.push(`#${id}: ${e.message}`); }
  }
  if (errors.length) alert('Some deletions failed:\n' + errors.join('\n'));
  await showHealth();
}

// Renumber a change order's RFC/CO # (used to resolve a label collision that
// isn't actually a duplicate — the far more common case in real data).
async function renameCO(id) {
  const next = prompt('New RFC/CO #:');
  if (next == null || !next.trim()) return;
  try {
    await api('PATCH', `/api/v2/admin/change_order/${id}`, { co_number: next.trim() });
    await showHealth();
  } catch (e) { alert('Renumber failed: ' + e.message); }
}

// Delete a duplicate change order — only offered for active_co stage (see card copy).
async function doDeleteCO(id) {
  if (!confirm(`Delete change order #${id}? Only do this if it's truly a double-submit, not a genuine second CO that collided on a number.\n\nThis cannot be undone.`)) return;
  try {
    await api('DELETE', `/api/v2/admin/change-order/${id}`);
    await showHealth();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// Merge a duplicate-contacts group into the chosen survivor.
async function doMergeDupContacts(gi) {
  const group = HEALTH.dupContacts[gi];
  if (!group) return;
  const keepId = Number(document.getElementById(`dupcontact-keep-${gi}`).value);
  const mergeIds = group.contacts.map(c => c.id).filter(id => id !== keepId);
  if (!mergeIds.length) return;
  if (!confirm(`Merge ${mergeIds.length} contact(s) into #${keepId}?\n\nThis cannot be undone.`)) return;
  try {
    await api('POST', '/api/v2/admin/merge-contacts', { survivor_id: keepId, merge_ids: mergeIds });
    await showHealth();
  } catch (e) { alert('Merge failed: ' + e.message); }
}

// Mark a duplicate-contacts group as "not a duplicate" so it never re-clusters
async function doDismissContacts(gi) {
  const group = HEALTH.dupContacts[gi];
  if (!group) return;
  try {
    await api('POST', '/api/v2/admin/dismiss-duplicate', { kind: 'contact', ids: group.contacts.map(c => c.id) });
    await showHealth();
  } catch (e) { alert(e.message); }
}

// Merge a duplicate-jobs group into the chosen survivor.
async function doMergeDupJobs(gi) {
  const group = HEALTH.dupJobs[gi];
  if (!group) return;
  const keepId = Number(document.getElementById(`dupjob-keep-${gi}`).value);
  const mergeIds = group.jobs.map(j => j.id).filter(id => id !== keepId);
  if (!mergeIds.length) return;
  if (!confirm(`Merge ${mergeIds.length} job(s) into #${keepId}? Their change orders move to the survivor.\n\nThis cannot be undone.`)) return;
  try {
    await api('POST', '/api/v2/admin/merge-jobs', { survivor_id: keepId, merge_ids: mergeIds });
    await showHealth();
  } catch (e) { alert('Merge failed: ' + e.message); }
}

// Delete a company with zero activity anywhere.
async function doDeleteEmptyCompany(id) {
  if (!confirm('Delete this company? (Only allowed when it has no bids, contacts, or awards attached.)')) return;
  try {
    await api('DELETE', `/api/v2/admin/company/${id}`);
    await showHealth();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// Inline rename (project or company) via the admin edit route
async function renameEntity(kind, id) {
  const next = prompt(`New ${kind} name:`);
  if (next == null || !next.trim()) return;
  try {
    await api('PATCH', `/api/v2/admin/${kind}/${id}`, { name: next.trim() });
    if (typeof HEALTH === 'object') await showHealth();
  } catch (e) { alert('Rename failed: ' + e.message); }
}

// Undo a saved cleanup override (stops it replaying; re-import to fully revert)
async function undoOverride(id) {
  if (!confirm('Undo this saved cleanup? It will no longer replay on import.\n\n(For merges/renames, re-run the import to fully revert the live data; "not a duplicate" reverts immediately.)')) return;
  try {
    const r = await api('DELETE', `/api/v2/admin/override/${id}`);
    await showHealth();
    if (!r.live_reverted) alert('Removed. Re-run the import to fully revert the affected records.');
  } catch (e) { alert(e.message); }
}

// Delete a truly-empty project (no bids, no jobs, no COs)
async function deleteEmptyProject(id) {
  if (!confirm('Delete this empty project? (Only allowed when nothing is attached.)')) return;
  try {
    await api('DELETE', `/api/v2/admin/project/${id}`);
    await showHealth();
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// ═══════════════════════════════════════════════════════════════════════════
// CONTACTS — directory, profile modal (bid history + stats), company profile.
// Contact.company_id is a real FK (v1's Contact.company was free text), so
// company links and stats here are exact instead of string-matched.
// ═══════════════════════════════════════════════════════════════════════════
let CONTACTS_STATE = { rows: [], q: '', companyId: '', noCompany: false };

async function renderContacts() {
  setActiveNav('contacts');
  const main = document.getElementById('main');
  main.innerHTML = '<div style="padding:30px;color:var(--text-muted)">Loading…</div>';
  try { await ensureMeta(); CONTACTS_STATE.rows = await api('GET', '/api/v2/contacts'); }
  catch (e) { main.innerHTML = `<div class="err-card" style="margin:20px">${esc(e.message)}</div>`; return; }

  main.innerHTML = `
    <div class="page-header">
      <div><div class="page-title">👤 Contacts</div><div class="page-subtitle" id="ct-count">${CONTACTS_STATE.rows.length} contacts</div></div>
      <div style="display:flex;gap:8px">
        <button class="v2-btn outline" onclick="actNewCompany()">+ New Company</button>
        <button class="v2-btn green" onclick="actNewContact()">+ New Contact</button>
      </div>
    </div>
    <div class="card" style="padding:0">
      <div class="v2-filterbar">
        <input type="text" id="ct-q" placeholder="Search name, email, phone, company…" value="${esc(CONTACTS_STATE.q)}" oninput="onContactsFilterChange()">
        <select id="ct-company" onchange="onContactsFilterChange()">
          <option value="">All companies</option>
          ${META.companies.map(c => `<option value="${c.id}" ${String(c.id) === CONTACTS_STATE.companyId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
        </select>
        <label class="mine"><input type="checkbox" id="ct-nocompany" ${CONTACTS_STATE.noCompany ? 'checked' : ''} onchange="onContactsFilterChange()"> No company</label>
        <span class="clear-link" onclick="clearContactsFilters()">Clear</span>
      </div>
      <div id="ct-body"></div>
    </div>`;
  renderContactsBody();
}
function onContactsFilterChange() {
  CONTACTS_STATE.q = document.getElementById('ct-q')?.value || '';
  CONTACTS_STATE.companyId = document.getElementById('ct-company')?.value || '';
  CONTACTS_STATE.noCompany = !!document.getElementById('ct-nocompany')?.checked;
  renderContactsBody();
}
function clearContactsFilters() {
  CONTACTS_STATE.q = ''; CONTACTS_STATE.companyId = ''; CONTACTS_STATE.noCompany = false;
  renderContacts();
}
function renderContactsBody() {
  const { rows, q, companyId, noCompany } = CONTACTS_STATE;
  let out = rows;
  if (companyId) out = out.filter(c => String(c.company_id) === companyId);
  if (noCompany) out = out.filter(c => !c.company_id);
  if (q.trim()) { const n = q.trim().toLowerCase(); out = out.filter(c => [c.full_name, c.email, c.phone, c.company?.name].some(f => f && String(f).toLowerCase().includes(n))); }

  document.getElementById('ct-count').textContent = `${out.length} of ${rows.length} contacts`;

  // Flat, sortable table (v1's layout) — company grouping is left to the
  // search/filter above instead of visually clustering rows.
  out = [...out].sort((a, b) => a.full_name.localeCompare(b.full_name));

  document.getElementById('ct-body').innerHTML = out.length ? `
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="border-bottom:1px solid var(--border)">
        <th style="text-align:left;padding:8px 16px;color:var(--text-muted);font-weight:600;font-size:11px">Name</th>
        <th style="text-align:left;padding:8px 16px;color:var(--text-muted);font-weight:600;font-size:11px">Company</th>
        <th style="text-align:left;padding:8px 16px;color:var(--text-muted);font-weight:600;font-size:11px">Phone</th>
        <th style="text-align:left;padding:8px 16px;color:var(--text-muted);font-weight:600;font-size:11px">Email</th>
      </tr></thead>
      <tbody>${out.map(c => `
        <tr style="border-bottom:1px solid #f1f5f9">
          <td style="padding:8px 16px"><a href="#" onclick="event.preventDefault();openContactProfile(${c.id})" style="font-weight:600;color:inherit;text-decoration:none">${esc(c.full_name)}</a></td>
          <td style="padding:8px 16px">${c.company ? `<a href="#" onclick="event.preventDefault();openCompanyProfile(${c.company.id})" style="color:#2563eb;text-decoration:none">${esc(c.company.name)}</a>` : '<span style="color:var(--text-muted)">—</span>'}</td>
          <td style="padding:8px 16px">${c.phone ? esc(c.phone) : '<span style="color:var(--text-muted)">—</span>'}</td>
          <td style="padding:8px 16px">${c.email ? `<a href="mailto:${esc(c.email)}" style="color:#2563eb">${esc(c.email)}</a>` : '<span style="color:var(--text-muted)">—</span>'}</td>
        </tr>`).join('')}</tbody>
    </table>` : '<div style="padding:24px;text-align:center;color:var(--text-muted)">No matches</div>';
}

function actNewCompany() {
  showForm('+ New Company', [
    { id: 'name', label: 'Company Name', type: 'text', required: true },
    { id: 'street', label: 'Street', type: 'text' },
    { id: 'city', label: 'City', type: 'text' },
    { id: 'state', label: 'State', type: 'text', placeholder: 'PA' },
    { id: 'zip', label: 'ZIP', type: 'text' },
    { id: 'phone', label: 'Phone', type: 'text' },
    { id: 'domain', label: 'Website', type: 'text', placeholder: 'www.example.com' },
  ], async data => {
    const c = await api('POST', '/api/v2/companies', data);
    META = await api('GET', '/api/v2/meta'); CURRENT_USER = META.current_user;
    return c;
  }, 'Create Company', 'green');
}
function actNewContact(prefillCompanyId) {
  showForm('+ New Contact', [
    { id: 'first_name', label: 'First Name', type: 'text' },
    { id: 'last_name', label: 'Last Name', type: 'text' },
    { id: 'company_id', label: 'Company', type: 'project', noun: 'company', multi: false, required: true, newKey: 'new_company',

    { id: 'phone', label: 'Phone', type: 'text' },
    { id: 'email', label: 'Email', type: 'text' },
    { id: 'notes', label: 'Notes', type: 'textarea' },
  ], async data => {
    const c = await api('POST', '/api/v2/contacts', data);
    META = await api('GET', '/api/v2/meta'); CURRENT_USER = META.current_user; // pick up a brand-new company
    return c;
  }, 'Create Contact', 'green');
}

let CONTACT_DETAIL_CACHE = {};
function actEditContact(id) {
  const c = CONTACT_DETAIL_CACHE[id]; if (!c) return;
  showForm('✏️ Edit Contact', [
    { id: 'first_name', label: 'First Name', type: 'text', value: c.first_name },
    { id: 'last_name', label: 'Last Name', type: 'text', value: c.last_name },
    { id: 'company_id', label: 'Company', type: 'project', noun: 'company', multi: false, required: true, newKey: 'new_company',
      options: META.companies.map(co => ({ value: co.id, label: co.name })), value: c.company_id, placeholder: 'Type company name…' },
    { id: 'phone', label: 'Phone', type: 'text', value: c.phone },
    { id: 'email', label: 'Email', type: 'text', value: c.email },
    { id: 'notes', label: 'Notes', type: 'textarea', value: c.notes },
  ], async data => {
    await api('PATCH', `/api/v2/contacts/${c.id}`, data);
    META = await api('GET', '/api/v2/meta'); CURRENT_USER = META.current_user;
    closeProfileModal();
    if (VIEW.name === 'contacts') await renderContacts();
  }, 'Save');
}

async function actDeleteContact(id) {
  if (!confirm('Delete this contact? It will be removed from any bids it\'s linked to.')) return;
  try { await api('DELETE', `/api/v2/contacts/${id}`); closeProfileModal(); if (VIEW.name === 'contacts') await renderContacts(); }
  catch (e) { alert('Delete failed: ' + e.message); }
}

function closeProfileModal() { document.getElementById('v2-profile-overlay')?.remove(); }

const bidStatsHtml = (stats) => `

    <div class="stat-card" style="flex:1;min-width:80px"><div style="font-size:20px;font-weight:800;color:#16a34a">${stats.wins}</div><div style="font-size:11px;color:var(--text-muted)">Wins</div></div>

        <div class="proj-name">${esc(b.project)}${b.bid_number ? ` <span style="color:var(--text-muted);font-weight:400;font-size:12px">#${esc(b.bid_number)}</span>` : ''}

function openProfileModal(title, bodyHtml) {
  closeProfileModal(); closeFlyout();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-profile-overlay';
  ov.onclick = e => { if (e.target === ov) closeProfileModal(); };
  ov.innerHTML = `<div class="v2-modal" style="max-width:520px">
    <div class="v2-modal-hd">${title}<button class="v2-btn outline" onclick="closeProfileModal()">✕</button></div>
    <div class="v2-modal-bd">${bodyHtml}</div>
  </div>`;
  document.body.appendChild(ov);
}

async function openContactProfile(id) {
  openProfileModal('Loading…', '<div style="color:var(--text-muted)">Loading…</div>');
  let c, hist;
  try { [c, hist] = await Promise.all([api('GET', `/api/v2/contacts/${id}`), api('GET', `/api/v2/contacts/${id}/bids`)]); }
  catch (e) { openProfileModal('Error', `<div class="err-card">${esc(e.message)}</div>`); return; }
  CONTACT_DETAIL_CACHE[c.id] = c;

  const body = `
    <div style="font-size:13px;color:var(--text-muted);line-height:1.7">
      ${c.company ? `<span onclick="closeProfileModal();openCompanyProfile(${c.company.id})" style="cursor:pointer;color:#2563eb;font-weight:600">🏢 ${esc(c.company.name)}</span><br>` : ''}
      ${c.phone ? `📞 ${esc(c.phone)}<br>` : ''}
      ${c.email ? `✉️ ${esc(c.email)}<br>` : ''}
      ${c.notes ? `📝 ${esc(c.notes)}` : ''}
    </div>
    ${bidStatsHtml(hist.stats)}
    <div style="font-weight:700;font-size:13px;margin:12px 0 4px">Bid History</div>
    <div class="card" style="padding:0;max-height:280px;overflow-y:auto">${bidHistoryRowsHtml(hist.bids)}</div>
    <div class="v2-actions" style="margin-top:12px">
      <button class="v2-btn outline" onclick="actEditContact(${c.id})">✏️ Edit</button>
      <button class="v2-btn red" onclick="actDeleteContact(${c.id})">🗑 Delete</button>

  openProfileModal(`👤 ${esc(c.full_name)}`, body);
}

async function openCompanyProfile(companyId) {
  openProfileModal('Loading…', '<div style="color:var(--text-muted)">Loading…</div>');

      <div class="proj-row" onclick="closeProfileModal();openContactProfile(${c.id})">
        <div style="flex:1;min-width:0"><div class="proj-name" style="font-size:13px">${esc(c.full_name)}</div>

// Per-customer contacts inside the bid flyout — pick from contacts already at
// that company, or add a brand-new one, without leaving the flyout.
function bidCustomerContactsHtml(cust) {
  const chips = (cust.contacts || []).map(ct => `
    <span class="v2-chip" style="background:#f8fafc;color:var(--text);border-color:var(--border)" onclick="openContactProfile(${ct.id})">
      👤 ${esc(ct.full_name)}<button type="button" onclick="event.stopPropagation();actUnlinkContact(${cust.bid_customer_id},${ct.id})">✕</button>
    </span>`).join('');
  return `<div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px">
    ${chips}
    <button type="button" class="v2-btn outline" style="padding:2px 9px;font-size:11px" onclick="event.stopPropagation();actLinkContact(${cust.bid_customer_id},${cust.id})">+ Contact</button>
  </div>`;
}
async function actLinkContact(bidCustomerId, companyId) {
  const existing = await api('GET', `/api/v2/contacts?company_id=${companyId}`);
  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.innerHTML = `
    <div class="v2-modal" style="max-width:400px">
      <div class="v2-modal-hd">Link a Contact<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">
        ${existing.length ? `
        <div class="v2-field"><label>Existing contact at this company</label>
          <select id="lc-existing" onchange="document.getElementById('lc-new-block').style.display = this.value ? 'none' : 'block'">
            <option value="">— pick one —</option>
            ${existing.map(c => `<option value="${c.id}">${esc(c.full_name)}</option>`).join('')}
          </select>
        </div>
        <div style="text-align:center;color:var(--text-muted);font-size:12px;margin:10px 0">— or add someone new —</div>` : ''}
        <div id="lc-new-block">
          <div class="v2-field"><label>First Name</label><input id="lc-first" type="text"></div>
          <div class="v2-field"><label>Last Name</label><input id="lc-last" type="text"></div>
          <div class="v2-field"><label>Phone</label><input id="lc-phone" type="text"></div>
          <div class="v2-field"><label>Email</label><input id="lc-email" type="text"></div>
        </div>
      </div>
      <div class="v2-modal-err" id="vf-err"></div>
      <div class="v2-modal-ft">
        <button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">Cancel</button>
        <button class="v2-btn blue" id="lc-submit">Link</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  document.getElementById('lc-submit').onclick = async () => {
    const errEl = document.getElementById('vf-err');
    errEl.style.display = 'none';
    const existingId = document.getElementById('lc-existing')?.value;
    try {
      let contactId;
      if (existingId) {
        contactId = Number(existingId);
      } else {
        const first = document.getElementById('lc-first').value.trim();
        const last = document.getElementById('lc-last').value.trim();
        if (!first && !last) { errEl.textContent = 'Pick an existing contact, or enter a name for a new one.'; errEl.style.display = 'block'; return; }
        const phone = document.getElementById('lc-phone').value.trim();
        const email = document.getElementById('lc-email').value.trim();
        const created = await api('POST', '/api/v2/contacts', { company_id: companyId, first_name: first || null, last_name: last || null, phone: phone || null, email: email || null });
        contactId = created.id;
      }
      await api('POST', `/api/v2/bid-customers/${bidCustomerId}/contacts`, { contact_id: contactId });
      ov.remove();
      await refresh();
    } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
  };
}
async function actUnlinkContact(bidCustomerId, contactId) {
  try { await api('DELETE', `/api/v2/bid-customers/${bidCustomerId}/contacts/${contactId}`); await refresh(); }
  catch (e) { alert('Failed: ' + e.message); }
}
async function actRemoveBidCustomer(bidCustomerId, name) {
  if (!confirm(`Remove ${name} from this bid? Only works if they haven't been submitted to yet.`)) return;
  try { await api('DELETE', `/api/v2/bid-customers/${bidCustomerId}`); await refresh(); }
  catch (e) { alert('Failed: ' + e.message); }
}

// IMPORT BID FROM JIS (Job Information Sheet) — upload → preview → apply.

let JIS_PREVIEW = null;

function actImportJIS() {
  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.innerHTML = `
    <div class="v2-modal" style="max-width:420px">
      <div class="v2-modal-hd">📄 Import Bid from JIS<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">
        <p style="font-size:13px;color:var(--text-muted);margin:0">Upload a filled-out Job Information Sheet (.xlsx). Its "Title Sheet" tab will be read and matched against existing projects, team members, companies, and contacts — nothing is saved until you review and confirm.</p>
        <input type="file" id="jis-file-input" accept=".xlsx" style="font-size:13px">
        <div id="jis-upload-err" style="color:#dc2626;font-size:12px;display:none"></div>
      </div>
      <div class="v2-modal-ft">
        <button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">Cancel</button>
        <button class="v2-btn amber" id="jis-upload-btn">Read File →</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  document.getElementById('jis-upload-btn').onclick = async () => {
    const input = document.getElementById('jis-file-input');
    const errEl = document.getElementById('jis-upload-err');
    if (!input.files.length) { errEl.textContent = 'Choose a file first'; errEl.style.display = 'block'; return; }
    const file = input.files[0];
    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const preview = await api('POST', '/api/v2/jis/preview', { file_base64: base64 });
      JIS_PREVIEW = preview;
      ov.remove();
      renderJISReview(preview);
    } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
  };
}

function renderJISReview(p) {
  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.onclick = e => { if (e.target === ov) ov.remove(); };

  const isNewBid = !p.existing_bid;
  const bidBanner = p.existing_bid
    ? `<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#1e40af">
        This bid # already exists (<strong>${esc(p.existing_bid.bid_number)}</strong>, stage: ${STAGE[p.existing_bid.stage] || p.existing_bid.stage}) — this will <strong>enrich</strong> it (address, drawings, GC companies/contacts) without touching its stage, estimator, or due date.
      </div>`
    : `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#92400e">No existing bid found for # <strong>${esc(p.bid_number || '(none parsed)')}</strong> — a new bid will be created.</div>`;

  const projectField = isNewBid ? `
    <div class="v2-field"><label>Project</label>
      <div class="v2-combo">
        <div class="v2-combo-box"><span id="cc-jis_project-chips"></span>
          <input id="vf-jis_project" class="v2-combo-input" type="text" autocomplete="off" placeholder="Type project name…" value="${esc(p.job_name || '')}">
        </div>
        <div class="v2-combo-menu" id="cc-jis_project-menu"></div>
      </div>
    </div>` : '';

  const teamField = (label, jisInfo, fieldId) => isNewBid ? `
    <div class="v2-field"><label>${label}${jisInfo.jis_name ? ` <span style="font-weight:400;color:var(--text-muted)">(JIS: ${esc(jisInfo.jis_name)})</span>` : ''}</label>
      <select id="vf-${fieldId}">
        <option value="">—</option>
        ${teamOpts().map(o => `<option value="${o.value}" ${jisInfo.matched?.id === o.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
      </select>
    </div>` : '';

  const gcCard = (gc, i) => `
    <div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:8px">
      <div style="font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        🏢 ${esc(gc.jis_name)}
        ${gc.matched_company ? `<span class="badge" style="background:#dcfce7;color:#16a34a">✓ matches existing</span>` : `<span class="badge" style="background:#fef3c7;color:#b45309">🆕 will create</span>`}
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px">
        ${[gc.street, [gc.city, gc.state, gc.zip].filter(Boolean).join(', ')].filter(Boolean).join(' · ')}
        ${gc.phone ? ` · ${esc(gc.phone)}` : ''}
      </div>
      ${gc.poc ? `<div style="font-size:12px;margin-top:5px;padding-top:5px;border-top:1px solid var(--border)">
        👤 ${esc(gc.poc.jis_name)} ${gc.poc.matched_contact ? `<span class="badge" style="background:#dcfce7;color:#16a34a;font-size:10px">✓ existing contact</span>` : `<span class="badge" style="background:#fef3c7;color:#b45309;font-size:10px">🆕 new contact</span>`}
        <div style="color:var(--text-muted)">${gc.poc.phone ? esc(gc.poc.phone) : ''}${gc.poc.phone && gc.poc.email ? ' · ' : ''}${gc.poc.email ? esc(gc.poc.email) : ''}</div>
      </div>` : ''}
    </div>`;

  ov.innerHTML = `
    <div class="v2-modal" style="max-width:560px">
      <div class="v2-modal-hd">📄 Review JIS Import<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">
        ${bidBanner}
        ${projectField}
        <div class="v2-field"><label>Bid # ${isNewBid ? '<span class="req">*</span>' : ''}</label><input id="vf-jis_bid_number" type="text" value="${esc(p.bid_number || '')}" ${isNewBid ? '' : 'disabled'}></div>
        <div class="v2-field"><label>Due Date</label><input id="vf-jis_due_date" type="date" value="${esc(p.due_date || '')}" ${isNewBid ? '' : 'disabled'}></div>
        <div class="v2-field"><label>Drawings</label><textarea id="vf-jis_drawings" rows="2" placeholder="Drawing set description…">${esc(p.drawings || '')}</textarea></div>
        <div class="v2-field"><label>Job Address</label>
          <input id="vf-jis_street" type="text" placeholder="Street" value="${esc(p.address?.street || '')}" style="margin-bottom:6px">
          <div style="display:flex;gap:6px">
            <input id="vf-jis_city" type="text" placeholder="City" value="${esc(p.address?.city || '')}" style="flex:2">
            <input id="vf-jis_state" type="text" placeholder="ST" value="${esc(p.address?.state || '')}" style="flex:1">
            <input id="vf-jis_zip" type="text" placeholder="ZIP" value="${esc(p.address?.zip || '')}" style="flex:1">
          </div>
        </div>
        ${teamField('Estimator', p.estimator, 'jis_estimator')}
        ${teamField('Salesperson', p.salesperson, 'jis_salesperson')}
        <div style="font-weight:700;font-size:13px;margin-top:6px">Customers (GCs) — ${p.gcs.length}</div>
        ${p.gcs.length ? p.gcs.map(gcCard).join('') : '<div style="color:var(--text-muted);font-size:13px">None found on the Title Sheet.</div>'}
      </div>
      <div class="v2-modal-err" id="jis-apply-err"></div>
      <div class="v2-modal-ft">
        <button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">Cancel</button>
        <button class="v2-btn amber" id="jis-apply-btn">${isNewBid ? 'Create Bid' : 'Enrich Bid'}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  if (isNewBid) initCombos(ov, [{ id: 'jis_project', type: 'project', multi: false, options: projectOpts(), value: null }]);

  document.getElementById('jis-apply-btn').onclick = async () => {
    const errEl = document.getElementById('jis-apply-err');
    const payload = {
      bid_number: document.getElementById('vf-jis_bid_number')?.value?.trim() || p.bid_number,
      due_date: document.getElementById('vf-jis_due_date')?.value || p.due_date,
      drawings: document.getElementById('vf-jis_drawings')?.value?.trim() || null,
      address: {
        street: document.getElementById('vf-jis_street')?.value?.trim() || null,
        city: document.getElementById('vf-jis_city')?.value?.trim() || null,
        state: document.getElementById('vf-jis_state')?.value?.trim() || null,
        zip: document.getElementById('vf-jis_zip')?.value?.trim() || null,
      },
      gcs: p.gcs.map(gc => ({
        company_id: gc.matched_company?.id || null,
        jis_name: gc.jis_name, street: gc.street, city: gc.city, state: gc.state, zip: gc.zip, phone: gc.phone, domain: gc.domain,
        poc: gc.poc ? { contact_id: gc.poc.matched_contact?.id || null, jis_name: gc.poc.jis_name, phone: gc.poc.phone, email: gc.poc.email } : null,
      })),
    };
    if (isNewBid) {
      const sel = COMBO_STATE['jis_project'] || [];
      payload.project_id = sel[0]?.id || null;
      payload.project_name = sel[0] && !sel[0].id ? sel[0].name : null;
      if (!payload.project_id && !payload.project_name) { errEl.textContent = 'Project is required'; errEl.style.display = 'block'; return; }
      payload.estimator_id = document.getElementById('vf-jis_estimator')?.value || null;
      payload.salesperson_id = document.getElementById('vf-jis_salesperson')?.value || null;
      if (!payload.estimator_id || !payload.salesperson_id) { errEl.textContent = 'Estimator and salesperson are required'; errEl.style.display = 'block'; return; }
      if (!payload.bid_number) { errEl.textContent = 'Bid # is required'; errEl.style.display = 'block'; return; }
    } else {
      payload.existing_bid_id = p.existing_bid.id;
    }
    try {
      await api('POST', '/api/v2/jis/apply', payload);
      ov.remove();
      await refresh();
    } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
  };
}

async function actLogout() {
  try { await fetch('/api/auth/logout', { method: 'POST' }); } catch {}
  // Login itself still lives on /legacy, but bring them straight back to v2
  // once they've signed in — same returnTo mechanism ensureMeta() uses.
  window.location.href = '/legacy?returnTo=' + encodeURIComponent('/');
}

// ── Online presence — reuses v1's /api/heartbeat + /api/online (global,
// not v2-specific) so anyone signed in shows up regardless of which
// frontend they're using. ────────────────────────────────────────────────
let _onlinePollTimer = null;
function startOnlinePolling() {
  if (_onlinePollTimer) return;
  const tick = async () => {
    try {
      await fetch('/api/heartbeat', { method: 'POST' });
      const users = await (await fetch('/api/online')).json();
      const label = document.getElementById('online-count-label');
      if (label) label.textContent = `${users.length} online`;
    } catch { /* transient — next tick will retry */ }
  };
  tick();
  _onlinePollTimer = setInterval(tick, 60_000);
}
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const mins = Math.round((Date.now() - new Date(dateStr).getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins === 1) return '1 min ago';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  return `${hrs} hr${hrs !== 1 ? 's' : ''} ago`;
}
async function openOnlinePanel() {
  let users;
  try { users = await api('GET', '/api/online'); } catch (e) { alert(e.message); return; }
  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.innerHTML = `
    <div class="v2-modal" style="max-width:340px">
      <div class="v2-modal-hd">🟢 Who's Online<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">
        ${users.length ? users.map(u => `
          <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
            <span class="initials-pill">${esc(u.initials)}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600">${esc(u.name)}</div>
              <div style="font-size:11px;color:var(--text-muted);text-transform:capitalize">${esc(u.role || '')}</div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);flex-shrink:0">${timeAgo(u.last_seen)}</div>
          </div>`).join('')
        : '<div style="font-size:13px;color:var(--text-muted);padding:8px 0">No one else is online right now.</div>'}
      </div>
    </div>`;
  document.body.appendChild(ov);
}

// ── Ideas / Issues — reuses v1's /api/ideas (global) ─────────────────────
const IDEA_PAGE_NAMES = {
  dashboard: 'Dashboard', digest: 'Weekly Digest', calendar: 'Calendar',
  opportunities: 'Opportunities', 'active-bids': 'Active Bids', 'submitted-bids': 'Submitted Bids',
  'active-cos': 'Active Change Orders', 'submitted-cos': 'Submitted Change Orders',
  projects: 'Projects', contacts: 'Contacts', health: 'Data Health', settings: 'Settings',
};
async function openIdeasModal() {
  const isAdmin = !!CURRENT_USER?.is_admin;
  let ideas = [];
  if (isAdmin) { try { ideas = await api('GET', '/api/ideas'); } catch { ideas = []; } }
  const statusLabel = s => ({ new: 'New', reviewed: 'Reviewed', done: 'Done', wontfix: "Won't Fix" }[s] || s);
  const typeIcon = t => t === 'issue' ? '🐛' : '💡';

  const adminInbox = isAdmin ? `
    <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">📥 Submitted (${ideas.length})</div>
      ${ideas.length ? ideas.map(i => `
        <div style="padding:8px 0;border-bottom:1px solid #f1f5f9">
          <div style="display:flex;align-items:flex-start;gap:8px">
            <span style="font-size:16px;flex-shrink:0">${typeIcon(i.type)}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600">${esc(i.title)}</div>
              ${i.body ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px">${esc(i.body)}</div>` : ''}
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px">
                ${i.submitted_by_name ? esc(i.submitted_by_name) : 'Anonymous'} · ${fmtD((i.created_at || '').slice(0, 10))}
                ${i.page ? ` · <span style="background:#f1f5f9;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600">${esc(IDEA_PAGE_NAMES[i.page] || i.page)}</span>` : ''}
              </div>
            </div>
            <select style="font-size:11px;border-radius:4px;padding:2px 4px;border:1px solid var(--border);cursor:pointer;flex-shrink:0" onchange="updateIdeaStatus(${i.id}, this.value)">
              ${['new', 'reviewed', 'done', 'wontfix'].map(s => `<option value="${s}" ${i.status === s ? 'selected' : ''}>${statusLabel(s)}</option>`).join('')}
            </select>
          </div>
        </div>`).join('') : '<div style="font-size:13px;color:var(--text-muted)">No submissions yet.</div>'}
    </div>` : '';

  document.getElementById('v2-form-overlay')?.remove();
  const ov = document.createElement('div');
  ov.className = 'v2-overlay'; ov.id = 'v2-form-overlay';
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  const currentPage = (location.hash || '#dashboard').replace('#', '').split('/')[0];
  ov.innerHTML = `
    <div class="v2-modal" style="max-width:480px;max-height:85vh;overflow-y:auto">
      <div class="v2-modal-hd">💡 Ideas &amp; Issues<button class="v2-btn outline" onclick="document.getElementById('v2-form-overlay').remove()">✕</button></div>
      <div class="v2-modal-bd">
        <p style="font-size:13px;color:var(--text-muted);margin:0 0 12px">Have an idea to improve the app, or spotted something broken? Send it straight to the admin.</p>
        <div class="v2-field"><label>Type</label>
          <div style="display:flex;gap:14px">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="idea-type" value="idea" checked> 💡 Idea / Enhancement</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="radio" name="idea-type" value="issue"> 🐛 Bug / Issue</label>
          </div>
        </div>
        <div class="v2-field"><label>Related to</label>
          <select id="idea-page">
            ${Object.entries(IDEA_PAGE_NAMES).map(([v, l]) => `<option value="${v}" ${currentPage === v ? 'selected' : ''}>${l}</option>`).join('')}
            <option value="general" ${!IDEA_PAGE_NAMES[currentPage] ? 'selected' : ''}>General / Not page-specific</option>
          </select>
        </div>
        <div class="v2-field"><label>Title <span class="req">*</span></label><input id="idea-title" type="text" placeholder="One line summary…"></div>
        <div class="v2-field"><label>Details</label><textarea id="idea-body" rows="3" placeholder="Any extra context, steps to reproduce, etc."></textarea></div>
        <div style="display:flex;justify-content:flex-end;margin-top:6px"><button class="v2-btn blue" onclick="submitIdea()">Submit</button></div>
        ${adminInbox}
      </div>
    </div>`;
  document.body.appendChild(ov);
}
async function submitIdea() {
  const title = document.getElementById('idea-title')?.value.trim();
  if (!title) { document.getElementById('idea-title')?.focus(); return; }
  const type = document.querySelector('input[name="idea-type"]:checked')?.value || 'idea';
  const body = document.getElementById('idea-body')?.value.trim() || '';
  const page = document.getElementById('idea-page')?.value || null;
  try {
    await api('POST', '/api/ideas', { type, title, body, page });
    document.getElementById('v2-form-overlay')?.remove();
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#166534;color:white;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999';
    toast.textContent = '✓ Submitted — thanks!';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  } catch (e) { alert('Failed: ' + e.message); }
}
async function updateIdeaStatus(id, status) {
  try { await api('PUT', `/api/ideas/${id}`, { status }); } catch (e) { alert(e.message); }
}

async function bootstrap() {
  try { await ensureMeta(); } catch { /* not logged in — ensureMeta already redirected, or a real error will surface per-page */ }
  const userEl = document.getElementById('sidebar-user');
  if (userEl && CURRENT_USER) userEl.textContent = CURRENT_USER.name + (CURRENT_USER.is_admin ? ' (admin)' : '');
  if (CURRENT_USER) startOnlinePolling();
  const historyNav = document.getElementById('nav-history');
  if (historyNav && CURRENT_USER?.is_admin) historyNav.style.display = 'flex';
  navigate('dashboard');
}
bootstrap();
</script>
